<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz 3.0</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jazz 3.0">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    /* "Graphite" theme -- neutral charcoal ground, soft-white primary accent,
       pastel blue (AM) and pink (PM). Token names predate the palette
       (--gold = AM, --navy = PM, --olive = primary accent); every color in the
       app derives from these, so a theme swap only touches this block. */
    --bg:#0c0c0d;
    --surface:#161618;
    --surface-2:#1d1d20;
    --surface-3:#232327;
    --line:#2c2c31;
    --text:#f2f2f3;
    --text-dim:#8e8e96;
    --gold:#93c5fd;
    --navy:#f9a8d4;
    --olive:#f2f2f3;
    --olive-dim:#4b4d52;
    --danger:#f87171;
    --danger-text:#fecaca;
    --on-accent:#111113;   /* text/glyphs drawn on top of --olive fills */
    --link:#93c5fd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button{cursor:pointer;}
  .box, .subitem-box{cursor:pointer;}
  html{color-scheme:dark;} /* dark native scrollbars, select dropdowns, etc. */
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none;}
  body{display:flex; flex-direction:column;}

  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim); font-weight:600;
  }
  .header-meta{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:2px; flex-shrink:0;}
  /* Desktop stand-in for pull-to-refresh (a touch-only gesture): same
     hardRefresh() escape hatch, hidden below the desktop breakpoint. */
  .hard-refresh-btn{
    display:none; width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:none; color:var(--text-dim); align-items:center; justify-content:center; flex-shrink:0;
  }
  .hard-refresh-btn.spinning svg{animation:spin .8s linear infinite;}
  /* Gist sync status button — shown on every size (phones need to connect too).
     data-state: off (dim) / busy (pulsing) / ok (lime) / error (red). */
  .sync-btn{
    display:flex; width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:none; color:var(--text-dim); align-items:center; justify-content:center; flex-shrink:0;
  }
  .sync-btn[data-state="ok"]{color:var(--olive); border-color:var(--olive-dim);}
  .sync-btn[data-state="error"]{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, transparent);}
  .sync-btn[data-state="busy"] svg{animation:pulse 1.1s ease-in-out infinite;}
  .modal-note{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:0 0 12px;}
  .modal-note a{color:var(--olive);}
  header h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.01em;}
  .header-row{display:flex; align-items:center; gap:12px;}

  main{flex:1; overflow-y:auto; padding:16px 16px 100px;}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10px; font-family:inherit; font-weight:600;
    letter-spacing:.02em; padding:6px 2px; border-radius:10px;
  }
  nav.tabbar button svg{width:21px; height:21px;}
  nav.tabbar button.active{color:var(--olive);}
  nav.tabbar button.active svg{stroke:var(--olive);}

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-bottom:12px;
  }
  .card h2{margin:0 0 10px; font-size:15px; font-weight:700;}
  .card h3{margin:0 0 8px; font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}

  .pinned{border-color:var(--line); background:var(--surface); padding:0; overflow:hidden;}
  .pinned .coll-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px; cursor:pointer;
  }
  .pinned .coll-head h3{margin:0;}
  .pinned .chev{transition:transform .2s; color:var(--text-dim); flex-shrink:0;}
  .pinned.open .chev{transform:rotate(180deg);}
  .pinned .coll-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .pinned.open .coll-body{max-height:3000px;}
  .pinned .coll-inner{padding:0 16px 16px;}

  .rule{font-size:13.5px; line-height:1.5; color:var(--text); margin:0 0 8px; padding-left:14px; position:relative;}
  .rule:before{content:"·"; position:absolute; left:0; color:var(--olive); font-weight:900;}
  .rule:last-child{margin-bottom:0;}


  .band{padding:12px 16px;}
  .band.am{border-left:3px solid var(--gold);}
  .band.pm{border-left:3px solid var(--navy); border-top:1px solid var(--line);}
  .band .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:8px;}
  .band.am .label{color:var(--gold);}
  .band.pm .label{color:var(--navy);}
  .step{font-size:13px; line-height:1.45; margin-bottom:7px; display:flex; gap:8px;}
  .step:last-child{margin-bottom:0;}
  .step .n{color:var(--text-dim); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .step b{font-weight:600;}
  .step .note{color:var(--text-dim); font-size:12px; display:block;}

  /* checklist items */
  .item{display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .body{flex:1; order:1;}
  .box{
    width:21px; height:21px; border-radius:6px; border:1.5px solid var(--text-dim);
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s; order:2;
  }
  .item .title{font-size:13.5px; font-weight:600; line-height:1.35;}
  .item.checked .box{background:var(--olive); border-color:var(--olive);}
  .box svg{width:13px; height:13px; opacity:0; transition:opacity .15s;}
  .box, .subitem-box{color:var(--on-accent);}
  .item.checked .box svg{opacity:1;}
  .item.checked .title{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .item .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .badge{display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:1px;}
  .badge.pending{background:color-mix(in srgb, var(--gold) 18%, transparent); color:var(--gold);}

  .glance-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .glance-head h3{margin:0;}

  /* home: week strip + day agenda */
  .home-cal{margin:0 0 18px; padding:12px 10px 2px; touch-action:none; background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:0 6px 18px rgba(0,0,0,.18);}
  .home-cal-head{display:flex; align-items:center; gap:2px; margin:0 -2px 2px 6px;}
  .home-cal-title{flex:1; font-size:15px; font-weight:800;}
  .home-cal-today{border:1px solid var(--line); background:none; color:var(--text); font:inherit; font-size:12px; font-weight:700; padding:5px 11px; border-radius:14px; margin-right:4px;}
  .home-cal .cal-nav{width:38px; height:38px;}
  .home-week, .home-month{display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;}
  .home-month{gap:2px 4px;}
  .home-cal.anim .home-week, .home-cal.anim .home-month{animation:homeCalIn .22s ease-out;}
  @keyframes homeCalIn{from{opacity:0; transform:translateY(-8px);}}
  .home-day{
    display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; padding:8px 0 6px;
    border:none; border-radius:12px; background:none; color:var(--text-dim); font:inherit;
    font-size:10.5px; font-weight:700;
  }
  .home-day b{font-size:16px; font-weight:800; color:var(--text); line-height:1.1;}
  .home-month .home-day{padding:6px 0 4px; gap:2px;}
  .home-month .home-day b{font-size:14.5px; font-weight:700;}
  .home-day.today:not(.on){box-shadow:inset 0 0 0 1px var(--line);}
  .home-day.past:not(.on){opacity:.5;}
  .home-day.blank{visibility:hidden;}
  .home-day.holiday:not(.on) b{color:var(--gold);}
  .holiday-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .holiday-chip{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--gold); padding:3px 9px; border-radius:9px; background:color-mix(in srgb, var(--gold) 14%, transparent);}
  .holiday-chip svg{width:11px; height:11px;}
  .holiday-chip em{font-style:normal; font-weight:600; opacity:.8;}
  .bcal-detail .holiday-chips{margin:0 2px 8px;}
  .home-day.other:not(.on), .bcal .home-day.other{opacity:.28;}
  .home-day.on{background:var(--olive); color:var(--on-accent);}
  .home-day.on b{color:var(--on-accent);}
  .home-day .marks{display:flex; align-items:center; gap:2px; height:9px;}
  .home-day .marks i{width:5px; height:5px; border-radius:50%; background:var(--gold);}
  .home-day .marks i.paid{background:var(--olive);}
  .home-day .marks i.over{background:var(--danger);}
  .home-day .marks em.pay, .bcal-pay em.pay{font-style:normal; font-size:9.5px; font-weight:900; line-height:1; color:var(--olive);}
  .home-day.on .marks i.paid, .home-day.on .marks i.over, .home-day.on .marks em.pay{opacity:1;}
  .bcal .home-day.past:not(.on){opacity:.8;}
  .bcal .home-day.other:not(.on){opacity:.55;}
  .bcal-wrap{touch-action:none;}
  button.period-sec{width:100%; border:none; background:none; font-family:inherit; cursor:pointer; padding:0;}
  button.period-sec .chev{width:13px; height:13px; margin-left:6px; vertical-align:-2px; transition:transform .2s;}
  button.period-sec[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .period-row{display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; padding:13px 16px; margin-bottom:0;
    border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; text-align:left; cursor:pointer;}
  .period-row b{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;}
  .period-row i{display:block; font-style:normal; font-size:12px; color:var(--text-dim); margin-top:2px;}
  .period-row-left{text-align:right; font-weight:800; font-variant-numeric:tabular-nums; color:var(--olive);}
  .period-row-left.over{color:var(--danger);}
  .card.manage{padding:12px 16px 6px; margin-top:12px;}
  .budget-kpis.four{grid-template-columns:1fr 1fr;}
  .budget-kpis.four button.budget-kpi{font:inherit; color:inherit; text-align:left; cursor:pointer; padding:12px 14px;}
  .coll-head .insight:empty{display:none;}
  .budget-kpi.good b{color:var(--olive);}
  .budget-kpi.goal b{color:var(--link);}
  .btab-head{display:grid; grid-template-columns:44px 1fr auto 40px; gap:6px; padding:0 2px 6px; border-bottom:1px solid var(--line);
    font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--text-dim);}
  .btab-head span:nth-child(3){text-align:right;}
  .btab-head span:nth-child(4){text-align:center;}
  .btab-row{display:grid; grid-template-columns:44px 1fr auto 40px; gap:6px; align-items:center; min-height:52px; padding:4px 2px;
    border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent);}
  .btab-due{font-size:12.5px; font-weight:700; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .btab-row.over .btab-due{color:var(--danger);}
  .btab-name{min-width:0; cursor:pointer; padding:0 !important;}
  .btab-name .title{display:flex; align-items:center; font-size:14px; font-weight:600;}
  .btab-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .btab-name .todo-meta{margin-top:2px;}
  .btab-amt{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
  .btab-row .todo-check{width:40px; height:44px;}
  .btab-row > *, .pp-head > *{order:0 !important;} /* the shared checkbox styles reorder flex items */
  .btab-row.checked .box{background:var(--olive); border-color:var(--olive);}
  .btab-row.checked .box svg{opacity:1;}
  .btab-row.checked .bill-logo{opacity:.55;}
  .btab-row.checked .btab-text, .btab-row.checked .btab-amt, .btab-row.checked .btab-due{text-decoration:line-through; color:var(--text-dim);}
  .btab-row.checked .btab-text{opacity:.8;}
  .btab-later{display:block; width:40px;}
  .btab-total{display:flex; justify-content:space-between; padding:10px 2px 4px; font-weight:800;}
  .btab-total b{font-variant-numeric:tabular-nums;}
  .pp{padding:4px 0 10px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .pp:last-child{border-bottom:none; margin-bottom:0;}
  .pp-head{display:flex; align-items:center; gap:6px; padding:4px 2px 6px;}
  .pp-head .todo-check{width:34px; margin-left:-6px;}
  .pp-head.got .box{background:var(--olive); border-color:var(--olive);}
  .pp-head.got .box svg{opacity:1;}
  .pp-title{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; padding:0; border:none; background:none; color:var(--olive); font:inherit; text-align:left; cursor:pointer;}
  .pp-title span{font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:6px; text-transform:none;}
  .pp-title em{font-style:normal; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:7px; background:var(--text); color:var(--bg);}
  .pp-title i{font-style:normal; font-size:11.5px; font-weight:600; color:var(--text-dim);}
  .pp-head.got .pp-title i{color:var(--olive);}
  .pp-head > b{font-size:15px; font-weight:800; color:var(--olive); font-variant-numeric:tabular-nums;}
  .pp-left{display:flex; justify-content:space-between; margin-top:6px; padding:8px 10px; border-radius:10px; background:var(--surface-2); font-weight:800; font-size:13.5px;}
  .pp-left b{font-variant-numeric:tabular-nums;}
  .pp-left.over b{color:var(--danger);}
  .glance > div{display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); font-size:14px;}
  .glance > div b{font-variant-numeric:tabular-nums; font-weight:700;}
  .glance-note{display:block; font-style:normal; font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .glance .glance-total{border-bottom:none; font-weight:800; font-size:15px;}
  .glance .glance-total b{color:var(--olive); font-weight:800;}
  .glance .glance-total.over b{color:var(--danger);}
  .manage-row{display:flex; align-items:center; gap:10px; width:100%; padding:13px 2px; border:none; border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent);
    background:none; color:var(--text); font:inherit; font-size:14px; font-weight:600; text-align:left; cursor:pointer;}
  .manage .budget-sub + .manage-row, .manage > .manage-row:first-child{border-top:none;}
  .budget-manage-link{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin:6px 0 4px; padding:12px; border:none; background:none;
    color:var(--text-dim); font:inherit; font-size:12.5px; font-weight:700; opacity:.8;}
  .budget-manage-link svg{width:14px; height:14px;}
  .budget-manage-link em{font-style:normal; font-weight:600; opacity:.75;}
  .budget-manage-link em::before{content:"· "; }
  .manage-row > span:first-child{flex:1; min-width:0;}
  .manage-val{color:var(--text-dim); font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%;}
  .manage-row .chev-r{color:var(--text-dim); flex-shrink:0;}
  .modal-note .goal-ideas{display:flex; flex-wrap:wrap; gap:6px; margin:0;}
  .modal-note .goal-ideas .acct-add{margin:0;} /* past days stay readable: they carry paid/overdue dots */
  .bcal-detail{margin-top:6px; border-top:1px solid var(--line);}
  .bcal-pay{display:flex; justify-content:space-between; align-items:center; width:100%; padding:11px 2px; border:none; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent);
    background:none; color:var(--text); font:inherit; font-size:14px; font-weight:700; text-align:left;}
  .bcal-pay em.pay{font-size:12px; margin-right:8px;}
  .home-day .marks svg{width:9px; height:9px; color:var(--navy); stroke-width:2.6;}
  .home-day.on .marks i{background:var(--on-accent);}
  .home-day.on .marks svg{color:var(--on-accent);}
  .home-cal-grab{display:flex; justify-content:center; width:100%; padding:8px 0 2px; border:none; background:none;}
  .home-cal-grab span{width:36px; height:4px; border-radius:2px; background:var(--line);}
  .home-hero{display:flex; align-items:center; gap:14px; margin:0 2px 14px;}
  .home-hero h2{margin:0; font-size:22px; font-weight:800; letter-spacing:-.01em; line-height:1.2;}
  .home-hero .sub{color:var(--text-dim); font-size:13px; margin-top:3px;}
  .home-ring{width:58px; height:58px; flex-shrink:0;}
  .home-sec{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:16px 2px 6px;}
  .home-hero + .home-sec{margin-top:6px;}
  .home-sec.overdue{color:var(--danger);}
  .home-list{padding-top:2px; padding-bottom:2px; margin-bottom:0;}
  .home-list .todo-wrap:last-of-type{border-bottom:none;}
  .home-list .empty{padding:14px 0;}
  .row-icon{order:1; display:flex; align-items:center; justify-content:center; width:40px; height:44px; flex-shrink:0; color:var(--text-dim);}
  .row-icon svg{width:17px; height:17px;}
  .repeat-meta{display:inline-flex; align-items:center; gap:4px;}
  .repeat-meta svg{width:11px; height:11px;}
  .recurring-row{cursor:pointer; padding:0; gap:0; align-items:center;}
  .recurring-row .body{order:2; flex:1; min-width:0; padding:12px 6px 12px 2px;}
  .wash-title{display:flex; align-items:center; gap:6px; color:var(--navy);} /* same color + droplet as wash days on Home's calendar */
  .wash-title svg{width:15px; height:15px; flex-shrink:0;}
  .home-star{display:inline-flex; vertical-align:-2px; margin-left:6px; color:var(--gold);}
  .home-star svg{width:13px; height:13px;}
  .home-more{display:block; border:none; background:none; padding:10px 0 6px; color:var(--link); font:inherit; font-size:12.5px; font-weight:700;}
  .home-all{margin:6px 2px 0;}


  /* budget */
  .budget-month{display:flex; align-items:center; justify-content:space-between; margin:-6px -6px 6px; font-size:15px; font-weight:800;}
  .budget-kpis{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
  .budget-kpi{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px; min-width:0;}
  .budget-kpi span{display:block; font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--text-dim);}
  .budget-kpi b{display:block; font-size:22px; font-weight:800; letter-spacing:-.01em; margin-top:2px; font-variant-numeric:tabular-nums;}
  .budget-kpi i{display:block; font-style:normal; font-size:11.5px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .budget-kpi b.over, .budget-cat-amt.over{color:var(--danger);}
  .copy-plans{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin:4px 0 8px; padding:12px; border-radius:14px;
    border:1px dashed var(--link); background:color-mix(in srgb, var(--link) 8%, transparent); color:var(--link); font:inherit; font-size:13.5px; font-weight:700;}
  .period-sec{display:flex; justify-content:space-between; align-items:center; margin:16px 2px 6px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim);}
  .period-sec.overdue{color:var(--danger);}
  .period-sec em{font-style:normal; margin-left:8px; padding:2px 7px; border-radius:6px; background:var(--olive); color:var(--on-accent); letter-spacing:.04em;}
  .period-sec span:last-child{text-transform:none; letter-spacing:0; font-weight:700;}
  .card.period{padding:6px 14px 12px; margin-bottom:0;}
  .card.period.now{border-color:color-mix(in srgb, var(--olive) 45%, var(--line));}
  .period-head{display:flex; justify-content:space-between; align-items:baseline; width:100%; padding:8px 2px 8px; border:none; background:none; color:var(--text); font:inherit; text-align:left;}
  .period-head b{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums;}
  .period-head span{font-size:12.5px; color:var(--text-dim); font-weight:600;}
  .period-head .approx, .period-row .approx, .bcal-pay .approx{color:var(--text-dim); font-size:.85em; margin-right:1px;}
  .period-head.recv{align-items:center; gap:4px; padding:2px 2px 8px 0;}
  .period-head.recv .todo-check{order:0; width:34px; margin-left:-6px;}
  .period-head.recv.got .box{background:var(--olive); border-color:var(--olive);}
  .period-head.recv.got .box svg{opacity:1;}
  .period-amt{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; padding:0; border:none; background:none; color:var(--text); font:inherit; text-align:left;}
  .period-amt i{font-style:normal; font-size:11.5px; font-weight:600; color:var(--text-dim); margin-top:1px;}
  .period-head.recv.got .period-amt i{color:var(--olive);}
  .period-sub{display:flex; justify-content:space-between; margin:12px 2px 0; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim);}
  .period-sub span:last-child{text-transform:none; letter-spacing:0;}
  .period-empty{color:var(--text-dim); font-size:13px; text-align:center; padding:16px; margin-top:8px;}
  .paid-toggle{display:flex; align-items:center; gap:8px; width:100%; padding:10px 4px; border:none; border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent); background:none; color:var(--text-dim); font:inherit; font-size:12.5px; font-weight:700; text-align:left;}
  .paid-toggle svg:first-child{width:13px; height:13px; color:var(--olive);}
  .paid-toggle span{flex:1;}
  .pinned.open .paid-toggle .chev{transform:none;}
  .paid-toggle[aria-expanded="true"] .chev, .pinned.open .paid-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .plan-toggle{display:flex; justify-content:space-between; align-items:center; width:100%; margin-top:6px; padding:12px 2px 8px; border:none;
    border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent); background:none; color:var(--text-dim); font:inherit;
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; text-align:left; cursor:pointer;}
  .plan-toggle span:last-child{display:inline-flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; font-size:12.5px; font-weight:700;}
  .plan-toggle span:last-child > svg:first-child:not(.chev){width:13px; height:13px; color:var(--olive);}
  .plan-toggle .chev{transition:transform .2s;}
  .pinned.open .plan-toggle .chev, .plan-toggle .chev{transform:none;}
  .plan-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .plan-row{display:flex; align-items:center; border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent);}
  .plan-row:first-of-type{border-top:none;}
  .plan-body{order:2; flex:1; min-width:0; display:flex; justify-content:space-between; gap:12px; padding:11px 2px; border:none; background:none; color:var(--text); font:inherit; font-size:13.5px; text-align:left;}
  .plan-body b{font-variant-numeric:tabular-nums; font-weight:700;}
  .plan-row.done .plan-body{color:var(--text-dim); text-decoration:line-through;}
  .plan-row.done .box{background:var(--olive); border-color:var(--olive);}
  .plan-row.done .box svg{opacity:1;}
  .acct-totals{display:grid; gap:6px; margin:6px 0 10px;}
  .acct-total{display:flex; justify-content:space-between; align-items:center; font-size:13.5px;}
  .acct-total b{font-variant-numeric:tabular-nums;}
  .progress-fill.over{background:var(--danger);}
  .progress-bar.thin{height:5px;}
  .bill-row{align-items:center; padding:0; gap:0;}
  .bill-row .todo-check, .bill-row .row-icon{order:1;}
  .bill-row .body{order:2; flex:1; min-width:0; padding:11px 6px 11px 2px; cursor:pointer;}
  .bill-amt{order:3; display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; padding-right:2px;}
  .bill-pay{font-size:11.5px; font-weight:700; color:var(--link); text-decoration:none;}
  .autopay{display:inline-flex; align-items:center; gap:4px; color:var(--olive); font-weight:600;}
  .bill-row .todo-meta{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .acct-tag{display:inline-flex; align-items:center; gap:5px;}
  .acct-tag i{width:7px; height:7px; border-radius:50%; background:var(--acct); flex-shrink:0;}
  .bill-amt .approx{color:var(--text-dim); font-weight:600; margin-right:1px;}
  .bill-row.checked .bill-amt{color:var(--text-dim); text-decoration:line-through;}
  .bill-tag{color:var(--text); font-weight:700;}
  .bill-icon{color:var(--gold);}
  .budget-cat{padding:10px 0; border-bottom:1px solid var(--line);}
  .budget-cat:last-child{border-bottom:none;}
  .budget-cat-head{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:0 0 7px; border:none; background:none; color:var(--text); font:inherit; text-align:left; cursor:pointer;}
  .budget-cat-name{font-size:14px; font-weight:700; display:flex; align-items:center;}
  .budget-cat-amt{font-size:13.5px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .budget-cat-amt span{color:var(--text-dim); font-weight:600;}
  .expense-list{margin-top:8px;}
  .expense-row{display:flex; align-items:center; gap:10px; width:100%; padding:9px 2px; border:none; border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent); background:none; color:var(--text); font:inherit; font-size:13px; text-align:left;}
  .expense-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .expense-date{color:var(--text-dim); font-size:12px;}
  .expense-row b{font-variant-numeric:tabular-nums;}
  .budget-hint{text-align:center; margin:4px 12px 0;}
  .budget-sub{display:flex; justify-content:space-between; align-items:baseline; margin:12px 2px 2px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim);}
  .budget-sub:first-child{margin-top:0;}
  .budget-sub span{text-transform:none; letter-spacing:0; font-weight:700;}
  .budget-total{display:flex; justify-content:space-between; align-items:center; padding:10px 2px; border-top:1px solid var(--line); font-size:13px; font-weight:700; color:var(--text-dim);}
  .budget-total b{color:var(--text); font-size:14.5px; font-variant-numeric:tabular-nums;}
  .budget-total b.over, .paycheck-left.over b{color:var(--danger);}
  .budget-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .acct-pill{display:inline-flex; align-items:center; gap:5px; padding:1px 7px; border-radius:6px; font-size:11px; font-weight:700;
    color:var(--acct); background:color-mix(in srgb, var(--acct) 16%, transparent);}
  .acct-pill.big{border:none; font:inherit; font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:10px; margin:0 6px 6px 0;}
  .acct-pill.big svg{width:11px; height:11px;}
  .acct-add{border:1px dashed var(--line); background:none; color:var(--text-dim); font:inherit; font-size:12.5px; font-weight:700; padding:5px 10px; border-radius:10px; margin:0 0 6px;}
  .income-srcs .acct-add + .acct-add{margin-left:6px;}
  .acct-editor{padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:6px;}
  .acct-editor .budget-sub{margin-bottom:8px;}
  .income-srcs{margin-top:10px;}
  .plan-hint, .plan-add{display:block; border:none; background:none; font:inherit; font-size:12.5px; font-weight:700; padding:9px 2px 4px; text-align:left;}
  .plan-hint{color:var(--link);}
  .plan-add{color:var(--text-dim);}
  .paycheck-left{display:flex; justify-content:space-between; margin-top:8px; padding:10px 2px 0; border-top:1px solid var(--line); font-size:13px; font-weight:700; color:var(--text-dim);}
  .paycheck-left b{color:var(--olive); font-size:14.5px; font-variant-numeric:tabular-nums;}
  .goal{padding:12px 0; border-bottom:1px solid var(--line);}
  .goal-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; width:100%; padding:0 2px 8px; border:none; background:none; color:var(--text); font:inherit; font-size:15px; text-align:left;}
  .goal-head span{color:var(--text-dim); font-size:13px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .goal.reached .progress-fill{background:var(--olive);}
  .goal-track{position:relative; padding-bottom:20px;}
  .goal-track .progress-bar{height:10px;}
  .goal-mark{position:absolute; top:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; pointer-events:none;}
  .goal-mark i{display:block; width:2px; height:10px; background:var(--surface); opacity:.9;}
  .goal-mark.end i{opacity:0;}
  .goal-mark em{font-style:normal; font-size:10.5px; font-weight:700; color:var(--text-dim); margin-top:4px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .goal-mark.hit em{color:var(--olive);}
  .goal-mark.end{transform:translateX(-100%); align-items:flex-end;}
  .goal-outlook{margin:8px 2px 0; font-size:12.5px; color:var(--text-dim); display:grid; gap:3px;}
  .goal-outlook b{color:var(--text);}
  .goal-meta{margin:8px 2px 0; font-size:12.5px; color:var(--text-dim);}
  .goal-meta > span:first-child{color:var(--text); font-weight:800;}
  .goal-meta b{color:var(--text);}
  .goal-done{display:inline-flex; align-items:center; gap:4px; color:var(--olive); font-weight:800;}
  .goal-done svg{width:12px; height:12px;}
  .goal-pace{display:inline-block; margin:6px 2px 0; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:7px; color:var(--gold); background:color-mix(in srgb, var(--gold) 14%, transparent);}
  .goal-pace.on{color:var(--olive); background:color-mix(in srgb, var(--olive) 14%, transparent);}
  .goal-actions{display:flex; gap:8px; margin-top:10px;}
  .goal-add, .goal-hist{border:1px solid var(--line); background:none; color:var(--text); font:inherit; font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:10px; display:inline-flex; align-items:center; gap:4px;}
  .goal-hist{color:var(--text-dim);}
  .pinned.open .goal-hist .chev{transform:none;} /* not the card's own open/closed chevron */
  .pinned.open .goal-hist[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .goal-entries{margin-top:8px;}
  .goal-entry{display:flex; align-items:center; gap:10px; width:100%; padding:8px 2px; border:none; border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent); background:none; color:var(--text); font:inherit; font-size:12.5px; text-align:left;}
  .goal-entry span:first-child{color:var(--text-dim); width:84px; flex-shrink:0;}
  .goal-note{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .goal-entry b{color:var(--olive); font-variant-numeric:tabular-nums;}
  .goal-entry b.neg{color:var(--danger);}
  .goal-tag{margin-left:8px; font-size:11px; font-weight:700; color:var(--olive);}
  .goal-ideas{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .goal-ideas .acct-add{margin:0;}

  /* shopping */
  .want-card{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line);}
  .want-card:last-child{border-bottom:none;}
  .want-card .body{flex:1;}
  .want-card .name{font-size:13.5px; font-weight:700; line-height:1.35;}
  .link-btn{border:none; background:none; padding:0; color:var(--link); font:inherit; font-weight:700; font-style:normal; text-decoration:underline;}
  .want-card .badges{white-space:nowrap;} /* badges wrap as a group, flush left */
  .want-card .badges .badge:first-child{margin-left:0;}
  .want-card .meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .link{font-size:12px; color:var(--link); text-decoration:none; font-weight:600; display:inline-block; margin-top:4px;}
  .want-card .price{font-size:14px; font-weight:700; color:var(--gold); margin-top:5px;}
  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px 2px; margin-top:6px; border-top:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--text-dim);
  }
  .total-row span{font-size:14px; font-weight:700; color:var(--text);}
  .toggle{
    flex-shrink:0; padding:7px 12px; border-radius:20px; border:1.5px solid var(--olive-dim);
    background:none; color:var(--olive); font-size:11px; font-weight:700; font-family:inherit;
    letter-spacing:.03em; white-space:nowrap;
  }
  .want-actions{display:flex; flex-direction:column; align-items:stretch; gap:6px; flex-shrink:0;}
  .later-chip{display:inline-flex; align-items:center; justify-content:center; gap:4px; padding:5px 10px; border-radius:20px; border:none; background:none; color:var(--text-dim); font-size:11px; font-weight:700; font-family:inherit; white-space:nowrap;}
  .later-chip svg{width:12px; height:12px;}
  .later-note{margin:0 0 6px; font-size:12px; color:var(--text-dim);}
  .toggle.done{background:var(--olive); color:var(--on-accent); border-color:var(--olive);}
  .cat-title{font-size:11.5px; font-weight:700; color:var(--olive); margin:12px 0 2px;}
  .cat-title:first-child{margin-top:0;}
  .insight{font-size:10.5px; font-weight:600; color:var(--text-dim); background:var(--surface-2);
    padding:2px 7px; border-radius:8px; white-space:nowrap;}
  .footnote{font-size:11px; color:var(--text-dim); margin:8px 0 0; font-style:italic;}
  /* routine checklist (Skin & Hair "Today" card) */
  .routine-band{padding-top:6px;}
  .routine-band + .routine-band{border-top:1px solid var(--line); margin-top:8px; padding-top:12px;}
  .routine-band-head{
    display:flex; align-items:center; gap:8px; width:100%; min-height:40px; padding:0;
    border:none; background:none; color:var(--text); font:inherit; text-align:left; cursor:pointer;
  }
  .routine-band-head .label{flex:1;}
  .routine-band-head .chev{color:var(--text-dim); transition:transform .2s; flex-shrink:0;}
  .routine-band.open .routine-band-head .chev{transform:rotate(180deg);}
  .routine-count.complete{display:inline-flex; align-items:center; gap:4px; color:var(--olive);}
  .routine-count.complete svg{width:12px; height:12px;}
  .routine-band .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700;}
  .routine-band.am .label{color:var(--gold);}
  .routine-band.pm .label{color:var(--navy);}
  .routine-count{font-size:11.5px; font-weight:700; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .routine-step{
    display:flex; align-items:flex-start; gap:12px; width:100%; min-height:44px; padding:11px 0;
    border:none; background:none; color:var(--text); font:inherit; font-size:13px; line-height:1.4; text-align:left;
  }
  .routine-step + .routine-step{border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent);}
  .routine-step .box{order:0; margin-top:-1px;} /* base .box is order:2 (checkbox-right lists) */
  .routine-text{flex:1; min-width:0;}
  .routine-step.done .box{background:var(--olive); border-color:var(--olive);}
  .routine-step.done .box svg{opacity:1;}
  .routine-step.done .routine-text{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .routine-text b{font-weight:600;}
  .routine-text .note, .step .note{display:block; color:var(--text-dim); font-size:12px;}
  /* this week overview */
  .week-day + .week-day{border-top:1px solid var(--line);}
  .week-day-head{
    display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:0;
    border:none; background:none; color:var(--text); font:inherit; text-align:left;
  }
  .week-day-name{width:34px; flex-shrink:0; font-size:13px; font-weight:700; color:var(--text-dim);}
  .week-day.today .week-day-name{color:var(--text);}
  .week-day-extras{flex:1; min-width:0; font-size:12.5px; color:var(--text-dim);}
  .week-day-extras .badge.today{margin:0 8px 0 0;}
  .week-day-done{display:flex; color:var(--olive);}
  .week-day-done svg{width:14px; height:14px;}
  .week-day .chev{color:var(--text-dim); transition:transform .2s; flex-shrink:0;}
  .week-day.open .chev{transform:rotate(180deg);}
  .week-day-body{padding:0 0 12px 44px;}
  .week-day-body .wl{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin:6px 0 4px;}
  .week-day-body .wl.am{color:var(--gold);} .week-day-body .wl.pm{color:var(--navy);}
  .routine-sub{margin-left:6px; text-transform:none; letter-spacing:0; font-weight:600; color:var(--text-dim);}
  /* modal "days" field */
  .day-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .day-chip{position:relative; cursor:pointer;}
  .day-chip input{position:absolute; opacity:0; pointer-events:none;}
  .modal-field .day-chip span{
    display:inline-flex; align-items:center; justify-content:center; min-width:42px; min-height:40px; margin:0;
    border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text-dim); font-size:12.5px; font-weight:700; text-transform:none; letter-spacing:0;
  }
  .modal-field .day-chip input:checked + span{background:var(--olive); border-color:var(--olive); color:var(--on-accent);}
  .modal-field .day-chip input:focus-visible + span{outline:2px solid var(--olive); outline-offset:2px;}
  .badge.today{background:color-mix(in srgb, var(--olive) 22%, transparent); color:var(--olive); margin-left:8px;}
  .badge.wash{background:color-mix(in srgb, var(--navy) 22%, transparent); color:var(--navy); margin-left:8px;}
  .progress-bar{height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--olive)); border-radius:5px; transition:width .3s ease;}

  .skeleton{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
  .skel-line{height:12px; border-radius:6px; background:var(--surface-2); margin-bottom:10px;
    animation:pulse 1.2s ease-in-out infinite;}
  .skel-line:last-child{margin-bottom:0; width:60%;}
  @keyframes pulse{0%,100%{opacity:.5;} 50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .skel-line{animation:none; opacity:.7;} }

  :focus-visible{outline:2px solid var(--olive); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important; animation-duration:.001ms !important;}
  }

  .toast{
    position:fixed; left:50%; bottom:calc(82px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:20px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:40; /* above the composer sheet */
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--danger); color:var(--danger-text);}

  .empty{font-size:12.5px; color:var(--text-dim); font-style:italic; padding:6px 2px;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  #pull-indicator{
    height:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
    gap:8px; color:var(--text-dim); font-size:12px; font-weight:600; letter-spacing:.02em;
  }
  #pull-indicator.animated{transition:height .2s ease;}
  #pull-indicator.ready{color:var(--olive);}
  .pull-spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--text-dim); border-top-color:transparent;
    flex-shrink:0; opacity:0; transition:opacity .15s;
  }
  #pull-indicator.ready .pull-spinner{border-color:var(--olive); border-top-color:transparent;}
  #pull-indicator.refreshing .pull-spinner{opacity:1; animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    #pull-indicator.refreshing .pull-spinner{animation:none;}
  }

  /* ---------- editing: tap an item to edit it ---------- */

  .editable{cursor:pointer;}
  button.step, button.rule{width:100%; border:none; background:none; color:var(--text); font-family:inherit; text-align:left; padding-top:2px; padding-bottom:2px; padding-right:4px;}
  button.step{padding-left:2px;}
  .want-card .body{cursor:pointer;}
  .cat-edit{display:block; margin:6px 0 2px; padding:6px 2px; border:none; background:none; color:var(--link); font:inherit; font-size:12.5px; font-weight:700;}
  .editable:active{background:var(--surface-2); border-radius:6px;}


  .add-row{
    width:100%; margin:0 0 10px; padding:10px; border-radius:10px; border:1.5px dashed var(--olive-dim);
    background:none; color:var(--olive); font-size:12.5px; font-weight:700; font-family:inherit;
  }
  .add-row:active{background:color-mix(in srgb, var(--olive) 12%, transparent);}
  .reset-btn{
    width:100%; margin-top:10px; padding:10px; border-radius:10px; border:1.5px solid color-mix(in srgb, var(--danger) 35%, transparent);
    background:none; color:var(--danger); font-size:12.5px; font-weight:700; font-family:inherit;
  }
  .reset-btn:active{background:color-mix(in srgb, var(--danger) 12%, transparent);}

  /* to-do: star / sub-checklist / completed archive */
  .todo-wrap{border-bottom:1px solid var(--line);}
  .todo-wrap:last-child{border-bottom:none;}
  .todo-wrap .item{border-bottom:none;}
  .todo-icon-btn{
    flex-shrink:0; width:26px; height:26px; border-radius:8px; border:none; background:none;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; position:relative;
  }
  .todo-icon-btn.starred{color:var(--gold);}
  .todo-icon-btn.active{color:var(--olive);}
  .subitem-list{padding:0 0 10px 26px;}
  .subitem-row{display:flex; align-items:center; gap:8px; padding:5px 0;}
  .subitem-row.drag-active-sub{
    position:relative; z-index:15; background:var(--surface-2); border-radius:10px;
    outline:1.5px solid var(--olive); box-shadow:0 8px 20px rgba(0,0,0,.5);
  }
  /* dragging left past the threshold: dashed outline = will promote to a full to-do */
  .subitem-row.drag-active-sub.promoting{outline-style:dashed; outline-color:var(--gold);}
  .subitem-box{
    width:16px; height:16px; border-radius:5px; border:1.5px solid var(--text-dim); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;
  }
  .subitem-box svg{width:10px; height:10px; opacity:0; transition:opacity .15s;}
  .subitem-box.checked{background:var(--olive); border-color:var(--olive);}
  .subitem-box.checked svg{opacity:1;}
  .subitem-text{flex:1; font-size:12.5px; color:var(--text);}
  .subitem-text.checked{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .subitem-del{flex-shrink:0; width:22px; height:22px; border:none; background:none; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
  .subitem-add-toggle{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:14px;
    border:1.5px dashed var(--olive-dim); background:none; color:var(--olive);
    font-size:11.5px; font-weight:700; font-family:inherit;
    width:fit-content; margin:6px 0 2px auto;
  }
  .subitem-add-toggle:active{background:color-mix(in srgb, var(--olive) 12%, transparent);}
  .subitem-add{display:flex; gap:6px; margin:6px 0 2px;}
  .subitem-add input{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:12px; font-family:inherit; padding:0 10px; height:32px;
  }
  .subitem-add input::placeholder{color:var(--text-dim);}
  .subitem-add button{
    flex-shrink:0; width:32px; height:32px; border-radius:8px; border:none;
    background:var(--surface-2); color:var(--olive); display:flex; align-items:center; justify-content:center;
  }
  .completed-actions{flex-shrink:0; width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center;}

  /* to-do drag-to-reorder */
  .todo-wrap.drag-active{position:relative; z-index:15;}
  .todo-wrap.drag-active .item{
    background:var(--surface-2); border-radius:12px; outline:1.5px solid var(--olive);
    box-shadow:0 10px 26px rgba(0,0,0,.55);
  }
  /* dragging right past the threshold: dragged row shows cyan, the row above
     (the future parent) gets a dashed cyan target outline */
  .todo-wrap.drag-active.indenting .item{outline-color:var(--gold);}
  .todo-wrap.indent-target .item{
    background:color-mix(in srgb, var(--gold) 7%, transparent); border-radius:12px;
    outline:1.5px dashed color-mix(in srgb, var(--gold) 55%, transparent);
  }
  body.todo-dragging, body.todo-dragging *{user-select:none; -webkit-user-select:none;}
  #todo-list .todo-wrap[data-todo-id] .body, .home-list .todo-wrap[data-todo-id] .body{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  .home-list .todo-wrap.drag-active{position:relative; z-index:15;}
  .home-list .todo-wrap.drag-active .item{background:var(--surface-2); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.45);}

  /* ---------- to-do rows: checkbox first, ~44px touch targets ----------
     Scoped to to-do rows only — the Style tab checklist shares .item/.box.
     Visible icons keep their old sizes; only the tappable boxes grow. Rows
     are 44px tall, and the body's 12px vertical padding centers a one-line
     title against the 44px buttons. */
  .todo-wrap .item, #todo-completed .item{padding:0 2px 0 0; gap:0;}
  .todo-wrap .item .body, #todo-completed .item .body{order:2; padding:12px 6px 12px 2px; min-width:0;}
  .todo-wrap .item .body{cursor:pointer;}
  .todo-check{
    order:1; flex-shrink:0; width:40px; height:44px; padding:0; border:none; background:none;
    display:flex; align-items:center; justify-content:center;
  }
  .todo-check .box{margin-top:0;}
  .todo-icon-btn{width:36px; height:44px; border-radius:10px;}
  .todo-meta{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
  .overdue{color:var(--danger); font-weight:600;}
  .cat-title.overdue{color:var(--danger);}
  .todo-card-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .todo-card-head h3{margin:0;}
  .completed-toggle{
    display:flex; align-items:center; gap:8px; width:100%; min-height:44px; margin-top:8px; padding:0 2px;
    border:none; border-top:1px solid var(--line); background:none; color:var(--text-dim);
    font:inherit; font-size:12.5px; font-weight:700; text-align:left;
  }
  .completed-toggle span{flex:1;}
  .completed-toggle .chev{transition:transform .2s;}
  .completed-toggle.open .chev{transform:rotate(180deg);}
  .filter-chip{
    flex-shrink:0; min-height:36px; padding:0 14px; border-radius:18px; border:1px solid var(--line);
    background:none; color:var(--text-dim); font:inherit; font-size:12.5px; font-weight:700;
  }
  .filter-chip.on{background:var(--olive); border-color:var(--olive); color:var(--on-accent);}
  /* Shopping filters: one row that scrolls sideways. The scrollbar is hidden (Android
     drew a gray bar under it), and on phones the row bleeds to the screen edges with
     a right-edge fade so a partly visible chip reads as "swipe for more". */
  .filter-chips{
    display:flex; gap:6px; margin:0 0 14px; overflow-x:auto; overscroll-behavior-x:contain;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .filter-chips::-webkit-scrollbar{display:none;}
  @media (max-width:767px){
    .filter-chips{
      margin-left:-16px; margin-right:-16px; padding:0 16px; scroll-padding:0 16px;
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent);
      mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent);
    }
    .filter-chips::after{content:""; flex:0 0 10px;} /* room to scroll the last chip clear of the fade */
  }
  .filter-chips .filter-chip{
    flex:0 0 auto; min-height:40px; padding:0 14px;
    display:flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap;
  }
  .fc-label{overflow:hidden; text-overflow:ellipsis;}
  .fc-count{flex-shrink:0; opacity:.7; font-variant-numeric:tabular-nums;}
  .want-tag{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--olive); margin-top:2px;}
  .want-tag svg{width:12px; height:12px;}
  .want-tag.moto{color:var(--gold);}
  /* wash-day calendar */
  .wash-freq{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700;}
  .cal-nav{width:44px; height:44px; border:none; background:none; color:var(--text); font:inherit; font-size:20px; border-radius:10px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; text-align:center;}
  .cal-dow{font-size:10.5px; font-weight:700; color:var(--text-dim); padding:4px 0; text-align:center;}
  .cal-day{
    min-height:42px; border:none; border-radius:10px; background:none; padding:0;
    color:var(--text); font:inherit; font-size:13px; font-variant-numeric:tabular-nums;
  }
  .cal-day.past{color:var(--text-dim); opacity:.55;}
  .cal-day.today{box-shadow:inset 0 0 0 1px var(--line); font-weight:800;}
  .cal-day.wash{background:color-mix(in srgb, var(--navy) 24%, transparent); color:var(--navy); font-weight:800; opacity:1;}
  .cal-day.blank{visibility:hidden;}
  .badge.kind-need{background:color-mix(in srgb, var(--gold) 20%, transparent); color:var(--gold); margin-left:8px;}
  .badge.kind-want{background:var(--surface-2); color:var(--text-dim); margin-left:8px;}
  /* floating + button (Home and To-Do) and the new-to-do composer sheet */
  .fab{
    display:none; position:fixed; right:18px; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:12;
    width:58px; height:58px; border:none; border-radius:18px; align-items:center; justify-content:center;
    background:var(--olive); color:var(--on-accent); box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .fab:active{transform:scale(.96);}
  body[data-tab="home"] .fab, body[data-tab="todo"] .fab, body[data-tab="wants"] .fab, body[data-tab="budget"] .fab{display:flex;}
  body[data-tab="home"] main, body[data-tab="todo"] main, body[data-tab="budget"] main,
  body[data-tab="wants"] main{padding-bottom:170px;} /* last row clears the button */
  .composer-backdrop{
    position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .composer-backdrop.open{opacity:1; pointer-events:auto;}
  .composer-sheet{
    width:100%; max-width:480px; max-height:85vh; overflow-y:auto; background:var(--surface);
    border:1px solid var(--line); border-radius:18px 18px 0 0;
    padding:8px 18px calc(18px + env(safe-area-inset-bottom)); transition:transform .2s;
  }
  .composer-grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:2px auto 10px;}
  .composer-sheet .modal-head h3{display:flex; align-items:center; gap:8px;}
  #composer-text, #composer-subs, #composer-extra input, #composer-buy input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-family:inherit; font-size:16px; padding:12px; resize:none;
  }
  #composer-text:focus, #composer-subs:focus, #composer-extra input:focus, #composer-buy input:focus{outline:2px solid var(--olive); outline-offset:1px;}
  #composer-extra{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  #composer-extra[hidden]{display:none;}
  #composer-extra input, #composer-buy input{min-height:46px; padding:0 12px;}
  #composer-buy{margin-top:10px;}
  #composer-buy[hidden]{display:none;}
  .composer-row{display:flex; gap:8px;}
  .composer-row input{flex:1; min-width:0;}
  #composer-chips2{margin-top:8px;}
  .composer-chips{display:flex; gap:6px; margin:12px -18px 0; padding:0 18px; overflow-x:auto; scrollbar-width:none;}
  .composer-chips::-webkit-scrollbar{display:none;}
  .composer-chips .filter-chip{flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; min-height:40px;}
  .composer-chips .filter-chip svg{width:14px; height:14px;}
  #composer-count:empty{display:none;}
  .composer-date-input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}
  .composer-add{width:100%; margin-top:14px; min-height:48px;}
  .badge.high{background:color-mix(in srgb, var(--navy) 22%, transparent); color:var(--navy); margin-left:8px;}
  .modal-section{display:block; margin:6px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700;}
  .backup-actions{display:flex; gap:8px; margin-top:10px;}
  .backup-btn{
    flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font:inherit; font-size:13px; font-weight:700;
  }
  .modal-field input[type=date]{min-height:44px; -webkit-appearance:none; appearance:none;}
  /* boxed buttons: the visible 26px box is drawn by ::before inside a 36×44 hit area */
  #todo-completed .completed-actions{
    width:36px; height:44px; border:none; background:none; position:relative; isolation:isolate;
  }
  #todo-completed .completed-actions::before{
    content:""; position:absolute; inset:9px 5px; z-index:-1;
    border:1px solid var(--line); background:var(--surface-2); border-radius:8px;
  }
  .subitem-row{padding:0; gap:2px; min-height:44px;}
  .subitem-check{
    flex-shrink:0; width:36px; height:44px; padding:0; border:none; background:none;
    display:flex; align-items:center; justify-content:center;
  }
  .subitem-del{width:36px; height:44px;}
  .subitem-add-toggle{min-height:40px; padding:8px 14px;}

  /* undo toast: tappable, unlike the plain status toast */
  .toast.actionable{pointer-events:auto; display:flex; align-items:center; gap:6px; padding:0 0 0 16px;}
  .toast-action{
    background:none; border:none; color:var(--olive); font:inherit; font-weight:800;
    min-height:44px; padding:0 16px; border-radius:20px;
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:30;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal-sheet{
    width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(16px); transition:transform .2s;
    max-height:80vh; overflow-y:auto;
  }
  .modal-backdrop.open .modal-sheet{transform:translateY(0);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .modal-head h3{margin:0; font-size:16px; font-weight:700;}
  .modal-x{background:none; border:none; color:var(--text-dim); font-size:22px; line-height:1; padding:4px 8px;}
  .modal-field{display:block; margin-bottom:12px;}
  .modal-field span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700; margin-bottom:5px;}
  .modal-field input, .modal-field textarea, .modal-field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:14px; font-family:inherit; padding:10px 12px; resize:vertical;
  }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus{outline:2px solid var(--olive); outline-offset:1px;}
  .bill-logo{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-right:8px; vertical-align:-5px; border-radius:6px;
    background:#fff; object-fit:contain; padding:2px; box-sizing:border-box; flex-shrink:0;}
  .bill-logo.letter{padding:0; background:hsl(var(--h) 45% 30%); color:hsl(var(--h) 80% 85%); font-size:12px; font-weight:800;}
  .bill-logo-link{display:inline-flex; vertical-align:-5px; margin-right:8px; border-radius:6px; text-decoration:none; box-shadow:0 0 0 2px color-mix(in srgb, var(--link) 45%, transparent);}
  .bill-row .title, .bill-home .title{display:flex; align-items:center;}
  .bill-logo-link .bill-logo{margin-right:0; vertical-align:0;}
  .item.checked .bill-logo{opacity:.55;}
  .home-sub{display:flex; align-items:center; gap:7px; padding:14px 2px 4px; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:hsl(var(--k, 0) 55% 70%); margin-top:2px;}
  .home-sub:not([style]){color:var(--text-dim);}
  .home-sub svg{width:13px; height:13px; flex-shrink:0;}
  .home-list > .home-sub:first-child{margin-top:0; padding-top:6px;}
  .home-sub[style] ~ .todo-wrap .kind-ic{display:none;} /* the label already shows the type */
  .weight-top{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:2px 2px 10px;}
  .weight-now b{font-size:38px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .weight-now span{margin-left:4px; font-size:14px; font-weight:700; color:var(--text-dim);}
  .weight-goal{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:none; color:var(--text-dim); font:inherit; font-size:12.5px; font-weight:600; padding:6px 11px; border-radius:12px; margin-bottom:6px;}
  .weight-goal b{color:var(--text);}
  .weight-goal svg{width:12px; height:12px; color:var(--olive);}
  .weight-scale{display:flex; justify-content:space-between; margin:5px 2px 0; font-size:11px; font-weight:700; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .weight-chart{display:block; width:100%; height:70px; margin:12px 0 4px;}
  .weight-chart .wc-line{fill:none; stroke:var(--link); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round;}
  .weight-chart .wc-dot{fill:var(--link);}
  .weight-chart .wc-goal{stroke:var(--olive); stroke-width:1; stroke-dasharray:4 4; vector-effect:non-scaling-stroke; opacity:.7;}
  .fw-day{display:flex; gap:12px; padding:8px 2px; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent);}
  .fw-day:last-of-type{border-bottom:none;}
  .fw-day.today{background:color-mix(in srgb, var(--link) 8%, transparent); border-radius:12px; padding-left:8px; padding-right:8px; margin:0 -6px;}
  .fw-date{width:34px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding-top:8px;}
  .fw-date b{font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim);}
  .fw-date span{font-size:16px; font-weight:800;}
  .fw-day.past .fw-date{opacity:.55;}
  .fw-list{flex:1; min-width:0; display:flex; flex-direction:column;}
  .fw-item{display:flex; align-items:center; min-height:44px;}
  .fw-item > *{order:0 !important;} /* the shared checkbox styles reorder flex items */
  .fw-item .todo-check{width:36px; height:44px; flex-shrink:0;}
  .fw-item.done .box{background:var(--olive); border-color:var(--olive);}
  .fw-item.done .box svg{opacity:1;}
  .fw-later{display:block; width:36px; flex-shrink:0;}
  .fw-name{flex:1; min-width:0; display:flex; align-items:center; gap:0; padding:0; border:none; background:none; color:var(--text); font:inherit; font-size:14px; font-weight:600; text-align:left;}
  .fw-name span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fw-name i{font-style:normal; font-size:12px; font-weight:600; color:var(--text-dim); margin-left:8px; white-space:nowrap;}
  .fw-item.done .fw-name span{text-decoration:line-through; color:var(--text-dim);}
  .fw-item.missed .fw-name span{color:var(--text-dim);}
  .fw-rest{display:block; padding:12px 0; font-size:13px; color:var(--text-dim); font-style:italic;}
  .fw-foot{margin:10px 2px 2px; font-size:12.5px; color:var(--text-dim);}
  .fw-foot b{color:var(--text);}
  .fp-row{display:flex; align-items:center; width:100%; gap:2px; padding:11px 2px; border:none; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); background:none; color:var(--text); font:inherit; text-align:left; cursor:pointer;}
  .fp-name{flex:1; min-width:0; display:flex; flex-direction:column; font-size:14.5px; font-weight:700;}
  .fp-name i{font-style:normal; font-size:12px; font-weight:600; color:var(--text-dim); margin-top:2px;}
  .fp-row .chev-r{color:var(--text-dim);}
  .kind-ic{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-right:7px; vertical-align:-5px; border-radius:7px;
    color:hsl(var(--k) 75% 70%); background:hsl(var(--k) 60% 55% / .16); flex-shrink:0;}
  .kind-ic svg{width:13px; height:13px;}
  .item.checked .kind-ic{opacity:.5;}
  .kind-chip[style] svg{color:hsl(var(--k) 75% 70%);}
  .kind-chip.on[style] svg{color:inherit;}
  .tde-chips.tde-kinds{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px;}
  .tde-kinds::-webkit-scrollbar{display:none;}
  .tde-kinds .filter-chip{flex:0 0 auto;}
  .tde{margin:2px 0 6px;}

  }
  body.todo-dragging{cursor:grabbing;}

  .step.editable, .rule.editable, .plan-row, #goals-card .goal, #spending-card .budget-cat, .subitem-row{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}

  /* ---------- desktop (≥768px): tab bar moves to the top, content centers ----------
     Body is a flex column and main scrolls internally, so the nav can leave its
     fixed-bottom position and slot between header and main via flex `order`.
     The shared max(24px, 50% - 380px) padding keeps header, tabs, and content
     aligned on one centered 760px column. */
  @media (min-width:768px){

    .modal-sheet{border-radius:18px; padding:18px;}

// ---------- storage helpers (one JSON blob per key, plain localStorage) ----------
function loadContent(key, defaults){
  try{
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(defaults));
}
// Flag maps ({id: true}) — anything that isn't a plain object becomes {}
function loadState(key){
  const v = loadContent(key, {});
  return v && typeof v === "object" && !Array.isArray(v) ? v : {};
}
function saveContent(key, data, {toast = true} = {}){
  try{
    localStorage.setItem(key, JSON.stringify(data));
    markDataChanged();
    if (toast) showToast("Saved");
  }catch(e){
    console.error("save failed", e);
    showToast("Save failed — storage may be full or disabled", true);
  }
}
function genId(prefix){
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;

function showToast(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("actionable");
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), isError ? 2600 : 1400);
}
function showUndoToast(msg, onUndo){
  const t = document.getElementById("toast");
  t.innerHTML = `<span>${escapeHtml(msg)}</span><button type="button" class="toast-action">Undo</button>`;
  t.classList.remove("error");
  t.classList.add("show", "actionable");
  t.querySelector(".toast-action").onclick = () => {
    clearTimeout(toastTimer);
    t.classList.remove("show", "actionable");
    onUndo();
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show", "actionable"), 5000);
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function escapeAttr(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/</g,"&lt;");
}
// Only http(s) links are rendered; anything else (javascript:, data:, junk) is dropped.
function safeUrl(u){
  if (!u) return "";
  try{

    return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
  }catch(e){ return ""; }
}
function linkHtml(u, attrs, inner){
  const href = safeUrl(u);
  return href ? `<a href="${escapeAttr(href)}" target="_blank" rel="noopener" ${attrs}>${inner}</a>` : "";

// ---------- MODAL ENGINE (reused for every add/edit form) ----------
let modalFields = [];
let modalOnSave = null;
let modalOnDelete = null;
let modalDeleteOpts = {};

let modalReturnFocus = null;
function openModal(title, fields, values, onSave, onDelete, deleteOpts){
  modalReturnFocus = document.activeElement;
  document.getElementById("modal-heading").textContent = title;
  modalFields = fields;
  modalOnSave = onSave;
  modalOnDelete = onDelete || null;
  modalDeleteOpts = deleteOpts || {};
  document.getElementById("modal-delete-btn").textContent = (deleteOpts && deleteOpts.label) || "Delete";
  document.querySelector("#modal-backdrop .modal-btn.primary").textContent = (deleteOpts && deleteOpts.saveLabel) || "Save";
  const body = document.getElementById("modal-body");
  body.innerHTML = fields.map(f => {
    const val = (values && values[f.key] != null) ? values[f.key] : (f.type === "checkbox" ? false : "");
    if (f.type === "note"){
      return `<p class="modal-note">${f.label}</p>`; // f.label is trusted app-authored HTML
    }
    if (f.type === "html") return f.label; // app-authored block with its own controls
    if (f.type === "days"){
      const sel = Array.isArray(val) ? val : [];
      const chips = [0,1,2,3,4,5,6].map(d => `<label class="day-chip"><input type="checkbox" value="${d}" ${sel.includes(d)?"checked":""}><span>${DAY_SHORT[d]}</span></label>`).join("");
      return `<div class="modal-field"><span>${f.label}</span><div class="day-chips" id="modal-${f.key}">${chips}</div></div>`;
    }
    if (f.type === "select"){
      const opts = f.options.map(o => `<option value="${escapeAttr(o)}" ${o===val?"selected":""}>${escapeHtml(o)}</option>`).join("");
      return `<label class="modal-field"><span>${f.label}</span><select id="modal-${f.key}">${opts}</select></label>`;
    }
    if (f.type === "textarea"){
      // enterSaves: a wrapping single-value field (e.g. a long to-do title) — Enter saves instead of adding a newline
      return `<label class="modal-field"><span>${f.label}</span><textarea id="modal-${f.key}" rows="2"${f.enterSaves?' data-enter-saves enterkeyhint="done"':''}${f.maxlength?` maxlength="${f.maxlength}"`:''}>${escapeHtml(val)}</textarea></label>`;
    }
    if (f.type === "checkbox"){
      return `<label class="modal-field modal-checkbox"><input id="modal-${f.key}" type="checkbox" ${val?"checked":""}><span>${f.label}</span></label>`;
    }
    return `<label class="modal-field"><span>${f.label}</span><input id="modal-${f.key}" type="${f.type||'text'}" value="${escapeAttr(val)}"${f.step?` step="${f.step}"`:""}></label>`;
  }).join("");
  document.getElementById("modal-delete-btn").style.display = modalOnDelete ? "block" : "none";
  document.getElementById("modal-backdrop").classList.add("open");
  // Autofocus the first field — desktop only, so mobile doesn't pop the keyboard
  // over the sheet the moment it opens.
  if (window.matchMedia("(hover:hover) and (pointer:fine)").matches){
    const first = body.querySelector("input, textarea, select");
    if (first) setTimeout(() => first.focus(), 60);
  }
}
document.addEventListener("keydown", e => {
  if (document.getElementById("composer").classList.contains("open")){
    if (e.key === "Escape"){ e.preventDefault(); closeComposer(); }
    else if (e.key === "Enter" && !e.shiftKey && (e.target.id === "composer-text" || e.target.matches("#composer-extra input, #composer-buy input"))){ e.preventDefault(); composerAdd(); }
    return;
  }
  if (!document.getElementById("modal-backdrop").classList.contains("open")) return;
  if (e.key === "Escape"){
    e.preventDefault();
    closeModal();
  } else if (e.key === "Enter" && e.target.matches(".modal-body input:not([type=checkbox]), .modal-body textarea[data-enter-saves]")){
    e.preventDefault(); // Enter from a text field saves; other textareas keep Enter for newlines
    modalSave();
  }
});
function closeModal(){
  document.getElementById("modal-backdrop").classList.remove("open");
  // back to whatever opened it, if it's still on the page (keyboard/screen-reader users)
  if (modalReturnFocus && document.contains(modalReturnFocus)) try{ modalReturnFocus.focus({preventScroll:true}); }catch(e){}
  modalReturnFocus = null;
}
function modalSave(){
  const values = {};
  modalFields.forEach(f => {
    const el = document.getElementById("modal-"+f.key);
    if (!el) return; // note fields render no input
    if (f.type === "days"){
      values[f.key] = [...el.querySelectorAll("input:checked")].map(i => Number(i.value)).sort((a,b) => a - b);
      return;
    }
    let v = f.type === "checkbox" ? el.checked : el.value;
    if (f.type === "number") v = v === "" ? null : parseFloat(v);
    if (typeof v === "string") v = v.trim();
    values[f.key] = v;
  });
  if (modalOnSave) modalOnSave(values);
  closeModal();
}
// Deletes happen right away with an Undo (no "are you sure?"): the undo puts
// back a snapshot of every list taken just before, so it covers anything the
// delete touched (a goal's links, a category's spending…).
function modalDelete(){
  if (!modalOnDelete) return;
  if (modalDeleteOpts.noUndo){ // not a data change (e.g. turning sync off): ask instead
    if (confirm(modalDeleteOpts.confirm)){ modalOnDelete(); closeModal(); }
    return;
  }
  const snapshot = JSON.parse(JSON.stringify(liveData()));
  const label = document.getElementById("modal-delete-btn").textContent;
  modalOnDelete();
  closeModal();
  showUndoToast(/delete/i.test(label) ? "Deleted" : "Done", () => { applyRemote({updatedAt:Date.now(), data:snapshot}); markDataChanged(); });
}


// ---------- RENDER: HOME ----------
// ---------- to-do dates ----------
// A to-do's `due` is a local "YYYY-MM-DD" string, or null for Anytime. Older
// data stored `day` (a bare weekday name with no real date); migrateTodoDays()
// converts that to the next occurrence of the weekday, today included.
// Date math runs at local noon so DST shifts can't push a day over a boundary.
const STAR_ICON_SMALL = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>`;
// calendars run Sunday → Saturday
const WEEK_LETTERS = ["S","M","T","W","T","F","S"];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function noonOf(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d, 12); }
function addDaysIso(n){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return isoDate(d); }
function daysFromToday(iso){
  const now = new Date(); now.setHours(12,0,0,0);
  return Math.round((noonOf(iso) - now) / 86400000);
}
function nextWeekdayIso(dayIdx){ return addDaysIso((dayIdx - new Date().getDay() + 7) % 7); }
function dueLabel(iso){
  const n = daysFromToday(iso);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n > 1 && n < 7) return WEEKDAYS[noonOf(iso).getDay()];
  return noonOf(iso).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
// Groups in display order. Overdue and Today sit above Anytime because they're
// time-critical and usually short; Anytime stays near the top so new to-dos
// (undated by default) land in view.
function todoGroup(t){
  if (!t.due) return "anytime";
  const n = daysFromToday(t.due);
  if (n < 0 && t.days > 1 && daysFromToday(todoEnd(t)) >= 0) return "today"; // multi-day, still running
  if (n < 0) return "overdue";
  if (n === 0) return "today";
  return n < 7 ? "d" + n : "later";
}
function todoGroups(){
  const g = [
    {key:"overdue", label:"Overdue", due:"keep"},
    {key:"today", label:"Today", due:addDaysIso(0)},
    {key:"anytime", label:"Anytime", due:""},
    {key:"d1", label:"Tomorrow", due:addDaysIso(1)}
  ];
  for (let n = 2; n < 7; n++) g.push({key:"d"+n, label:WEEKDAYS[noonOf(addDaysIso(n)).getDay()], due:addDaysIso(n)});
  g.push({key:"later", label:"Later", due:"keep"});
  return g;
}
function migrateTodoDays(list){
  let changed = false;
  list.forEach(t => {
    if ("day" in t){
      if (t.due === undefined){
        const i = WEEKDAYS.indexOf(t.day);
        t.due = i >= 0 ? nextWeekdayIso(i) : null;
      }
      delete t.day;
      changed = true;
    }
    if (t.due === undefined){ t.due = null; changed = true; }
  });
  return changed;
}
// Trailing date word in a new to-do: "dentist fri", "call mom tomorrow",
// "pay rent by today". Only the final word counts, and the composer lights up
// the matching chip (tap it to dismiss), so a title that legitimately ends in
// a day name can be kept as plain text.
const DAY_ALIASES = {sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6};
function parseQuickAdd(raw){
  const m = raw.match(/^(.*?)\s+(?:on\s+|by\s+)?(today|tonight|tomorrow|tmrw|tmr|sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)$/i);
  if (!m || !m[1].trim()) return {text:raw, due:null};
  const w = m[2].toLowerCase();
  let due;
  if (w === "today" || w === "tonight") due = addDaysIso(0);
  else if (w.startsWith("tom") || w.startsWith("tm")) due = addDaysIso(1);
  else due = nextWeekdayIso(DAY_ALIASES[w.slice(0,3)]);
  return {text:m[1].trim(), due};
}
// ---------- recurring to-dos ----------
// A repeating to-do is one item with a `repeat` rule and a due date. Ticking it
// records a done copy for that date (so Completed and Home's ring show it) and
// moves the item on to its next date after today. Later dates are projected on
// Home's calendar but not stored.
const REPEATS = {
  daily:    {label:"Every day", short:"Daily"},
  weekdays: {label:"Weekdays", short:"Weekdays"},
  weekly:   {label:"Every week", short:"Weekly"},
  biweekly: {label:"Every 2 weeks", short:"Every 2 weeks"},
  monthly:  {label:"Every month", short:"Monthly"},
  yearly:   {label:"Every year", short:"Yearly"},
  weeks:    {label:"Every N weeks…", short:"Every N weeks"},  // custom: t.every weeks
  months:   {label:"Every N months…", short:"Every N months"}, // custom: t.every months
};
const CUSTOM_REPEATS = {weeks:"weeks", months:"months"};
function todoEvery(t){ return CUSTOM_REPEATS[t.repeat] ? Math.max(1, Math.min(99, parseInt(t.every, 10) || 2)) : 1; }
// the next date in a to-do's series
function todoNext(iso, t){ return nextRepeatIso(iso, t.repeat, todoRepeatDay(t), todoEvery(t)); }
// Multi-day to-dos: `days` (2–60) runs from the due date. Its last day:
function todoEnd(t){ return t.due && t.days > 1 ? isoDate(new Date(noonOf(t.due).getTime() + (t.days - 1) * 864e5)) : t.due; }
function spansOn(t, iso){ return !!t.due && t.due <= iso && iso <= todoEnd(t); }
function spanMeta(t, iso){
  if (!(t.days > 1) || !spansOn(t, iso)) return [];
  return [`Day ${Math.round((noonOf(iso) - noonOf(t.due)) / 864e5) + 1} of ${t.days}`];
}
function spanRange(t){
  const f = iso => noonOf(iso).toLocaleDateString('en-US', {month:'short', day:'numeric'});
  return t.days > 1 ? `${f(t.due)} – ${f(todoEnd(t))}` : "";

const NO_REPEAT = "Doesn't repeat";
// `day` is the series' own day of month, so a repeat on the 31st lands on the
// 30th in a 30-day month and goes back to the 31st after (no drift to the 28th)
function nextRepeatIso(iso, repeat, day, every = 1){
  if (repeat === "monthly") return addMonthsIso(iso, 1, day);
  if (repeat === "months") return addMonthsIso(iso, every, day);
  if (repeat === "yearly") return addMonthsIso(iso, 12, day); // Feb 29 → Feb 28, back to the 29th in a leap year
  const d = noonOf(iso);
  if (repeat === "daily") d.setDate(d.getDate() + 1);
  else if (repeat === "weekdays"){ do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6); }
  else if (repeat === "weekly") d.setDate(d.getDate() + 7);
  else if (repeat === "biweekly") d.setDate(d.getDate() + 14);
  else if (repeat === "weeks") d.setDate(d.getDate() + 7 * every);
