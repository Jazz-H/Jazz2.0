}
function dayOf(iso){ return iso ? Number(iso.slice(8, 10)) : undefined; }
function todoRepeatDay(t){ return t.repeatDay || dayOf(t.due); }
function ordinal(n){ const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function repeatLabel(t){
  const r = REPEATS[t.repeat];
  if (!r) return "";
  if (!t.due || t.repeat === "daily" || t.repeat === "weekdays") return r.short;
  const d = noonOf(t.due);
  if (t.repeat === "monthly") return `Monthly on the ${ordinal(todoRepeatDay(t))}`;
  if (t.repeat === "yearly") return `Yearly on ${noonOf(t.due).toLocaleDateString('en-US', {month:'short'})} ${todoRepeatDay(t)}`;
  if (t.repeat === "months") return `Every ${todoEvery(t)} months on the ${ordinal(todoRepeatDay(t))}`;
  if (t.repeat === "weeks") return `Every ${todoEvery(t)} weeks · ${WEEKDAYS[d.getDay()]}s`;
  return `${r.short} · ${WEEKDAYS[d.getDay()]}s`;
}
// Does a repeating to-do land on `iso`, after its current (stored) date?
function occursOn(t, iso){
  if (!t.repeat || t.done || !t.due || iso <= todoEnd(t)) return false;
  const len = t.days > 1 ? t.days : 1;
  let d = t.due;
  for (let i = 0; i < 800 && d <= iso; i++){
    d = todoNext(d, t);
    if (d <= iso && iso < isoDate(new Date(noonOf(d).getTime() + len * 864e5))) return true; // within a later run
  }
  return false;
}
function completeRepeating(t){
  const today = addDaysIso(0);
  const occurrence = t.due || today;
  const prev = {due:t.due, subitems:JSON.parse(JSON.stringify(t.subitems || []))};
  const copy = {id:genId("todo"), text:t.text, done:true, due:occurrence, starred:false, seriesId:t.id,
    subitems:prev.subitems.map(s => ({...s, id:genId("sub")})), completedAt:Date.now()};
  const day = todoRepeatDay(t);
  if ((t.repeat === "monthly" || t.repeat === "months" || t.repeat === "yearly") && !t.repeatDay) t.repeatDay = day; // pin it before the first clamp
  let next = todoNext(occurrence, t);
  if (occurrence <= today) while (next <= today) next = todoNext(next, t);
  t.due = next;
  (t.subitems || []).forEach(s => { s.done = false; }); // fresh checklist each time
  todoList.splice(todoList.indexOf(t) + 1, 0, copy);
  saveContent("todo-content", todoList, {toast:false});
  renderHome();
  showUndoToast(`Done · next ${dueLabel(next)}`, () => {
    todoList = todoList.filter(x => x.id !== copy.id);
    const cur = todoList.find(x => x.id === t.id); // a sync may have replaced the object
    if (cur){ cur.due = prev.due; cur.subitems = prev.subitems; }
    saveContent("todo-content", todoList);
    renderHome();
  });
}

// ---------- HOME: calendar strip + day agenda ----------
// Home is a day planner. A Sunday-first week strip picks the day; swiping it
// sideways pages weeks, and swiping it down (or the chevron) opens the full
// month, so any date can be picked. The list below shows everything due that
// day; today also carries Overdue and a short Anytime peek. To-dos finished
// that day stay visible, struck through, so the progress ring has something to
// show. Selection is per-session only.
let homeDate = null;     // selected "YYYY-MM-DD"; null means today
let homeAnchor = null;   // a date inside the week/month on screen; null follows homeDate
let homeCalOpen = false; // month view vs. week strip
let homeCalAnim = false; // animate the next render (open/close only)
const HOME_ANYTIME_MAX = 4;
function homeSelected(){ return homeDate || addDaysIso(0); }
function selectHomeDate(iso){
  homeDate = iso === addDaysIso(0) ? null : iso;
  homeAnchor = null;
  renderHomePanel();
}
function setHomeCalOpen(open){
  if (open === homeCalOpen) return;
  homeCalOpen = open;
  homeAnchor = null; // reopen/close around the selected day
  homeCalAnim = true;
  renderHomePanel();
}
function shiftHomeCal(delta){
  const d = noonOf(homeAnchor || homeSelected());
  if (homeCalOpen){ d.setDate(1); d.setMonth(d.getMonth() + delta); }
  else d.setDate(d.getDate() + 7 * delta);
  homeAnchor = isoDate(d);
  renderHomePanel();
}
function completedOn(t, iso){ return t.done && !!t.completedAt && isoDate(new Date(t.completedAt)) === iso; }
function starredFirst(list){ return [...list.filter(t => t.starred), ...list.filter(t => !t.starred)]; }
const byDue = (a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
function homeDayItems(iso){
  const today = addDaysIso(0);
  const open = starredFirst(todoList.filter(t => !t.done && spansOn(t, iso)));
  const wash = isWashDay(noonOf(iso));
  if (iso > today) return {wash, overdue:[], anytime:[], open, done:todoList.filter(t => t.done && t.due === iso),
    repeats:todoList.filter(t => occursOn(t, iso))};
  // A past day shows what was due then (still open) and what got done that day
  if (iso < today) return {wash, overdue:[], anytime:[], open, done:todoList.filter(t => completedOn(t, iso))};
  // Today's done list: anything ticked off today that wasn't scheduled for later
  return {wash, open,
    overdue:todoList.filter(t => !t.done && todoGroup(t) === "overdue").sort(byDue),
    done:todoList.filter(t => completedOn(t, iso) && (!t.due || t.due <= iso)),
    anytime:starredFirst(todoList.filter(t => !t.done && !t.due))};
}
// Open to-dos per due date, for the calendar dots; today's count includes overdue
function homeDueCounts(){
  const today = addDaysIso(0), counts = {};
  todoList.forEach(t => {
    if (t.done || !t.due) return;
    const end = todoEnd(t);
    if (end < today){ counts[today] = (counts[today] || 0) + 1; return; } // overdue counts on today
    // a multi-day to-do counts on each of its days
    for (let d = t.due < today ? today : t.due, i = 0; d <= end && i < 60; d = isoDate(new Date(noonOf(d).getTime() + 864e5)), i++) counts[d] = (counts[d] || 0) + 1;
  });
  return counts;
}
// ---------- US holidays ----------
// Worked out by rule, so every year is covered: the 11 federal holidays (with
// the weekday they're observed on when they land on a weekend; banks close)
// plus common observances.
const holidayCache = {};
function holidaysOf(year){
  if (holidayCache[year]) return holidayCache[year];
  const out = {}, add = (d, name, federal = false) => { const iso = isoDate(d); (out[iso] = out[iso] || []).push({name, federal}); };
  const on = (m, day) => new Date(year, m, day, 12);
  const nth = (m, dow, n) => { const d = on(m, 1); d.setDate(1 + (dow - d.getDay() + 7) % 7 + 7 * (n - 1)); return d; };
  const last = (m, dow) => { const d = new Date(year, m + 1, 0, 12); d.setDate(d.getDate() - (d.getDay() - dow + 7) % 7); return d; };
  // fixed-date federal holidays move to Friday/Monday when they fall on a weekend
  const fixed = (d, name) => {
    add(d, name, true);
    const dow = d.getDay();
    if (dow === 6 || dow === 0){ const o = new Date(d); o.setDate(d.getDate() + (dow === 6 ? -1 : 1)); if (o.getFullYear() === year) add(o, `${name} (observed)`, true); }
  };
  fixed(on(0, 1), "New Year's Day");
  if (new Date(year + 1, 0, 1, 12).getDay() === 6) add(on(11, 31), "New Year's Day (observed)", true);
  add(nth(0, 1, 3), "Martin Luther King Jr. Day", true);
  add(on(1, 14), "Valentine's Day");
  add(nth(1, 1, 3), "Presidents' Day", true);
  add(on(2, 17), "St. Patrick's Day");
  // Easter (anonymous Gregorian computus)
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const em = Math.floor((h + l - 7 * m + 114) / 31) - 1, ed = (h + l - 7 * m + 114) % 31 + 1;
  add(on(em, ed), "Easter");
  add(nth(4, 0, 2), "Mother's Day");
  add(last(4, 1), "Memorial Day", true);
  add(nth(5, 0, 3), "Father's Day");
  fixed(on(5, 19), "Juneteenth");
  fixed(on(6, 4), "Independence Day");
  add(nth(8, 1, 1), "Labor Day", true);
  add(nth(9, 1, 2), "Columbus Day", true);
  add(on(9, 31), "Halloween");
  const elect = nth(10, 1, 1); elect.setDate(elect.getDate() + 1); add(elect, "Election Day");
  fixed(on(10, 11), "Veterans Day");
  add(nth(10, 4, 4), "Thanksgiving", true);
  add(on(11, 24), "Christmas Eve");
  fixed(on(11, 25), "Christmas Day");
  add(on(11, 31), "New Year's Eve");
  return holidayCache[year] = out;
}
function holidaysOn(iso){ return holidaysOf(Number(iso.slice(0, 4)))[iso] || []; }
function homeCalDayHtml(d, counts, monthView, other = false){
  const iso = isoDate(d), today = addDaysIso(0), sel = homeSelected();
  const dayBills = iso >= today ? billsOnDay(iso) : null;
  const count = iso >= today ? (counts[iso] || 0) + (iso > today ? todoList.filter(t => occursOn(t, iso)).length : 0)
    + dayBills.open.length + dayBills.projected.length + workoutsOn(iso).filter(w => !workoutDone(iso, w.id)).length : 0;
  const wash = iso >= today && isWashDate(d) && skinRoutine.washPm.length > 0;
  const hol = holidaysOn(iso);
  const cls = ["home-day", iso === sel ? "on" : "", iso === today ? "today" : "", iso < today ? "past" : "", other ? "other" : "", hol.length ? "holiday" : ""].filter(Boolean).join(" ");
  const label = `${d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'})}: ${count ? `${count} to-do${count === 1 ? "" : "s"}` : "nothing due"}${wash ? ", wash day" : ""}${hol.map(h => `, ${h.name}`).join("")}`;
  return `<button class="${cls}" aria-pressed="${iso === sel}" aria-label="${label}" onclick="selectHomeDate('${iso}')">
      ${monthView ? "" : `<span class="dow">${iso === today ? "Today" : d.toLocaleDateString('en-US', {weekday:'short'})}</span>`}<b>${d.getDate()}</b>
      <span class="marks">${"<i></i>".repeat(Math.min(count, 3))}${wash ? DROPLET_ICON : ""}</span>
    </button>`;
}
function holidayChips(iso){
  const hol = holidaysOn(iso);
  return hol.length ? `<div class="holiday-chips">${hol.map(h => `<span class="holiday-chip ${h.federal ? "fed" : ""}">${STAR_ICON_SMALL}${escapeHtml(h.name)}${h.federal ? `<em> · banks closed</em>` : ""}</span>`).join("")}</div>` : "";
}
function homeCalHtml(){
  const counts = homeDueCounts();
  const anchor = noonOf(homeAnchor || homeSelected());
  const today = addDaysIso(0);
  let body, period, showsToday;
  if (homeCalOpen){
    const first = new Date(anchor); first.setDate(1);
    const lead = first.getDay(); // Sunday-first
    const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    body = WEEK_LETTERS.map(x => `<div class="cal-dow">${x}</div>`).join("");
    // the previous month's last days fill the first week, greyed out
    for (let i = lead; i > 0; i--) body += homeCalDayHtml(new Date(first.getFullYear(), first.getMonth(), 1 - i, 12), counts, true, true);
    for (let n = 1; n <= days; n++) body += homeCalDayHtml(new Date(first.getFullYear(), first.getMonth(), n, 12), counts, true);
    body = `<div class="home-month">${body}</div>`;
    period = first;
    showsToday = today.slice(0, 7) === isoDate(first).slice(0, 7);
  } else {
    const start = new Date(anchor); start.setDate(start.getDate() - start.getDay());
    body = "";
    for (let n = 0; n < 7; n++){ const d = new Date(start); d.setDate(start.getDate() + n); body += homeCalDayHtml(d, counts, false); }
    body = `<div class="home-week">${body}</div>`;
    period = anchor;
    const end = new Date(start); end.setDate(start.getDate() + 6);
    showsToday = isoDate(start) <= today && today <= isoDate(end);
  }
  const yearOpt = period.getFullYear() === new Date().getFullYear() ? {month:'long'} : {month:'long', year:'numeric'};
  const back = !showsToday || homeSelected() !== today;
  return `<div class="home-cal ${homeCalOpen ? "open" : ""} ${homeCalAnim ? "anim" : ""}">
      <div class="home-cal-head">
        <span class="home-cal-title">${period.toLocaleDateString('en-US', yearOpt)}</span>
        ${back ? `<button class="home-cal-today" onclick="selectHomeDate('${today}')">Today</button>` : ""}
        <button class="cal-nav" onclick="shiftHomeCal(-1)" aria-label="Previous ${homeCalOpen ? "month" : "week"}">‹</button>
        <button class="cal-nav" onclick="shiftHomeCal(1)" aria-label="Next ${homeCalOpen ? "month" : "week"}">›</button>
      </div>
      ${body}
      <button class="home-cal-grab" onclick="setHomeCalOpen(${!homeCalOpen})" aria-expanded="${homeCalOpen}" aria-label="${homeCalOpen ? "Show week" : "Show month"}"><span></span></button>
    </div>`;
}
// Wash day as a to-do: a row derived from the wash schedule rather than stored in
// todoList. Its checkbox ticks the wash-only PM steps (the ones regular PM
// doesn't have: shampoo, mask), so it stays in step with Skin & Hair. Only
// today's can be ticked; other days show the droplet instead.
function isWashDay(d){ return isWashDate(d) && skinRoutine.washPm.length > 0; }
function washHairSteps(){
  const regular = new Set(skinRoutine.pm.map(s => s.label));
  const own = skinRoutine.washPm.filter(s => !regular.has(s.label));
  return own.length ? own : skinRoutine.washPm;
}
function washHairDone(iso){
  const c = routineChecks[iso], steps = washHairSteps();
  return !!c && steps.length > 0 && steps.every(s => (c.pm || []).includes(s.id));
}
// Any wash day's row can be ticked (catching up on a past one, or washing early)
function toggleWashHair(iso = addDaysIso(0)){
  if (!isWashDay(noonOf(iso))) return;
  const done = washHairDone(iso), ticked = (routineChecks[iso] && routineChecks[iso].pm) || [];
  washHairSteps().forEach(s => { if (ticked.includes(s.id) === done) toggleRoutineStep("pm", s.id, iso); });
}
// Tapping the row's title goes to the Wash day card (schedule + calendar)

}
// A bill on Home's day list: payable when it's the bill's real due date,

// Re-renders both pages that show to-dos, so every to-do change can keep

    html += `<div class="empty">Nothing on your list — tap + to add one.</div>`;
  } else if (totalOpen === 0 && !washGroups.size){
    html += `<div class="empty">All done for now.</div>`;

    // Within a group, array order IS display order (drag-to-reorder writes it
    // back); Overdue and Later sort by date instead.
    html += `<div id="todo-list">`;
    let firstGroup = true;
    todoGroups().forEach(g => {
      let items = todoList.filter(t => !t.done && todoGroup(t) === g.key);
      if (g.key === "overdue" || g.key === "later") items = items.slice().sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
      const washIso = washGroups.get(g.key);
      if (!items.length && !washIso) return;
      html += `<div class="cat-title${g.key==='overdue'?' overdue':''}" data-due="${g.due}"${firstGroup?' style="margin-top:0;"':''}>${g.label}</div>`;
      firstGroup = false;
      if (washIso) html += washRowHtml(washIso);
      items.forEach(t => { html += todoRow(t); });
    });

  }

          <button class="completed-actions" style="order:3;" onclick="event.stopPropagation(); duplicateTodo('${t.id}')" aria-label="Duplicate to-do">${DUPLICATE_ICON}</button>
          <button class="completed-actions" style="order:4;" onclick="event.stopPropagation(); deleteTodoPermanently('${t.id}')" aria-label="Delete to-do">${TRASH_ICON}</button>
        </div>`;
    }).join("");
    const archivedCount = loadContent("todo-archive-content", []).length;
    html += `<button class="completed-toggle ${completedOpen?'open':''}" onclick="toggleCompletedTodos()" aria-expanded="${completedOpen}">
        ${CHECK_ICON}<span>${completedItems.length} completed</span>
        ${CHEVRON_DOWN}

    if (completedOpen){
      html += `<div id="todo-completed">

          <p class="footnote">Completed to-dos are archived automatically after 7 days${archivedCount ? ` · ${archivedCount} archived so far` : ""}.</p>
        </div>`;
    }
  }
  html += `</div>`;

  // Recurring: every repeating to-do in one place, soonest first; tap to edit
  const recurring = todoList.filter(t => t.repeat && !t.done).sort(byDue);
  const recRows = recurring.map(t => `<div class="item recurring-row" onclick="editTodo('${t.id}')">
      <span class="row-icon repeat-icon" aria-hidden="true">${REPEAT_ICON}</span>
      <div class="body"><div class="title">${kindIconHtml(t)}${escapeHtml(t.text)}</div><div class="todo-meta">${escapeHtml(repeatLabel(t))} · next ${escapeHtml(t.due ? dueLabel(t.due).replace(/^(Today|Tomorrow|Yesterday)$/, w => w.toLowerCase()) : "today")}</div></div>
    </div>`).join("");
  html += collapsibleCard({id:"todo-recurring", title:"Recurring", insight:recurring.length ? `${recurring.length}` : "None",
    body:recRows || `<div class="empty">Set <b>Repeat</b> on a to-do (tap it to edit, or use the Repeat chip when adding) and it shows up here.</div>`});
  el.innerHTML = html;
}
function renderHomePanel(){
  const el = document.getElementById("panel-home");

    if (streak) sub += ` · ${streak}-day routine streak`;
  } else if (iso < today){
    sub = [done ? `${done} done` : "", left ? `${left} still open` : ""].filter(Boolean).join(" · ") || "Nothing recorded";
  } else {

  }

  // data-due: what dropping a dragged to-do here sets ("keep" = leave its date)
  const section = (label, rows, cls = "", due = "keep") => rows ? `<div class="home-sec ${cls}" data-due="${due}">${label}</div><div class="card home-list">${rows}</div>` : "";
  const lateBills = dayBills.open.filter(b => b.due < today), dueBills = dayBills.open.filter(b => b.due >= today);
  let list = section("Overdue", day.overdue.map(t => homeRowHtml(t, [`<span class="overdue">${escapeHtml(dueLabel(t.due))}</span>`])).join("")
    + lateBills.map(b => homeBillHtml(b)).join(""), "overdue", "keep");
  const pastOpen = iso < today ? [`<span class="overdue">Still open</span>`] : [];

    ...repeats.map(t => ({t, html:repeatGhostHtml(t)})),
    ...workouts.map(w => ({t:{kind:w.kind, text:w.name}, html:workoutRowHtml(w, iso)}))];
  const kindCount = {};
  items.forEach(x => { const k = todoKind(x.t); if (k) kindCount[k] = (kindCount[k] || 0) + 1; });
  const grouped = k => k && kindCount[k] >= 1;
  const subHead = (icon, label, hue) => `<div class="home-sub" ${hue != null ? `style="--k:${hue}"` : ""}>${icon}<span>${label}</span></div>`;
  let dayRows = (day.wash && !washDone ? washRowHtml(iso) : "")

  KIND_ORDER.filter(k => kindCount[k] >= 1).forEach(k => {
    const plural = {errand:"Errands", appointment:"Appointments", birthday:"Birthdays", call:"Calls", pet:"Pets", car:"Car"}[k] || TODO_KINDS[k].label;
    dayRows += subHead(TODO_KINDS[k].icon, plural, TODO_KINDS[k].hue)
      + items.filter(x => todoKind(x.t) === k)
        .sort((a, b) => isKindName(b.t.text, k) - isKindName(a.t.text, k)) // a to-do named "Chores" leads its group
        .map(x => x.html).join("");
  });
  const billRows = dueBills.map(b => homeBillHtml(b)).join("")
    + dayBills.projected.map(b => homeBillHtml(b, {projected:true})).join("")
    + dayBills.paid.map(p => homeBillHtml(null, {payment:p})).join("");
  if (billRows) dayRows += subHead(WALLET_ICON, "Bills") + billRows;
  dayRows += washDone ? washRowHtml(iso) : ""; // finished to-dos leave Home (they still count in the ring; To-Do keeps them)
  const dayName = escapeHtml(dueLabel(iso));
  const doneN = day.done.length;
  const emptyText = doneN ? `All done · ${doneN} to-do${doneN === 1 ? "" : "s"} finished.`
    : iso === today ? "Nothing due today — tap + to add one."
    : iso < today ? "Nothing was due or done this day."
    : `Nothing planned — tap + to add one for ${dayName}.`;
  list += dayRows ? section(dayName, dayRows, "", iso)
    : `<div class="home-sec">${dayName}</div><div class="card home-list"><div class="empty">${emptyText}</div></div>`;
  if (day.anytime.length){
    const more = day.anytime.length - HOME_ANYTIME_MAX;
    list += section("Anytime", day.anytime.slice(0, HOME_ANYTIME_MAX).map(t => homeRowHtml(t)).join("")
      + (more > 0 ? `<button class="home-more" onclick="activateTab('todo')">${more} more anytime →</button>` : ""), "", "");
  }
  const openTotal = todoList.filter(t => !t.done).length;
  list += `<button class="home-more home-all" onclick="activateTab('todo')">All to-dos (${openTotal}) →</button>`;

  el.innerHTML = strip + hero + list;
}

function toggleTodo(id){

      ${chip("Today", d === today, `tdeSet({due:'${today}'})`)}
      ${chip("Tomorrow", d === tomorrow, `tdeSet({due:'${tomorrow}'})`)}
      ${tdeDateChip("modal-due", d && d !== today && d !== tomorrow ? d : "", d && d !== today && d !== tomorrow ? short(d) : "Pick date", "tdeSet({due:this.value})")}
    </div>`;
  if (d) html += `<div class="tde-chips tde-span">${tde.end
      ? `<span class="tde-through">Through</span>${tdeDateChip("modal-end", tde.end, short(tde.end), "tdeSet({end:this.value})")}<button type="button" class="tde-x" aria-label="Just one day" onclick="tdeSet({end:null})">✕</button>`
      : chip(`${SMALL_PLUS_ICON} Multi-day`, false, `tdeSet({end:'${isoDate(new Date(noonOf(d).getTime() + 864e5))}'})`)}</div>`;
  html += `<div class="tde-sec">Repeat</div><div class="tde-chips">
      ${TDE_REPEATS.map(([k, l]) => chip(l, tde.repeat === k, `tdeSet({repeat:${k ? `'${k}'` : "null"}})`)).join("")}
      ${chip("Custom", custom, `tdeSet({repeat:'${custom ? tde.repeat : "weeks"}'})`)}
    </div>`;
  if (custom) html += `<div class="tde-every"><span>Every</span>
      <button type="button" class="tde-step" aria-label="Fewer" onclick="tdeSet({every:tde.every - 1})">−</button>
      <b id="modal-every">${tde.every}</b>
      <button type="button" class="tde-step" aria-label="More" onclick="tdeSet({every:tde.every + 1})">+</button>
      <span class="tde-seg">${["weeks", "months"].map(u => `<button type="button" class="${tde.repeat === u ? "on" : ""}" aria-pressed="${tde.repeat === u}" onclick="tdeSet({repeat:'${u}'})">${tde.every === 1 ? u.slice(0, -1) : u}</button>`).join("")}</span>
    </div>`;
  // one line that reads back the choice
  const sum = [];
  if (!d) sum.push("No date · it sits under Anytime");
  else {
    sum.push(tde.end ? `${short(d)} – ${short(tde.end)} (${Math.round((noonOf(tde.end) - noonOf(d)) / 864e5) + 1} days)` : short(d));
    if (tde.repeat) sum.push(repeatLabel({repeat:tde.repeat, every:tde.every, due:d}));
  }
  // Type: Automatic (shows what it guessed from the text), a type, or None
  const textEl = document.getElementById("modal-text"), guess = detectKind(textEl ? textEl.value : "");
  const kchip = (k, label, on, icon = "", hue = null) => `<button type="button" class="filter-chip kind-chip ${on ? "on" : ""}" aria-pressed="${on}" ${hue != null ? `style="--k:${hue}"` : ""} onclick="tdeSet({kind:${k ? `'${k}'` : "null"}})">${icon}${label}</button>`;
  html += `<div class="tde-sec">Type</div><div class="tde-chips tde-kinds">
      ${kchip(null, `Auto${guess ? ` · ${TODO_KINDS[guess].label}` : ""}`, !tde.kind, guess ? TODO_KINDS[guess].icon : "", guess ? TODO_KINDS[guess].hue : null)}
      ${KIND_ORDER.map(k => kchip(k, TODO_KINDS[k].label, tde.kind === k, TODO_KINDS[k].icon, TODO_KINDS[k].hue)).join("")}
      ${kchip("none", "None", tde.kind === "none")}
    </div>`;
  return html + `<div class="tde-sum">${escapeHtml(sum.join(" · "))}</div>`;
}
function clearCompletedTodos(){
  if (!confirm("Clear all completed to-dos? This can't be undone.")) return;
  todoList = todoList.filter(t => !t.done);
  saveContent("todo-content", todoList);
  renderHome();
}

// Completed to-dos auto-move to a hidden archive (todo-archive-content, synced,
// capped) once they're 7+ days old, keeping the Completed card short-term only.
// Runs on load, after a sync pull, and on return to foreground; saves silently
// (no "Saved" toast) since the user didn't do anything. Returns true if it
// changed anything so callers know to re-render.
const TODO_RETENTION_MS = 7 * 24 * 60 * 60 * 1000;
const TODO_ARCHIVE_MAX = 200;
function archiveOldTodos(){
  let changed = false;
  // done items missing a stamp (older data): stamp now so their 7 days start today
  todoList.forEach(t => { if (t.done && !t.completedAt){ t.completedAt = Date.now(); changed = true; } });
  const cutoff = Date.now() - TODO_RETENTION_MS;
  const old = todoList.filter(t => t.done && t.completedAt < cutoff);
  if (old.length){
    const archive = loadContent("todo-archive-content", []);
    archive.push(...old.map(t => ({
      text:t.text, completedAt:t.completedAt, due:t.due || null,
      subitems:(t.subitems || []).map(s => ({text:s.text, done:!!s.done}))
    })));
    archive.sort((a,b) => (b.completedAt||0) - (a.completedAt||0));
    if (archive.length > TODO_ARCHIVE_MAX) archive.length = TODO_ARCHIVE_MAX;
    todoList = todoList.filter(t => !old.includes(t));
    writeQuietly("todo-archive-content", archive);
    changed = true;
  }
  if (changed) writeQuietly("todo-content", todoList);
  return changed;
}

// ---------- RENDER: SKIN/HAIR ----------
// ---------- SKIN & HAIR ROUTINE ----------
// One routine instead of seven per-day copies: AM steps, PM steps, and a
// wash-day PM that replaces PM on wash days. A step with `days` (weekday
// numbers, 0 = Sun) only happens on those days; no `days` means every day.
// Older data stored seven full day lists (skin-days-content); routineFromDays()
// folds them into this shape without losing which step happens on which day.
// Migrated step ids are derived from the step's text, so every device computes
// the same ids and synced check-offs keep pointing at the same steps.
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let openWeekDays = new Set();

function decodeEntities(s){
  return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
}
function stableStepId(band, label, product){
  const str = band + "|" + label + "|" + product;
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return band + "-" + (h >>> 0).toString(36);
}
function routineFromDays(days){
  const toStep = (band, raw) => {
    const label = decodeEntities(raw[0]), product = decodeEntities(raw[1]);
    const step = {id:stableStepId(band, label, product), label, product};
    if (raw[2]) step.note = decodeEntities(raw[2]);
    return step;
  };
  // Ordered union of every day's list; each step remembers the days it was on
  const merge = (band, lists) => {
    const merged = [];
    lists.forEach(({dow, steps}) => {
      let at = 0;
      steps.forEach(raw => {
        const step = toStep(band, raw);
        let i = merged.findIndex(m => m.step.id === step.id);
        if (i < 0){ merged.splice(at, 0, {step, days:new Set()}); i = at; }
        merged[i].days.add(dow);
        at = i + 1;
      });
    });
    return merged.map(({step, days}) => {
      if (days.size < lists.length){
        step.days = [...days].sort((a,b) => a - b);
        // a note like "Mon / Wed / Fri only" now duplicates `days`
        if (step.note && / only$/i.test(step.note)) delete step.note;
      }
      return step;
    });
  };
  const week = days.map(d => ({...d, dow:WEEKDAYS.indexOf(d.day)})).filter(d => d.dow >= 0);
  const washDay = week.find(d => d.pmWash && d.pmWash.length);
  return {
    am: merge("am", week.map(d => ({dow:d.dow, steps:d.am || []}))),
    pm: merge("pm", week.map(d => ({dow:d.dow, steps:d.pm || []}))),
    washPm: washDay ? merge("washPm", [{dow:washDay.dow, steps:washDay.pmWash}]) : []
  };
}
function routineForDate(date){
  const dow = date.getDay();
  const on = s => !s.days || s.days.includes(dow);
  const wash = isWashDate(date) && skinRoutine.washPm.length > 0;
  return {am:skinRoutine.am.filter(on), pm:wash ? skinRoutine.washPm : skinRoutine.pm.filter(on), wash};
}
function todayChecks(){
  const c = routineChecks[isoDate(new Date())];
  return {am:(c && c.am) || [], pm:(c && c.pm) || [], amDone:!!(c && c.amDone), pmDone:!!(c && c.pmDone)};
}
// `key` defaults to today; the Wash hair row can also tick another day's steps
function toggleRoutineStep(band, id, key = isoDate(new Date())){
  const day = routineChecks[key] || (routineChecks[key] = {am:[], pm:[]});
  const i = day[band].indexOf(id);
  if (i >= 0) day[band].splice(i, 1); else day[band].push(id);
  const wasDone = !!day[band + "Done"];
  // amDone/pmDone are recorded when ticking so the streak survives later routine edits
  const r = routineForDate(noonOf(key));
  // a band with no steps that day counts as done, so it can't block the streak
  day.amDone = r.am.every(s => day.am.includes(s.id));
  day.pmDone = r.pm.every(s => day.pm.includes(s.id));
  const cutoff = addDaysIso(-400); // about a year of history, so long streaks keep counting
  Object.keys(routineChecks).forEach(k => { if (k < cutoff) delete routineChecks[k]; });
  try{
    localStorage.setItem("routine-checks", JSON.stringify(routineChecks));
    markDataChanged();
  }catch(e){ showToast("Save failed — storage may be full or disabled", true); }
  if (!wasDone && day[band + "Done"] && key === isoDate(new Date())) showToast(band === "am" ? "Morning routine done" : "Evening routine done");
  renderSkin();
  renderHome(); // both to-do views show the Wash hair row
}
// Consecutive days with both AM and PM finished, counting today only once it's done
function routineStreak(){
  const d = new Date(); d.setHours(12, 0, 0, 0);
  const full = k => { const c = routineChecks[k]; return !!(c && c.amDone && c.pmDone); };
  if (!full(isoDate(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (full(isoDate(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function daysText(days){
  const k = days.join(",");
  if (k === "1,2,3,4,5") return "Weekdays";
  if (k === "0,6") return "Weekends";
  return [...days].sort((a,b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DAY_SHORT[d]).join(" · ");
}
function routineStepText(s){
  return `<b>${escapeHtml(s.label)}</b> — ${escapeHtml(s.product)}${s.note ? `<span class="note">${escapeHtml(s.note)}</span>` : ""}`;
}
function toggleWeekDay(key){
  if (openWeekDays.has(key)) openWeekDays.delete(key); else openWeekDays.add(key);
  renderSkin();
}

// AM/PM bands on the Today card fold away: a finished band closes itself, an
// unfinished one stays open, and a tap overrides either for the rest of the day.
const routineBandChoice = {}; // "YYYY-MM-DD:am" -> open?
function routineBandOpen(key, steps, done){
  const k = `${isoDate(new Date())}:${key}`;
  return k in routineBandChoice ? routineBandChoice[k] : !(steps.length && done === steps.length);
}
function toggleRoutineBand(key){
  const r = routineForDate(new Date()), steps = r[key], checks = todayChecks();
  const done = steps.filter(s => checks[key].includes(s.id)).length;
  routineBandChoice[`${isoDate(new Date())}:${key}`] = !routineBandOpen(key, steps, done);
  renderSkin();
}
function renderSkin(){
  const el = document.getElementById("panel-skin");
  const now = new Date();
  const todayKey = isoDate(now);
  const r = routineForDate(now);
  const checks = todayChecks();
  const streak = routineStreak();

  // 1. Today: tick-off checklist
  const band = (key, label, steps) => {
    const done = steps.filter(s => checks[key].includes(s.id)).length;
    const rows = steps.map(s => {
      const on = checks[key].includes(s.id);
      return `<button class="routine-step ${on?'done':''}" role="checkbox" aria-checked="${on}" onclick="toggleRoutineStep('${key}','${s.id}')"><span class="box">${BOX_CHECK_SVG}</span><span class="routine-text">${routineStepText(s)}</span></button>`;
    }).join("");
    const open = routineBandOpen(key, steps, done);
    const complete = steps.length > 0 && done === steps.length;
    return `<div class="routine-band ${key} ${open ? 'open' : ''}">
        <button class="routine-band-head" onclick="toggleRoutineBand('${key}')" aria-expanded="${open}"><span class="label">${label}</span><span class="routine-count ${complete ? 'complete' : ''}">${complete ? `${BOX_CHECK_SVG}Done` : `${done}/${steps.length}`}</span>${CHEVRON_DOWN}</button>
        ${open ? (rows || '<div class="empty">No steps today.</div>') : ''}
      </div>`;
  };
  let html = `<div class="card routine-today">
      <div class="glance-head"><h3 style="margin:0;">Today — ${WEEKDAYS[now.getDay()]}${r.wash ? '<span class="badge wash">Wash day</span>' : ''}</h3>${streak ? `<span class="insight">${streak}-day streak</span>` : ''}</div>
      ${band("am", "AM", r.am)}
      ${band("pm", r.wash ? "PM · wash day" : "PM", r.pm)}
    </div>`;

  // 2. This week, Sun–Sat: only what differs from the base routine; tap a day for its full list
  const monday = new Date(now); monday.setHours(12, 0, 0, 0);
  monday.setDate(monday.getDate() - monday.getDay()); // (the week's Sunday)
  let week = "";
  for (let i = 0; i < 7; i++){
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const key = isoDate(d);
    const rd = routineForDate(d);
    const extras = [...rd.am, ...(rd.wash ? [] : rd.pm)].filter(s => s.days).map(s => escapeHtml(s.label));
    if (rd.wash) extras.unshift("Wash day");
    const log = routineChecks[key];
    const finished = !!(log && log.amDone && log.pmDone);
    const open = openWeekDays.has(key);
    const list = steps => steps.map((s, n) => `<div class="step"><span class="n">${n+1}.</span><div>${routineStepText(s)}</div></div>`).join("");
    week += `<div class="week-day ${key === todayKey ? 'today' : ''} ${open ? 'open' : ''}">
        <button class="week-day-head" onclick="toggleWeekDay('${key}')" aria-expanded="${open}">
          <span class="week-day-name">${DAY_SHORT[d.getDay()]}</span>
          <span class="week-day-extras">${key === todayKey ? '<span class="badge today">Today</span>' : ''}${extras.join(" · ") || "Base routine"}</span>
          ${finished ? `<span class="week-day-done" aria-label="Routine done">${BOX_CHECK_SVG}</span>` : ''}
          ${CHEVRON_DOWN}
        </button>
        ${open ? `<div class="week-day-body"><div class="wl am">AM</div>${list(rd.am)}<div class="wl pm">${rd.wash ? 'PM · wash day' : 'PM'}</div>${list(rd.pm)}</div>` : ''}
      </div>`;
  }
  html += `<div class="card"><div class="glance-head"><h3 style="margin:0;">This week</h3></div>${week}</div>`;

  // 3. Wash-day schedule: frequency + a calendar to pick the date
  const nextWash = nextWashDate();
  const nextLabel = daysUntilWashDay() === 0 ? "today"
    : nextWash.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  html += collapsibleCard({id:"wash-card", title:"Wash day",
    insight:`${washFrequencyLabel()} · next ${nextLabel}`, body:washCalendarHtml()});

  // 4. The routine itself, edited in one place
  const editorBand = key => {
    const steps = skinRoutine[key];
    const head = key === "washPm"
      ? `Wash-day PM<span class="routine-sub">replaces PM on wash days</span>`
      : key.toUpperCase();
    const rows = steps.map((s, n) => `<button class="step editable" data-sort-id="${s.id}" onclick="editRoutineStep('${key}','${s.id}')">
        <span class="n">${n+1}.</span><div>${routineStepText(s)}${s.days ? `<span class="note">${daysText(s.days)} only</span>` : ''}</div>
      </button>`).join("");
    return `<div class="band ${key === 'am' ? 'am' : 'pm'}" data-band="${key}"><div class="label">${head}</div>
        ${rows || '<div class="empty">No steps.</div>'}
        <button class="add-row" onclick="addRoutineStep('${key}')">+ Add step</button>
      </div>`;
  };
  html += collapsibleCard({id:"routine-card", title:"Routine", insight:`${skinRoutine.am.length} AM · ${skinRoutine.pm.length} PM`,
    wrapBody:false, body:`${editorBand('am')}${editorBand('pm')}${editorBand('washPm')}`});

  // 5. Key rules (only shown once there are some)
  if (!skinRules.length){ el.innerHTML = html; return; }
  let rules = skinRules.map((r, i) => `<button class="rule editable" data-sort-id="${i}" onclick="editSkinRule(${i})">${escapeHtml(r)}</button>`).join("")
    + `<button class="add-row" onclick="addSkinRule()">+ Add rule</button>`;
  html += collapsibleCard({id:"rules-skin", title:"Key rules", insight:`${skinRules.length} rules`, body:rules});
  el.innerHTML = html;
}
function routineStepFields(band){
  const fields = [
    {key:"label", label:"Step name", type:"text"},
    {key:"product", label:"Product / description", type:"text"},
    {key:"note", label:"Note (optional)", type:"text"}
  ];
  if (band !== "washPm") fields.push({key:"days", label:"Only on these days — leave all off for every day", type:"days"});
  return fields;
}
function applyStepValues(step, v){
  step.label = v.label; step.product = v.product;
  if (v.note) step.note = v.note; else delete step.note;
  if (v.days && v.days.length && v.days.length < 7) step.days = v.days; else delete step.days;
}
function saveRoutine(){
  saveContent("skin-routine-content", skinRoutine);
  renderSkin();
  renderHomePanel();
}
function editRoutineStep(band, id){
  const s = skinRoutine[band].find(x => x.id === id);
  if (!s) return;
  openModal("Edit step", routineStepFields(band), {label:s.label, product:s.product, note:s.note || "", days:s.days || []},
    v => { if (!v.label || !v.product) return; applyStepValues(s, v); saveRoutine(); },
    () => { skinRoutine[band] = skinRoutine[band].filter(x => x.id !== id); saveRoutine(); }
  );
}
function addRoutineStep(band){
  openModal("Add step", routineStepFields(band), {days:[]},
    v => {
      if (!v.label || !v.product) return;
      const step = {id:genId(band)};
      applyStepValues(step, v);
      // keep "… — last step" entries (SPF, lash serum) last
      const list = skinRoutine[band], last = list[list.length - 1];
      if (last && /last step/i.test(last.label)) list.splice(list.length - 1, 0, step); else list.push(step);
      saveRoutine();
    }
  );
}

// ---------- wash-day schedule ----------
// Wash day repeats every `everyDays` days counting from `anchor` (a YYYY-MM-DD
// wash day). It's stored on the routine (skinRoutine.wash) so it syncs and backs
// up with it. Routines saved before the schedule was editable fall back to the
// original cadence: every 2 weeks from Thu Jul 16, 2026.
const DEFAULT_WASH = {anchor:"2026-07-16", everyDays:14};
const WASH_FREQUENCIES = [[7, "Every week"], [10, "Every 10 days"], [14, "Every 2 weeks"], [21, "Every 3 weeks"], [28, "Every 4 weeks"]];
let washCalOffset = 0; // months from the current one shown in the wash-day calendar
function washSchedule(){
  const w = skinRoutine && skinRoutine.wash;
  return w && /^\d{4}-\d{2}-\d{2}$/.test(w.anchor) && Number.isInteger(w.everyDays) && w.everyDays >= 1 && w.everyDays <= 365 ? w : DEFAULT_WASH;
}
function washFrequencyLabel(){
  const n = washSchedule().everyDays;
  const hit = WASH_FREQUENCIES.find(([d]) => d === n);
  return hit ? hit[1] : `Every ${n} days`;
}
function isWashDate(date){
  const {anchor, everyDays} = washSchedule();
  const diff = Math.round((noonOf(isoDate(date)) - noonOf(anchor)) / 86400000);
  return ((diff % everyDays) + everyDays) % everyDays === 0;
}
function nextWashDate(){
  const d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 0; i < washSchedule().everyDays && !isWashDate(d); i++) d.setDate(d.getDate() + 1);
  return d;
}
function daysUntilWashDay(){ return daysFromToday(isoDate(nextWashDate())); }
function setWashSchedule(next, message){
  const prev = skinRoutine.wash ? {...skinRoutine.wash} : null;
  skinRoutine.wash = next;
  saveRoutine();
  showUndoToast(message, () => {
    if (prev) skinRoutine.wash = prev; else delete skinRoutine.wash;
    saveRoutine();
  });
}
function setWashDate(iso){
  const label = noonOf(iso).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  setWashSchedule({anchor:iso, everyDays:washSchedule().everyDays}, `Wash day set to ${label}`);
}
function setWashFrequency(n){
  // keep the series lined up with the next upcoming wash day
  setWashSchedule({anchor:isoDate(nextWashDate()), everyDays:n}, `Wash day: ${WASH_FREQUENCIES.find(([d]) => d === n)[1].toLowerCase()}`);
}
function shiftWashMonth(delta){ washCalOffset += delta; renderSkin(); }
function washCalendarHtml(){
  const first = new Date(); first.setHours(12, 0, 0, 0); first.setDate(1); first.setMonth(first.getMonth() + washCalOffset);
  const month = first.getMonth(), todayKey = isoDate(new Date());
  const lead = first.getDay(); // Sunday-first grid
  const daysInMonth = new Date(first.getFullYear(), month + 1, 0).getDate();
  let cells = WEEK_LETTERS.map(d => `<div class="cal-dow">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += `<div class="cal-day blank"></div>`;
  for (let n = 1; n <= daysInMonth; n++){
    const d = new Date(first.getFullYear(), month, n, 12);
    const key = isoDate(d), wash = isWashDate(d);
    const cls = ["cal-day", wash ? "wash" : "", key === todayKey ? "today" : "", key < todayKey ? "past" : ""].filter(Boolean).join(" ");
    const label = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) + (wash ? ", wash day" : "");
    cells += `<button class="${cls}" onclick="setWashDate('${key}')" aria-label="${label}"${wash ? ' aria-pressed="true"' : ''}>${n}</button>`;
  }
  const freq = washSchedule().everyDays;
  const chips = WASH_FREQUENCIES.map(([n, text]) =>
    `<button class="filter-chip ${n === freq ? "on" : ""}" aria-pressed="${n === freq}" onclick="setWashFrequency(${n})">${text}</button>`).join("");
  return `<div class="wash-freq">${chips}</div>
    <div class="cal-head">
      <button class="cal-nav" onclick="shiftWashMonth(-1)" aria-label="Previous month">‹</button>
      <span>${first.toLocaleDateString('en-US', {month:'long', year:'numeric'})}</span>
      <button class="cal-nav" onclick="shiftWashMonth(1)" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <p class="footnote">Tap a date to make it a wash day — the schedule repeats from there.</p>`;
}
// Collapsible card used across tabs: the header (title, insight badge, chevron)
// toggles the body; open state lives in openPinned.
// No Edit mode: tapping an item opens its editor, and "+ Add" rows sit at the
// bottom of each card (the way Android apps do it)
function collapsibleCard({id, title, insight = "", insightId = "", body = "", wrapBody = true, innerId = ""}){

// ---------- BUDGET: bills + spending ----------
// Bills are recurring payments with a due date (rent, phone, insurance). Paying
// one logs a payment and moves the bill to its next due date; future dues are
// projected, not stored, the same way recurring to-dos are. Spending is a
// simple log of expenses against monthly category limits. Everything is per
// calendar month, and the page can step back and forth through months.
const BILL_REPEATS = {
  monthly:   {label:"Monthly", months:1},
  weekly:    {label:"Weekly"},
  biweekly:  {label:"Every 2 weeks"},
  quarterly: {label:"Quarterly", months:3},
  yearly:    {label:"Yearly", months:12},
  once:      {label:"One time"},

const DEFAULT_BUDGET = {categories:[
  {id:"cat-groceries", name:"Groceries", limit:400},
  {id:"cat-dining", name:"Dining out", limit:200},
  {id:"cat-gas", name:"Gas", limit:150},
  {id:"cat-fun", name:"Fun", limit:150},
  {id:"cat-other", name:"Other", limit:100},

let budgetMonthOffset = 0; // months from the current one shown on the Budget tab
const openBudgetCats = new Set();
const WALLET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v3h-4a2 2 0 0 0 0 4h4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/></svg>';

function nextBillIso(iso, repeat, day){

function money(n){ return "$" + fmtMoney(Number(n) || 0); }

function billsInMonth(key){
  const start = key + "-01", end = monthEndIso(key), current = key === addDaysIso(0).slice(0, 7);

    .map(p => ({bill:bills.find(b => b.id === p.billId), name:p.name, amount:p.amount, due:p.due, payment:p}));
  // (unpaid rows below carry your share of the bill)

function parseIncomeRows(text, year){
  const out = [];
  String(text || "").split(/\r?\n/).forEach(line => {
    let date = null, m;
    if ((m = line.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) date = [m[1], m[2], m[3]];
    else if ((m = line.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) date = [m[3] ? (m[3].length === 2 ? "20" + m[3] : m[3]) : String(year), m[1], m[2]];
    if (!date) return;
    const rest = line.slice(m.index + m[0].length);
    const am = rest.match(/\$?\s*([\d,]+(?:\.\d{1,2})?)\s*$/) || rest.match(/\$\s*([\d,]+(?:\.\d{1,2})?)/);
    if (!am) return;
    const amount = Number(am[1].replace(/,/g, ""));
    const iso = `${date[0]}-${String(date[1]).padStart(2, "0")}-${String(date[2]).padStart(2, "0")}`;
    if (!/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(iso) || !isFinite(amount)) return;
    out.push({date:iso, amount:Math.round(amount * 100) / 100, label:rest.replace(am[0], "").replace(/^[\s\-–—|:]+|[\s\-–—|:]+$/g, "")});
  });

function goalStatus(g){
  const saved = goalSaved(g), left = Math.max(0, g.target - saved);
  const pct = g.target ? Math.min(100, Math.round(saved / g.target * 100)) : 0;
  const out = {saved, left, pct, reached:g.target > 0 && saved >= g.target};
  if (out.reached) return out;
  if (g.date){
    const months = monthsUntil(g.date);
    out.perMonth = months >= 1 ? left / months : left; // due within a month: all of it
    out.late = g.date < addDaysIso(0);
  }
  // pace: what went in over the last 3 months, per month
  const since = addMonthsIso(addDaysIso(0), -3), recent = goalEntries(g).filter(e => e.date >= since);
  if (recent.length) out.pace = recent.reduce((s, e) => s + e.amount, 0) / 3;
  if (out.pace > 0) out.eta = addDaysIso(Math.ceil(left / out.pace * 30.44)); // finish date at this pace
  out.behind = out.perMonth != null && !out.late && !(out.pace >= out.perMonth);
  // next milestone: the first quarter mark not yet passed
  const m = GOAL_MILESTONES.find(q => saved < g.target * q / 100);
  if (m) out.next = {pct:m, amount:g.target * m / 100, away:g.target * m / 100 - saved};
  return out;
}
function editGoal(id, preset = ""){
  const g = id ? goalById(id) : null;
  // a new goal offers one-tap names (app-authored, so safe as note HTML)
  const ideas = g ? [] : GOAL_IDEAS.filter(n => !budget.goals.some(x => x.name.toLowerCase() === n.toLowerCase()));
  openModal(g ? "Edit goal" : "New goal", [
    ...(ideas.length ? [{type:"note", label:`<span class="goal-ideas">${ideas.map(n => `<button type="button" class="acct-add" onclick="document.getElementById('modal-name').value='${n}'">${n}</button>`).join("")}</span>`}] : []),
    {key:"name", label:"Goal (e.g. House down payment)", type:"text"},
    {key:"target", label:"Target amount", type:"number", step:"0.01"},
    {key:"date", label:"Target date (optional)", type:"date"},
    {key:"saved", label:g ? "Starting amount (before tracking here)" : "Already saved", type:"number", step:"0.01"},
  ], g ? {name:g.name, target:g.target, date:g.date || "", saved:g.saved} : {name:preset},
    v => {
      const name = (v.name || "").trim().slice(0, 60);
      if (!name) return;
      if (budget.goals.some(x => x !== g && x.name.toLowerCase() === name.toLowerCase())){ showToast("You already have a goal with that name", true); return; }
      const t = g || {id:genId("goal"), created:addDaysIso(0), log:[]};
      t.name = name; t.target = Math.max(0, Number(v.target) || 0);
      t.date = /^\d{4}-\d{2}-\d{2}$/.test(v.date || "") ? v.date : null;
      t.saved = Math.max(0, Number(v.saved) || 0);
      if (!g) budget.goals.push(t);
      saveBudgetData();
    },
    g ? () => {
      budget.goals = budget.goals.filter(x => x.id !== id);
      Object.values(budget.plans).forEach(p => p.lines.forEach(l => { if (l.goal === id) delete l.goal; }));
      saveBudgetData();
    } : null);
}
function addToGoal(id, entryId){
  const g = goalById(id);
  if (!g) return;
  const e = entryId ? g.log.find(x => x.id === entryId) : null;
  openModal(e ? "Edit entry" : `Add to ${g.name}`, [
    {key:"amount", label:"Amount", type:"number", step:"0.01"},
    {key:"withdraw", label:"Taking money out", type:"checkbox"},
    {key:"date", label:"Date", type:"date"},
    {key:"note", label:"Note (optional)", type:"text"},
  ], e ? {amount:Math.abs(e.amount), withdraw:e.amount < 0, date:e.date, note:e.note || ""} : {date:addDaysIso(0)},
    v => {
      const n = Math.abs(Number(v.amount) || 0);
      if (!n) return;
      const t = e || {id:genId("gl")};
      t.amount = v.withdraw ? -n : n;
      t.date = /^\d{4}-\d{2}-\d{2}$/.test(v.date || "") ? v.date : addDaysIso(0);
      t.note = (v.note || "").trim().slice(0, 80);
      if (!e) g.log.push(t);
      openGoals.add(g.id);
      saveBudgetData();
      if (!e){ const s = goalStatus(g); showToast(s.reached ? `${g.name} reached!` : `${money(t.amount)} · ${s.pct}% of ${g.name}`); }
    },
    e ? () => { g.log = g.log.filter(x => x.id !== entryId); saveBudgetData(); } : null);
}

      </div>`;

  return collapsibleCard({id:"goals-card", title:"Goals",

// collapsed Goals card: one goal speaks for itself; several sum up
function goalsInsight(){
  const gs = budget.goals;
  if (!gs.length) return "None";
  if (gs.length === 1) return goalInsight(gs[0]);
  const st = gs.map(g => goalStatus(g)), open = st.filter(x => !x.reached);
  if (!open.length) return "All done";
  const saved = gs.reduce((t, g) => t + goalSaved(g), 0), target = gs.reduce((t, g) => t + g.target, 0);
  const behind = open.filter(x => x.behind || x.late).length;
  return `${target ? Math.min(100, Math.round(saved / target * 100)) : 0}% · ${behind ? `${behind} behind` : `${moneyShort(Math.round(open.reduce((t, x) => t + x.left, 0)))} to go`}`;
}

// ---------- import bills pasted from a spreadsheet ----------
// Copying rows out of Google Sheets / Excel gives tab-separated text, e.g.
// "Ally Bank	6th	Moto Loan	$175.00". Each row becomes a monthly bill due
// that day this month; header and Total rows are skipped.
function parseBillRows(text){
  const out = [];
  String(text || "").split(/\r?\n/).forEach(line => {
    // skip header/total rows (a first cell that's exactly a heading), not bills like "Monthly gym"
    if (!line.trim() || /^\s*(total|total bills|card\s*\/\s*bank|monthly|joint bills)\s*(\t|$)/i.test(line)) return;
    let cells = line.includes("\t") ? line.split("\t") : line.split(/\s{2,}|\s*,\s*(?=\$|\d|[A-Za-z])/);
    cells = cells.map(c => c.trim()).filter(Boolean);
    let amount = null, day = null, account = null; const rest = [];
    cells.forEach(c => {
      const money = c.match(/^\$?\s*([\d,]+(?:\.\d{1,2})?)$/);
      const dayM = c.match(/^(\d{1,2})(?:st|nd|rd|th)?$/i), dateM = c.match(/^(\d{1,2})\/(\d{1,2})(?:\/\d{2,4})?$/);
      if (c === "-" || c === "—"){ if (amount == null) amount = 0; }
      else if (money && c.includes("$")) amount = Number(money[1].replace(/,/g, ""));
      else if (dayM && day == null) day = Number(dayM[1]);
      else if (dateM && day == null) day = Number(dateM[2]);
      else if (money && amount == null) amount = Number(money[1].replace(/,/g, ""));
      else if (!account && budget.accounts.some(a => a.toLowerCase() === c.toLowerCase())) account = budget.accounts.find(a => a.toLowerCase() === c.toLowerCase());
      else rest.push(c);
    });
    // four cells and no known account: the first one is the card/bank
    if (!account && cells.length >= 4 && rest.length >= 2) account = rest.shift();
    const name = rest.join(" ").slice(0, 120);
    if (name && day >= 1 && day <= 31) out.push({name, amount:amount || 0, day, account});
  });
  return out;
}
// Paycheck plans pasted from a spreadsheet: a "Paycheck  $2,487.79" row starts
// each payday's block, the rows under it are its lines, and Remaining/Total rows
// are skipped (the app works those out). Blocks fill this month's paydays in order.
function parsePlanBlocks(text){
  const blocks = [];
  String(text || "").split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    let name, amountText;
    if (line.includes("\t")){
      const cells = line.split("\t").map(c => c.trim()).filter(Boolean);
      const i = cells.findIndex(c => /^-?\$?\s*[\d,]+(\.\d{1,2})?$/.test(c));
      amountText = i >= 0 ? cells.splice(i, 1)[0] : "";
      name = cells.join(" ");
    } else {
      const m = line.trim().match(/^(.*?)\s*(\$?\s*[\d,]+(?:\.\d{1,2})?)?$/);
      name = m[1]; amountText = m[2] || "";
    }
    name = (name || "").trim();
    const amount = amountText ? Number(amountText.replace(/[$,\s]/g, "")) : null;
    if (!name || /^(remaining|total|income)\b/i.test(name)) return;
    if (/^paycheck\b/i.test(name)){ blocks.push({amount, lines:[]}); return; }
    if (!blocks.length) blocks.push({amount:null, lines:[]});
    blocks[blocks.length - 1].lines.push({name:name.slice(0, 80), amount:amount != null && isFinite(amount) ? Math.max(0, amount) : 0});
  });
  return blocks.filter(b => b.lines.length || b.amount != null);
}
function importPlans(){
  const pays = incomeInMonth(budgetMonthKey());
  if (!pays.length){ showToast(budget.income.length ? "No paydays this month" : "Add your paycheck under Income first", true); return; }
  openModal("Import paycheck plans", [
    {type:"note", label:"Copy your paycheck breakdowns from your sheet (each block starting with its <b>Paycheck</b> row) and paste them here. Blocks fill this month's paydays in order; a block's Paycheck amount sets that payday's amount."},
    {key:"rows", label:"Rows", type:"textarea"},
    {key:"replace", label:"Replace lines already on those paydays", type:"checkbox"},
  ], {replace:true},
    v => {
      const blocks = parsePlanBlocks(v.rows);
      if (!blocks.length){ showToast("Nothing found — paste rows with a name and an amount", true); return; }
      blocks.slice(0, pays.length).forEach((b, i) => {
        const p = pays[i], plan = planFor(p.key);
        if (b.amount != null && isFinite(b.amount)){ if (b.amount !== p.src.amount) plan.amount = Math.max(0, b.amount); else delete plan.amount; }
        const lines = b.lines.map(l => ({id:genId("line"), ...l}));
        plan.lines = v.replace ? lines : [...plan.lines, ...lines];
      });
      saveBudgetData();
      const n = Math.min(blocks.length, pays.length);
      showToast(`Filled ${n} payday${n === 1 ? "" : "s"}` + (blocks.length > pays.length ? ` · ${blocks.length - pays.length} extra block${blocks.length - pays.length === 1 ? "" : "s"} skipped` : ""));
    });
}
function importBills(){
  openModal("Import bills", [
    {type:"note", label:"Copy the rows from your sheet (card/bank, date, expense, amount) and paste them here. Each becomes a monthly bill due that day."},
    {key:"rows", label:"Rows", type:"textarea"},
    {key:"group", label:"Group", type:"select", options:Object.values(BILL_GROUPS)},
    {key:"paid", label:"Mark the ones due before today as paid this month", type:"checkbox"},
  ], {group:BILL_GROUPS.personal, paid:true},
    v => {
      const rows = parseBillRows(v.rows);
      if (!rows.length){ showToast("No bills found — paste rows with a date and a name", true); return; }
      const today = addDaysIso(0), key = today.slice(0, 7);
      const last = Number(monthEndIso(key).slice(8));
      rows.forEach(r => {
        if (r.account && !budget.accounts.includes(r.account)) budget.accounts.push(r.account.slice(0, 40));
        const due = `${key}-${String(Math.min(r.day, last)).padStart(2, "0")}`;
        const b = {id:genId("bill"), name:r.name, amount:r.amount, due, day:r.day, repeat:"monthly", autopay:false, link:null,
          group:v.group === BILL_GROUPS.joint ? "joint" : "personal", account:r.account || null};
        if (v.paid && due < today){
          billPayments.push({id:genId("pay"), billId:b.id, name:b.name, amount:b.amount, due, date:due, group:b.group, account:b.account});
          b.due = nextBillIso(due, "monthly", r.day);
        }
        bills.push(b);
      });
      saveBudgetData();
      showToast(`Imported ${rows.length} bill${rows.length === 1 ? "" : "s"}`);
    });
}

function budgetCalHtml(key, rows, paychecks, today){
  const start = key + "-01", days = Number(monthEndIso(key).slice(8));
  // per-day bills and paydays, for this month and (in week view) its neighbours
  const byDay = {}, pays = {}, seen = new Set();
  const addMonth = (k, list, pc) => {
    if (seen.has(k)) return; seen.add(k);
    list.filter(r => r.due.slice(0, 7) === k).forEach(r => { (byDay[r.due] = byDay[r.due] || []).push(r); });
    pc.forEach(p => { (pays[p.date] = pays[p.date] || []).push(p); });
  };
  addMonth(key, rows, paychecks);
  const sel = budgetCalDay && budgetCalDay.slice(0, 7) === key ? budgetCalDay : (today.slice(0, 7) === key ? today : start);
  let first, count;
  if (budgetCalMonth){ first = noonOf(start); first.setDate(1 - first.getDay()); count = Math.ceil((noonOf(start).getDay() + days) / 7) * 7; }
  else { first = noonOf(sel); first.setDate(first.getDate() - first.getDay()); count = 7; }
  const cellIsos = [];
  for (let n = 0; n < count; n++){ const d = new Date(first); d.setDate(first.getDate() + n); cellIsos.push(isoDate(d)); }
  cellIsos.forEach(iso => { const k = iso.slice(0, 7); if (!seen.has(k)) addMonth(k, billsInMonth(k), incomeInMonth(k)); });
  let cells = WEEK_LETTERS.map(x => `<div class="cal-dow">${x}</div>`).join("");
  cellIsos.forEach(iso => {
    if (budgetCalMonth && iso.slice(0, 7) !== key){ // last month's tail shows greyed; next month's stays blank
      cells += iso < key ? `<div class="home-day other" aria-hidden="true"><b>${Number(iso.slice(8))}</b></div>` : `<div class="home-day blank"></div>`; return; }
    const list = byDay[iso] || [], pay = pays[iso];
    const dots = list.slice(0, 3).map(r => `<i class="${r.payment ? "paid" : r.due < today ? "over" : ""}"></i>`).join("");
    const due = list.filter(r => !r.payment).reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const fed = holidaysOn(iso).filter(h => h.federal);
    const label = `${noonOf(iso).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'})}: ${list.length ? `${list.length} bill${list.length === 1 ? "" : "s"}${due ? `, ${money(due)} due` : ", paid"}` : "no bills"}${pay ? ", payday" : ""}${fed.map(h => `, ${h.name} (banks closed)`).join("")}`;

function billRowsBetween(from, toExclusive){
  const lastKey = isoDate(new Date(noonOf(toExclusive).getTime() - 864e5)).slice(0, 7);
  const months = [];
  for (let k = from.slice(0, 7), i = 0; i < 3; i++){ months.push(k); if (k >= lastKey) break; k = addMonthsIso(k + "-01", 1).slice(0, 7); }
  const seen = new Set(), out = [];
  months.forEach(m => billsInMonth(m).forEach(r => {
    if (r.due < from || r.due >= toExclusive) return;
    const id = `${r.bill ? r.bill.id : r.payment.billId}|${r.due}|${r.payment ? r.payment.id : ""}`;
    if (seen.has(id)) return;
    seen.add(id); out.push(r);
  }));
  return out;
}

// Copy last month's paycheck plans onto this month's paydays, in order. Month

function copyPrevPlans(){
  const key = budgetMonthKey(), prevKey = addMonthsIso(key + "-01", -1).slice(0, 7);
  const prev = incomeInMonth(prevKey), cur = incomeInMonth(key);
  const names = k => { const d = noonOf(k + "-01"); return [d.toLocaleDateString('en-US', {month:'long'}), d.toLocaleDateString('en-US', {month:'short'})]; };
  const [pLong, pShort] = names(prevKey), [cLong, cShort] = names(key);
  const rename = s => s.replace(new RegExp(`\\b${pLong}\\b`, "g"), cLong).replace(new RegExp(`\\b${pShort}\\b`, "g"), cShort);
  let n = 0;
  cur.forEach((p, i) => {
    const from = prev[Math.min(i, prev.length - 1)];
    if (!from || p.plan.lines.length || !from.plan.lines.length) return;
    planFor(p.key).lines = from.plan.lines.map(l => ({id:genId("line"), name:rename(l.name), amount:l.amount, ...(l.goal ? {goal:l.goal} : {})}));
    n++;

      ${tile("Bills &amp; spending", `${estimated ? "~" : ""}${moneyShort(billsSpend)}`, estimated ? `${unplanned.length} check${unplanned.length === 1 ? "" : "s"} not planned yet` : `${paidCount} bills paid`)}

      ${g0 ? tile(escapeHtml(g0.name), moneyShort(Math.round(g0s.saved)), `of ${moneyShort(g0.target)} · ${g0s.pct}%`, "goal", "document.getElementById('goals-card').scrollIntoView({behavior:'smooth'})")

    </div>`;

  budget.categories = budget.categories.filter(c => c && typeof c === "object").map(c => ({id:safeId(c.id, "cat"), name:str(c.name, 60) || "Category", limit:amt(c.limit)}));
  budget.expenses = budget.expenses.filter(e => e && iso(e.date)).map(e => ({id:safeId(e.id, "exp"), name:str(e.name, 120) || "Expense", amount:amt(e.amount), cat:e.cat ? safeId(e.cat, "cat") : null, date:e.date}));
