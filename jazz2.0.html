  });
  billPayments.forEach(p => { p.group = p.group === "joint" ? "joint" : "personal"; p.account = p.account ? str(p.account, 40) : null; });
  budget.income = (Array.isArray(budget.income) ? budget.income : []).filter(x => x && iso(x.start))
    .map(x => ({id:safeId(x.id, "inc"), name:str(x.name, 60) || "Paycheck", amount:amt(x.amount), start:x.start, repeat:BILL_REPEATS[x.repeat] ? x.repeat : "biweekly", ...(x.varies ? {varies:true} : {})}));
  const plans = budget.plans && typeof budget.plans === "object" && !Array.isArray(budget.plans) ? budget.plans : {};
  budget.plans = {};
  Object.entries(plans).forEach(([k, v]) => {
    if (!/^[A-Za-z0-9_-]+\|\d{4}-\d{2}-\d{2}$/.test(k) || !v || typeof v !== "object") return;
    budget.plans[k] = {...(v.amount != null && isFinite(Number(v.amount)) ? {amount:amt(v.amount)} : {}), ...(v.received ? {received:true} : {}),
      lines:(Array.isArray(v.lines) ? v.lines : []).filter(l => l && typeof l === "object").map(l => ({id:safeId(l.id, "line"), name:str(l.name, 80) || "Item", amount:amt(l.amount),
        ...(l.goal ? {goal:safeId(l.goal, "goal")} : {}), ...(l.done ? {done:true} : {})}))};
  });
  budget.goals = (Array.isArray(budget.goals) ? budget.goals : []).filter(g => g && typeof g === "object")
    .map(g => ({id:safeId(g.id, "goal"), name:str(g.name, 60) || "Savings", target:amt(g.target), saved:amt(g.saved),
      date:iso(g.date), created:iso(g.created) || addDaysIso(0),
      log:(Array.isArray(g.log) ? g.log : []).filter(e => e && iso(e.date) && isFinite(Number(e.amount)))
        .map(e => ({id:safeId(e.id, "gl"), date:e.date, amount:Number(e.amount), note:str(e.note, 80)}))}));
}

// ---------- FITNESS (Jazz 3.0) ----------
// One synced object: a start and goal weight, weigh-ins, a weekly workout plan
// and which planned workouts got done. Workouts are worked out from the plan
// (like wash days), so nothing piles up as to-dos.
//   plan: [{id, name, days:[0-6], every:1-4 weeks, anchor:"YYYY-MM-DD", time:"", kind}]
//   checks: {"YYYY-MM-DD|planId": true}
const DEFAULT_FITNESS = {start:null, goal:null, weights:[], plan:[], checks:{}};
let fitness = JSON.parse(JSON.stringify(DEFAULT_FITNESS));
let showWeighIns = false;
function normalizeFitness(){
  const f = fitness && typeof fitness === "object" && !Array.isArray(fitness) ? fitness : {};
  const iso = v => /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : null;
  const lbs = v => { const n = Number(v); return isFinite(n) && n >= 40 && n <= 800 ? Math.round(n * 10) / 10 : null; };
  const cutoff = addDaysIso(-400);
  fitness = {
    start:lbs(f.start), goal:lbs(f.goal),
    weights:(Array.isArray(f.weights) ? f.weights : []).filter(w => w && iso(w.date) && lbs(w.lbs) != null)
      .map(w => ({id:safeId(w.id, "wt"), date:w.date, lbs:lbs(w.lbs)})).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0),
    plan:(Array.isArray(f.plan) ? f.plan : []).filter(w => w && typeof w === "object").map(w => ({
      id:safeId(w.id, "wo"), name:String(w.name || "Workout").slice(0, 60),
      days:[...new Set((Array.isArray(w.days) ? w.days : []).map(Number).filter(d => Number.isInteger(d) && d >= 0 && d <= 6))].sort(),
      every:Math.max(1, Math.min(4, parseInt(w.every, 10) || 1)), anchor:iso(w.anchor) || addDaysIso(0),
      time:String(w.time || "").slice(0, 20), kind:TODO_KINDS[w.kind] ? w.kind : "fitness"})),
    checks:{}};
  Object.keys(f.checks && typeof f.checks === "object" ? f.checks : {}).forEach(k => {
    if (/^\d{4}-\d{2}-\d{2}\|[A-Za-z0-9_-]+$/.test(k) && f.checks[k] && k.slice(0, 10) >= cutoff) fitness.checks[k] = true;
  });
}
function saveFitness(){ saveContent("fitness-content", fitness, {toast:false}); renderFitness(); renderHome(); }
function weekStartIso(iso){ const d = noonOf(iso); d.setDate(d.getDate() - d.getDay()); return isoDate(d); }
// Does a planned workout land on this date? It starts the week of its anchor
// (start) date; every-N-weeks counts weeks from there.
function workoutOn(w, iso){
  if (!w.days.includes(noonOf(iso).getDay())) return false;
  if (iso < weekStartIso(w.anchor)) return false; // the plan starts the week of its start date
  if (w.every <= 1) return true;
  const weeks = Math.round((noonOf(weekStartIso(iso)) - noonOf(weekStartIso(w.anchor))) / (7 * 864e5));
  return ((weeks % w.every) + w.every) % w.every === 0;
}
function workoutsOn(iso){ return fitness.plan.filter(w => workoutOn(w, iso)); }
function workoutDone(iso, id){ return !!fitness.checks[`${iso}|${id}`]; }
function toggleWorkout(iso, id){
  const k = `${iso}|${id}`;
  if (fitness.checks[k]) delete fitness.checks[k]; else fitness.checks[k] = true;
  saveFitness();
}
function fmtTime(t){
  const m = String(t || "").match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return t || "";
  const h = Number(m[1]);
  return `${h % 12 || 12}${m[2] === "00" ? "" : ":" + m[2]} ${h < 12 ? "AM" : "PM"}`;
}
function workoutMeta(w){
  return [w.days.length === 7 ? "Every day" : w.days.map(d => DAY_SHORT[d]).join(" · "), fmtTime(w.time), w.every > 1 ? `every ${w.every} weeks` : ""].filter(Boolean).join(" · ");
}
// A workout as a Home row: checkable today and before, a preview after
function workoutRowHtml(w, iso){
  const today = addDaysIso(0), done = workoutDone(iso, w.id);
  const lead = iso > today
    ? `<span class="row-icon repeat-icon" aria-hidden="true">${REPEAT_ICON}</span>`
    : `<button class="todo-check" role="checkbox" aria-checked="${done}" aria-label="${done ? "Not done" : "Done"}: ${escapeAttr(w.name)}" onclick="event.stopPropagation(); toggleWorkout('${iso}','${w.id}')"><span class="box">${BOX_CHECK_SVG}</span></button>`;
  return `<div class="todo-wrap workout-row ${iso > today ? "repeat-ghost" : ""}"><div class="item ${done ? "checked" : ""}">
      ${lead}
      <div class="body" onclick="activateTab('fitness')"><div class="title">${kindIconHtml({kind:w.kind, text:w.name})}${escapeHtml(w.name)}</div><div class="todo-meta">${escapeHtml(fmtTime(w.time) || "Fitness plan")}</div></div>
    </div></div>`;
}
function currentWeight(){ const w = fitness.weights; return w.length ? w[w.length - 1].lbs : null; }
function weightStatus(){
  const cur = currentWeight(), start = fitness.start != null ? fitness.start : (fitness.weights[0] || {}).lbs, goal = fitness.goal;
  const out = {cur, start, goal};
  if (cur == null) return out;
  if (start != null) out.change = Math.round((cur - start) * 10) / 10;
  if (goal != null){
    out.toGo = Math.round(Math.abs(goal - cur) * 10) / 10;
    out.reached = start != null && start !== goal ? (goal > start ? cur >= goal : cur <= goal) : Math.abs(goal - cur) < 0.05;
    out.pct = start != null && goal !== start ? Math.max(0, Math.min(100, Math.round((cur - start) / (goal - start) * 100))) : (out.reached ? 100 : 0);
  }
  // pace: first to last weigh-in over the last 8 weeks, per week
  const since = addDaysIso(-56), recent = fitness.weights.filter(w => w.date >= since);
  if (recent.length >= 2){
    const weeks = (noonOf(recent[recent.length - 1].date) - noonOf(recent[0].date)) / (7 * 864e5);
    if (weeks >= 1){
      out.rate = Math.round((recent[recent.length - 1].lbs - recent[0].lbs) / weeks * 10) / 10;
      if (goal != null && !out.reached && out.rate && Math.sign(out.rate) === Math.sign(goal - cur)) out.eta = addDaysIso(Math.ceil(Math.abs(goal - cur) / Math.abs(out.rate) * 7));
    }
  }
  return out;
}
function weightChartHtml(){
  const pts = fitness.weights.slice(-16);
  if (pts.length < 2) return "";
  const W = 300, H = 70, vals = pts.map(p => p.lbs).concat(fitness.goal != null ? [fitness.goal] : []);
  const lo = Math.min(...vals) - 1, hi = Math.max(...vals) + 1;
  const x = i => Math.round(i / (pts.length - 1) * (W - 8) + 4), y = v => Math.round((hi - v) / (hi - lo) * (H - 8) + 4);
  const line = pts.map((p, i) => `${x(i)},${y(p.lbs)}`).join(" ");
  const goal = fitness.goal != null ? `<line x1="0" x2="${W}" y1="${y(fitness.goal)}" y2="${y(fitness.goal)}" class="wc-goal"/>` : "";
  return `<svg class="weight-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Weight trend">${goal}
      <polyline points="${line}" class="wc-line"/>${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.lbs)}" r="${i === pts.length - 1 ? 3.5 : 2}" class="wc-dot"/>`).join("")}</svg>`;
}
function logWeight(id){
  const e = id ? fitness.weights.find(w => w.id === id) : null;
  openModal(e ? "Edit weigh-in" : "Log weight", [
    {key:"lbs", label:"Weight (lb)", type:"number", step:"0.1"},
    {key:"date", label:"Date", type:"date"},
  ], e ? {lbs:e.lbs, date:e.date} : {lbs:currentWeight() ?? "", date:addDaysIso(0)},
    v => {
      const n = Math.round(Number(v.lbs) * 10) / 10;
      if (!isFinite(n) || n < 40 || n > 800) return;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(v.date || "") ? v.date : addDaysIso(0);
      const t = e || fitness.weights.find(w => w.date === date) || {id:genId("wt")}; // one weigh-in a day
      t.lbs = n; t.date = date;
      if (!fitness.weights.includes(t)) fitness.weights.push(t);
      fitness.weights.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      saveFitness();
      const s = weightStatus();
      showToast(s.reached ? "Goal weight reached!" : s.toGo != null ? `${n} lb · ${s.toGo} lb to go` : `${n} lb logged`);
    },
    e ? () => { fitness.weights = fitness.weights.filter(w => w.id !== id); saveFitness(); } : null);
}
function editWeightGoal(){
  openModal("Weight goal", [
    {key:"start", label:"Starting weight (lb)", type:"number", step:"0.1"},
    {key:"goal", label:"Goal weight (lb)", type:"number", step:"0.1"},
  ], {start:fitness.start ?? "", goal:fitness.goal ?? ""},
    v => {
      const n = x => { const k = Math.round(Number(x) * 10) / 10; return x !== "" && x != null && isFinite(k) && k >= 40 && k <= 800 ? k : null; };
      fitness.start = n(v.start); fitness.goal = n(v.goal);
      saveFitness();
    });
}
const WORKOUT_EVERY = ["Every week", "Every 2 weeks", "Every 3 weeks", "Every 4 weeks"];
function editWorkout(id){
  const w = id ? fitness.plan.find(x => x.id === id) : null;
  const kinds = KIND_ORDER.map(k => TODO_KINDS[k].label);
  openModal(w ? "Edit workout" : "Add workout", [
    {key:"name", label:"Workout (e.g. Gym, Yoga, Run)", type:"text"},
    {key:"days", label:"Days", type:"days"},
    {key:"time", label:"Time (optional)", type:"time"},
    {key:"every", label:"Repeats", type:"select", options:WORKOUT_EVERY},
    {key:"anchor", label:"Starts (a date it happens; every few weeks counts from here)", type:"date"},
    {key:"kind", label:"Type", type:"select", options:kinds},
  ], w ? {name:w.name, days:w.days, time:w.time, every:WORKOUT_EVERY[w.every - 1], anchor:w.anchor, kind:TODO_KINDS[w.kind].label}
       : {days:[], every:WORKOUT_EVERY[0], anchor:addDaysIso(0), kind:"Fitness"},
    v => {
      const name = (v.name || "").trim().slice(0, 60);
      if (!name || !(v.days || []).length){ showToast("Give it a name and at least one day", true); return; }
      const t = w || {id:genId("wo")};
      t.name = name; t.days = v.days; t.time = /^\d{1,2}:\d{2}$/.test(v.time || "") ? v.time : "";
      t.every = Math.max(1, WORKOUT_EVERY.indexOf(v.every) + 1);
      t.anchor = /^\d{4}-\d{2}-\d{2}$/.test(v.anchor || "") ? v.anchor : addDaysIso(0);
      t.kind = KIND_ORDER.find(k => TODO_KINDS[k].label === v.kind) || "fitness";
      if (!w) fitness.plan.push(t);
      saveFitness();
    },
    w ? () => { fitness.plan = fitness.plan.filter(x => x.id !== id); saveFitness(); } : null);
}
function renderFitness(){
  const el = document.getElementById("panel-fitness");
  if (!el) return;
  const today = addDaysIso(0), s = weightStatus();
  // 1. Weight
  let wBody;
  if (s.cur == null && fitness.goal == null){
    wBody = `<div class="empty">Track your weight toward a goal: log a weigh-in and set where you're headed.</div>
      <div class="goal-actions"><button class="goal-add" onclick="logWeight()">+ Log weight</button><button class="goal-hist" onclick="editWeightGoal()">Set goal</button></div>`;
  } else {
    const dir = s.change > 0 ? "Up" : s.change < 0 ? "Down" : "No change";
    const rate = s.rate != null ? `${s.rate > 0 ? "+" : ""}${s.rate} lb/week lately` : "Log a few weigh-ins to see your pace";
    wBody = `<div class="weight-top">
        <div class="weight-now"><b>${s.cur != null ? s.cur : "—"}</b><span>lb</span></div>
        <button class="weight-goal" onclick="editWeightGoal()">${s.goal != null ? (s.reached ? `${BOX_CHECK_SVG}Goal ${s.goal} reached` : `Goal ${s.goal} · <b>${s.toGo} lb to go</b>`) : "Set a goal"}</button>
      </div>
      ${s.goal != null && s.start != null ? `<div class="progress-bar"><div class="progress-fill" style="width:${s.pct}%"></div></div>
        <div class="weight-scale"><span>${s.start}</span><span>${s.pct}%</span><span>${s.goal}</span></div>` : ""}
      <div class="goal-outlook">
        ${s.change != null ? `<div>${dir}${s.change ? ` <b>${Math.abs(s.change)} lb</b>` : ""} since you started at ${s.start}</div>` : ""}
        <div>${escapeHtml(rate)}${s.eta ? ` · At this pace: <b>${escapeHtml(noonOf(s.eta).toLocaleDateString('en-US', {month:'short', day:'numeric'}))}</b>` : ""}</div>
      </div>
      ${weightChartHtml()}
      <div class="goal-actions">
        <button class="goal-add" onclick="logWeight()">+ Log weight</button>
        ${fitness.weights.length ? `<button class="goal-hist" onclick="showWeighIns = !showWeighIns; renderFitness()" aria-expanded="${showWeighIns}">Weigh-ins (${fitness.weights.length})${CHEVRON_DOWN}</button>` : ""}
      </div>
      ${showWeighIns ? `<div class="goal-entries">${fitness.weights.slice().reverse().map(w => `<button class="goal-entry" onclick="logWeight('${w.id}')">
          <span>${escapeHtml(noonOf(w.date).toLocaleDateString('en-US', {month:'short', day:'numeric', year:w.date.slice(0, 4) === today.slice(0, 4) ? undefined : 'numeric'}))}</span>
          <span class="goal-note"></span><b>${w.lbs} lb</b></button>`).join("")}</div>` : ""}`;
  }
  let html = collapsibleCard({id:"weight-card", title:"Weight", insight:s.cur != null && s.goal != null ? (s.reached ? "Goal reached" : `${s.cur} → ${s.goal}`) : s.cur != null ? `${s.cur} lb` : "Not set", body:wBody});
  // 2. This week, Sunday to Saturday
  const ws = weekStartIso(today);
  let done = 0, total = 0, week = "";
  for (let i = 0; i < 7; i++){
    const iso = isoDate(new Date(noonOf(ws).getTime() + i * 864e5)), list = workoutsOn(iso);
    total += list.length;
    const rows = list.map(w => {
      const ok = workoutDone(iso, w.id); if (ok) done++;
      const missed = !ok && iso < today;
      return `<div class="fw-item ${ok ? "done" : ""} ${missed ? "missed" : ""}">
          ${iso <= today ? `<button class="todo-check" role="checkbox" aria-checked="${ok}" aria-label="${ok ? "Not done" : "Done"}: ${escapeAttr(w.name)} ${escapeAttr(DAY_SHORT[i])}" onclick="toggleWorkout('${iso}','${w.id}')"><span class="box">${BOX_CHECK_SVG}</span></button>` : `<span class="fw-later"></span>`}
          <button class="fw-name" onclick="editWorkout('${w.id}')">${kindIconHtml({kind:w.kind, text:w.name})}<span>${escapeHtml(w.name)}</span>${w.time ? `<i>${escapeHtml(fmtTime(w.time))}</i>` : ""}</button>
        </div>`;
    }).join("");
    week += `<div class="fw-day ${iso === today ? "today" : ""} ${iso < today ? "past" : ""}">
        <div class="fw-date"><b>${DAY_SHORT[i]}</b><span>${noonOf(iso).getDate()}</span></div>
        <div class="fw-list">${rows || `<span class="fw-rest">Rest</span>`}</div>
      </div>`;
  }
  // last 4 weeks, for a sense of consistency
  let p4 = 0, d4 = 0;
  for (let i = 1; i <= 28; i++){ const iso = addDaysIso(-i); workoutsOn(iso).forEach(w => { p4++; if (workoutDone(iso, w.id)) d4++; }); }
  html += collapsibleCard({id:"fit-week", title:"This week", insight:total ? `${done}/${total} done` : "No plan yet",
    body:(fitness.plan.length ? week + (p4 ? `<div class="fw-foot">Last 4 weeks: <b>${d4} of ${p4}</b> done</div>` : "") : `<div class="empty">Add your workouts below and each week fills itself in.</div>`)});
  // 3. The plan
  const plan = fitness.plan.map(w => `<button class="fp-row" data-sort-id="${w.id}" onclick="editWorkout('${w.id}')">
      ${kindIconHtml({kind:w.kind, text:w.name})}<span class="fp-name">${escapeHtml(w.name)}<i>${escapeHtml(workoutMeta(w))}</i></span>${CHEVRON_RIGHT}</button>`).join("");
  html += collapsibleCard({id:"fit-plan", title:"Weekly plan", insight:`${fitness.plan.length} workout${fitness.plan.length === 1 ? "" : "s"}`,
    body:plan + `<button class="add-row" onclick="editWorkout()">+ Add workout</button>`});
  el.innerHTML = html;
}

// ---------- TAB SWITCHING ----------
const TAB_ORDER = ["home","todo","fitness","budget","wants","skin"]; // nav bar and swipe order
// Old links to the removed closet view (?tab=style) land on Shopping
const NAV_TAB = tab => tab === "style" ? "wants" : tab;
let currentTab = "home";

function activateTab(tab){
  tab = NAV_TAB(tab);
  currentTab = tab;
  document.body.dataset.tab = tab; // shows/hides the floating + button
  const fabCfg = COMPOSER_MODES[FAB_MODE_BY_TAB[tab]];
  if (fabCfg) document.getElementById("fab").setAttribute("aria-label", fabCfg.fab);
  if (tab === "home") renderHome(); // picks up whatever changed on other tabs
  document.querySelectorAll("nav.tabbar button").forEach(b => {
    const active = b.dataset.tab === NAV_TAB(tab);
    b.classList.toggle("active", active);
    if (active) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  document.querySelectorAll(".tabpanel").forEach(p => p.classList.toggle("active", p.id === "panel-"+tab));
  document.getElementById("headline").textContent = HEADLINES[tab];
  document.querySelector("main").scrollTop = 0;
}

document.querySelectorAll("nav.tabbar button").forEach(btn => {
  btn.addEventListener("click", () => activateTab(btn.dataset.tab));
});

// Swipe left/right between tabs (ignored if the gesture looks like a vertical scroll)
(function(){
  const mainEl = document.querySelector("main");
  let startX = 0, startY = 0, tracking = false;
  mainEl.addEventListener("touchstart", e => {
    if (e.target.closest(".home-cal, .bcal-wrap")){ tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  mainEl.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    if (Date.now() - dragJustEnded < 400) return; // that was a drag, not a swipe
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    const idx = TAB_ORDER.indexOf(NAV_TAB(currentTab));
    if (dx < 0 && idx < TAB_ORDER.length - 1) activateTab(TAB_ORDER[idx + 1]);
    if (dx > 0 && idx > 0) activateTab(TAB_ORDER[idx - 1]);
  }, {passive:true});
})();

// Pull-to-refresh: dragging down from the top of main triggers a hard refresh
// (clears the service worker cache + unregisters it, then reloads) rather than
// a normal reload, so stale cached assets can't linger. User content in
// localStorage is untouched by this -- only the cached app shell is cleared.
(function(){
  const mainEl = document.querySelector("main");
  const indicator = document.getElementById("pull-indicator");
  const label = indicator.querySelector(".pull-label");
  const THRESHOLD = 70;
  const MAX_PULL = 110;
  let startY = 0, pulling = false, dragging = false;

  mainEl.addEventListener("touchstart", e => {
    if (e.target.closest(".home-cal, .bcal-wrap")){ pulling = false; dragging = false; return; }
    pulling = mainEl.scrollTop <= 0;
    dragging = false;
    startY = e.touches[0].clientY;
  }, {passive:true});

  mainEl.addEventListener("touchmove", e => {
    if (!pulling) return;
    if (document.body.classList.contains("todo-dragging") || pressDrag.pending){ pulling = false; return; }
    if (mainEl.scrollTop > 0){ pulling = false; return; }
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    dragging = true;
    e.preventDefault();
    indicator.classList.remove("animated");
    const pull = Math.min(dy * 0.5, MAX_PULL);
    indicator.style.height = pull + "px";
    const ready = pull >= THRESHOLD;
    indicator.classList.toggle("ready", ready);
    label.textContent = ready ? "Release to refresh" : "Pull to refresh";
  }, {passive:false});

  mainEl.addEventListener("touchend", () => {
    if (!dragging){ pulling = false; return; }
    dragging = false;
    indicator.classList.add("animated");
    if (indicator.classList.contains("ready")){
      indicator.classList.add("refreshing");
      label.textContent = "Refreshing…";
      indicator.style.height = THRESHOLD + "px";
      hardRefresh();
    } else {
      indicator.style.height = "0px";
    }
    pulling = false;
  }, {passive:true});
})();

// Drag-to-reorder for sub-items: vertical drag reorders within the sub-list;
// dragging LEFT past the threshold promotes the sub-item back to a full to-do
// (the mirror of dragging a to-do right to nest it).
(function(){
  const mainEl = document.querySelector("main");
  const panel = document.getElementById("panel-todo");
  let sd = null;

  pressToDrag(panel, ".subitem-row", (row, x, y, pointerId, y0 = y) => {
    const list = row.closest(".subitem-list");
    const wrap = row.closest(".todo-wrap");
    if (!list || !wrap || sd) return;
    try{ row.setPointerCapture(pointerId); }catch(err){}
    const r = row.getBoundingClientRect();
    sd = {row, list, wrap, todoId:wrap.dataset.todoId, subId:row.dataset.subId,
          clientY:y, clientX:x, startX:x,
          grabOffset:y0 - r.top, promoting:false, moveTarget:null, raf:0,
          clip:[wrap.closest(".coll-body"), wrap.closest(".pinned")].filter(Boolean)};
    sd.clip.forEach(el => el.style.overflow = "visible");
    row.classList.add("drag-active-sub");
    document.body.classList.add("todo-dragging");
    tick();
  }, "button, a, input, textarea");

  panel.addEventListener("pointermove", e => {
    if (sd){ sd.clientY = e.clientY; sd.clientX = e.clientX; }
  });
  panel.addEventListener("pointerup", () => end(true));
  panel.addEventListener("pointercancel", () => end(false));

  function tick(){
    if (!sd) return;
    const mr = mainEl.getBoundingClientRect();
    if (sd.clientY < mr.top + 70) mainEl.scrollTop -= 9;
    else if (sd.clientY > mr.bottom - 110) mainEl.scrollTop += 9;
    const promoting = (sd.startX - sd.clientX) > 48;
    if (promoting !== sd.promoting){
      sd.promoting = promoting;
      sd.row.classList.toggle("promoting", promoting);
    }
    // Hovering over a different to-do marks it as the re-parent target;
    // dropping there moves the sub-item into that to-do's sub-list.
    const target = promoting ? null : hoverWrap();
    if (target !== sd.moveTarget){
      if (sd.moveTarget) sd.moveTarget.classList.remove("indent-target");
      sd.moveTarget = target;
      if (target) target.classList.add("indent-target");
    }
    if (!promoting && !sd.moveTarget) reorder();
    position();
    sd.raf = requestAnimationFrame(tick);
  }

  function hoverWrap(){
    const list = document.getElementById("todo-list");
    if (!list) return null;
    for (const w of list.querySelectorAll(".todo-wrap")){
      if (w === sd.wrap) continue;
      const r = w.getBoundingClientRect();
      if (sd.clientY >= r.top && sd.clientY <= r.bottom) return w;
    }
    return null;
  }

  function reorder(){
    const siblings = [...sd.list.querySelectorAll(".subitem-row:not(.drag-active-sub)")];
    const next = siblings.find(s => {
      const r = s.getBoundingClientRect();
      return sd.clientY <= r.top + r.height / 2;
    });
    if (next){
      if (next.previousElementSibling !== sd.row) sd.list.insertBefore(sd.row, next);
    } else {
      // keep the row above the add pill/input, which stays last
      const addUi = sd.list.querySelector(".subitem-add-toggle, .subitem-add");
      if (addUi && sd.row.nextElementSibling !== addUi && addUi.previousElementSibling !== sd.row){
        sd.list.insertBefore(sd.row, addUi);
      }
    }
  }

  function position(){
    sd.row.style.transform = "";
    const top = sd.row.getBoundingClientRect().top;
    const dx = sd.promoting ? -28 : 0;
    sd.row.style.transform = `translate(${dx}px, ${sd.clientY - sd.grabOffset - top}px)`;
  }

  function end(commit){
    if (!sd) return;
    dragJustEnded = Date.now();
    cancelAnimationFrame(sd.raf);
    sd.row.style.transform = "";
    sd.row.classList.remove("drag-active-sub", "promoting");
    if (sd.moveTarget) sd.moveTarget.classList.remove("indent-target");
    sd.clip.forEach(el => el.style.overflow = "");
    document.body.classList.remove("todo-dragging");
    const ctx = sd;
    sd = null;
    if (!commit){ renderHome(); return; }
    const t = todoList.find(x => x.id === ctx.todoId);
    if (!t || !t.subitems){ renderHome(); return; }
    if (ctx.promoting){
      const idx = t.subitems.findIndex(s => s.id === ctx.subId);
      if (idx < 0){ renderHome(); return; }
      const [s] = t.subitems.splice(idx, 1);
      todoList.splice(todoList.indexOf(t) + 1, 0, {
        id:genId("todo"), text:s.text, done:!!s.done, due:t.due || null,
        starred:false, subitems:[], completedAt:s.done ? Date.now() : null
      });
    } else if (ctx.moveTarget){
      const dest = todoList.find(x => x.id === ctx.moveTarget.dataset.todoId);
      const idx = t.subitems.findIndex(s => s.id === ctx.subId);
      if (!dest || dest === t || idx < 0){ renderHome(); return; }
      const [s] = t.subitems.splice(idx, 1);
      if (!dest.subitems) dest.subitems = [];
      dest.subitems.push(s);
      expandedTodos.add(dest.id); // show where it landed
    } else {
      const order = [...ctx.list.querySelectorAll(".subitem-row")].map(r => r.dataset.subId);
      t.subitems.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id));
    }
    saveContent("todo-content", todoList);
    renderHome();
  }
})();

// Press-and-drag for list rows: with a mouse, dragging starts once the pointer
// moves 6px; on touch, after a short hold (so a quick swipe still scrolls and a
// tap still taps). Buttons, links and inputs inside a row keep their own taps.
let dragJustEnded = 0; // the click that ends a drag mustn't open the editor
const pressDrag = {pending:null};
document.addEventListener("click", e => { if (Date.now() - dragJustEnded < 400){ e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener("touchmove", e => { if (document.body.classList.contains("todo-dragging")) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", e => { if (document.body.classList.contains("todo-dragging") || pressDrag.pending) e.preventDefault(); });
function pressToDrag(panel, rowSel, onStart, ignore = "button, a, input, textarea, select, label, .subitem-list"){
  const owner = {}; // several lists can share a panel: each only acts on its own press
  panel.addEventListener("pointerdown", e => {
    if (e.button > 0 || pressDrag.pending || document.body.classList.contains("todo-dragging")) return;
    const row = e.target.closest(rowSel);
    const skip = row && e.target.closest(ignore);
    if (!row || (skip && skip !== row && row.contains(skip))) return;
    const p = {owner, row, x:e.clientX, y:e.clientY, id:e.pointerId, touch:e.pointerType !== "mouse", timer:0};
    pressDrag.pending = p;
    if (p.touch) p.timer = setTimeout(() => {
      if (pressDrag.pending !== p) return;
      pressDrag.pending = null;
      try{ navigator.vibrate && navigator.vibrate(12); }catch(err){}
      onStart(p.row, p.x, p.y, p.id, p.y);
    }, 300);
  });
  panel.addEventListener("pointermove", e => {
    const p = pressDrag.pending;
    if (!p || p.owner !== owner || e.pointerId !== p.id) return;
    const d = Math.hypot(e.clientX - p.x, e.clientY - p.y);
    if (p.touch){ if (d > 10){ clearTimeout(p.timer); pressDrag.pending = null; } } // it's a scroll
    else if (d > 6){ pressDrag.pending = null; onStart(p.row, e.clientX, e.clientY, p.id, p.y); }
  });
  const cancel = () => { const p = pressDrag.pending; if (p){ clearTimeout(p.timer); pressDrag.pending = null; } };
  panel.addEventListener("pointerup", cancel);
  panel.addEventListener("pointercancel", cancel);
}

// Drag-to-reorder for to-do items: press and drag a row and
// move it up or down the open list. The row follows the finger, rows shuffle
// live, holding near the top/bottom edge autoscrolls, and dropping under a
// different day header reassigns the to-do's day.
(function(){
  const mainEl = document.querySelector("main");
  const panel = document.getElementById("panel-todo");
  let drag = null;

  pressToDrag(panel, "#todo-list .todo-wrap[data-todo-id]", (wrap, x, y, id, y0) => begin(wrap, x, y, id, wrap, y0));

  function begin(wrap, x, y, pointerId, captureEl, grabY = y){
    const list = document.getElementById("todo-list");
    if (!wrap || !list || !list.contains(wrap) || drag) return;
    try{ captureEl.setPointerCapture(pointerId); }catch(err){}
    const rect = wrap.getBoundingClientRect();
    drag = {wrap, list, clientY:y, grabOffset:grabY - rect.top, raf:0,
            startX:x, clientX:x, indentTarget:null,
            clip:[wrap.closest(".coll-body"), wrap.closest(".pinned")].filter(Boolean)};
    drag.clip.forEach(el => el.style.overflow = "visible"); // don't clip the lifted row
    wrap.classList.add("drag-active");
    document.body.classList.add("todo-dragging");
    tick();
  }

  panel.addEventListener("pointermove", e => {
    if (drag){ drag.clientY = e.clientY; drag.clientX = e.clientX; }
  });
  panel.addEventListener("pointerup", () => endDrag(true));
  panel.addEventListener("pointercancel", () => endDrag(false));

  function tick(){
    if (!drag) return;
    const mr = mainEl.getBoundingClientRect();
    if (drag.clientY < mr.top + 70) mainEl.scrollTop -= 9;
    else if (drag.clientY > mr.bottom - 110) mainEl.scrollTop += 9;
    // Dragging right past the threshold switches to indent mode: the row above
    // becomes the nesting target and vertical reordering pauses.
    const prev = prevTodoWrap(drag.wrap);
    const wantIndent = (drag.clientX - drag.startX) > 48 && prev;
    const target = wantIndent ? prev : null;
    if (target !== drag.indentTarget){
      if (drag.indentTarget) drag.indentTarget.classList.remove("indent-target");
      drag.indentTarget = target;
      if (target) target.classList.add("indent-target");
      drag.wrap.classList.toggle("indenting", !!target);
    }
    if (!drag.indentTarget) reorder();
    position();
    drag.raf = requestAnimationFrame(tick);
  }

  function prevTodoWrap(w){
    let el = w.previousElementSibling;
    while (el && !(el.classList.contains("todo-wrap") && el.dataset.todoId)) el = el.previousElementSibling;
    return el;
  }

  function reorder(){
    const siblings = [...drag.list.querySelectorAll(".todo-wrap:not(.drag-active)")];
    let next = siblings.find(s => {
      const r = s.getBoundingClientRect();
      return drag.clientY <= r.top + r.height / 2;
    });
    // A Wash hair row is pinned under its day header: dropping above it lands
    // at the end of the previous group, not between the header and the row
    if (next && next.classList.contains("wash-row") && next.previousElementSibling && next.previousElementSibling.classList.contains("cat-title")) next = next.previousElementSibling;
    if (next){
      if (next.previousElementSibling !== drag.wrap) drag.list.insertBefore(drag.wrap, next);
    } else if (drag.list.lastElementChild !== drag.wrap){
      drag.list.appendChild(drag.wrap);
    }
  }

  function position(){
    // clear the transform first so the rect reflects the row's slot position
    drag.wrap.style.transform = "";
    const top = drag.wrap.getBoundingClientRect().top;
    const dx = drag.indentTarget ? 28 : 0;
    drag.wrap.style.transform = `translate(${dx}px, ${drag.clientY - drag.grabOffset - top}px)`;
  }

  function endDrag(commit){
    if (!drag) return;
    dragJustEnded = Date.now();
    cancelAnimationFrame(drag.raf);
    drag.wrap.style.transform = "";
    drag.wrap.classList.remove("drag-active", "indenting");
    if (drag.indentTarget) drag.indentTarget.classList.remove("indent-target");
    drag.clip.forEach(el => el.style.overflow = "");
    document.body.classList.remove("todo-dragging");
    const {list, wrap, indentTarget} = drag;
    drag = null;
    if (commit && indentTarget) commitNest(wrap, indentTarget);
    else if (commit) commitTodoOrder(list);
    else renderHome(); // put rows back where the data says they belong
  }

  // Fold the dragged to-do into the row above as a sub-item; its own
  // sub-items (if any) come along, flattened after it.
  function commitNest(wrap, targetWrap){
    const t = todoList.find(x => x.id === wrap.dataset.todoId);
    const target = todoList.find(x => x.id === targetWrap.dataset.todoId);
    if (!t || !target || t === target){ renderHome(); return; }
    if (t.repeat){ showToast("Repeating to-dos can't become sub-items"); renderHome(); return; }
    if (!target.subitems) target.subitems = [];
    target.subitems.push({id:genId("sub"), text:t.text, done:false});
    (t.subitems || []).forEach(s => target.subitems.push({id:genId("sub"), text:s.text, done:s.done}));
    todoList = todoList.filter(x => x.id !== t.id);
    expandedTodos.add(target.id);
    saveContent("todo-content", todoList);
    renderHome();
  }

  function commitTodoOrder(list){
    const ordered = [];
    [...list.querySelectorAll(".todo-wrap[data-todo-id]")].forEach(w => {
      const t = todoList.find(x => x.id === w.dataset.todoId);
      if (!t) return;
      let el = w.previousElementSibling;
      while (el && !el.classList.contains("cat-title")) el = el.previousElementSibling;
      // Overdue/Later headers say "keep": dropping there reorders without
      // inventing a date. Other headers carry their own date ("" = Anytime).
      // a repeating to-do keeps a date (dropping it in Anytime leaves its date alone)
      if (el && el.dataset.due !== "keep" && !(t.repeat && !el.dataset.due)){
        const due = el.dataset.due || null;
        if (t.repeat && due !== t.due) t.repeatDay = dayOf(due);
        t.due = due;
      }
      ordered.push(t);
    });
    const ids = new Set(ordered.map(t => t.id));
    todoList = [...ordered, ...todoList.filter(t => !ids.has(t.id))];
    saveContent("todo-content", todoList);
    renderHome();
  }
})();

// Press-and-drag reordering for the other lists (routine steps, rules, plan
// lines, goals, spending categories): a row moves among its siblings in the
// same container, and onDrop gets the new order of their data-sort-ids.
function sortable(panel, itemSel, onDrop, ignore){
  const mainEl = document.querySelector("main");
  let d = null;
  pressToDrag(panel, itemSel, (row, x, y, id, y0 = y) => {
    if (d || !row.dataset.sortId) return;
    try{ row.setPointerCapture(id); }catch(err){}
    const r = row.getBoundingClientRect();
    d = {row, box:row.parentElement, clientY:y, grabOffset:y0 - r.top, raf:0,
         clip:[row.closest(".coll-body"), row.closest(".pinned"), row.closest(".card")].filter(Boolean)};
    d.clip.forEach(el => el.style.overflow = "visible");
    row.classList.add("sort-active");
    document.body.classList.add("todo-dragging");
    tick();
  }, ignore);
  panel.addEventListener("pointermove", e => { if (d) d.clientY = e.clientY; });
  panel.addEventListener("pointerup", () => end(true));
  panel.addEventListener("pointercancel", () => end(false));
  function tick(){
    if (!d) return;
    const mr = mainEl.getBoundingClientRect();
    if (d.clientY < mr.top + 70) mainEl.scrollTop -= 9;
    else if (d.clientY > mr.bottom - 110) mainEl.scrollTop += 9;
    const sibs = [...d.box.children].filter(el => el !== d.row && el.matches(itemSel) && el.dataset.sortId);
    const next = sibs.find(el => { const b = el.getBoundingClientRect(); return d.clientY <= b.top + b.height / 2; });
    if (next){ if (next.previousElementSibling !== d.row) d.box.insertBefore(d.row, next); }
    else if (sibs.length){ const last = sibs[sibs.length - 1]; if (last.nextElementSibling !== d.row) last.after(d.row); }
    d.row.style.transform = "";
    const top = d.row.getBoundingClientRect().top;
    d.row.style.transform = `translateY(${d.clientY - d.grabOffset - top}px)`;
    d.raf = requestAnimationFrame(tick);
  }
  function end(commit){
    if (!d) return;
    dragJustEnded = Date.now();
    cancelAnimationFrame(d.raf);
    const {row, box} = d;
    row.style.transform = "";
    row.classList.remove("sort-active");
    d.clip.forEach(el => el.style.overflow = "");
    document.body.classList.remove("todo-dragging");
    d = null;
    const ids = [...box.children].filter(el => el.matches(itemSel) && el.dataset.sortId).map(el => el.dataset.sortId);
    if (commit) onDrop(box, ids); else { renderSkin(); renderBudget(); renderFitness(); }
  }
}
const byIds = (list, ids, key = x => x.id) => ids.map(id => list.find(x => String(key(x)) === id)).filter(Boolean)
  .concat(list.filter(x => !ids.includes(String(key(x))))); // anything not shown keeps its place at the end
// Skin & Hair: routine steps within their band, and the key rules
sortable(document.getElementById("panel-skin"), ".band[data-band] > .step.editable", (box, ids) => {
  const key = box.dataset.band;
  if (!skinRoutine[key]) return;
  skinRoutine[key] = byIds(skinRoutine[key], ids);
  saveContent("skin-routine-content", skinRoutine); renderSkin(); renderHomePanel();
}, "a, input, textarea");
sortable(document.getElementById("panel-skin"), "#rules-skin .rule.editable", (box, ids) => {
  skinRules = ids.map(i => skinRules[Number(i)]).filter(r => r != null);
  saveContent("skin-rules-content", skinRules); renderSkin();
}, "a, input, textarea");
// Budget: a paycheck's plan lines, goals, and spending categories
sortable(document.getElementById("panel-budget"), ".pp[data-key] > .plan-row", (box, ids) => {
  const plan = budget.plans[box.dataset.key];
  if (plan) plan.lines = byIds(plan.lines, ids);
  saveBudgetData();
}, ".todo-check, a, input");
sortable(document.getElementById("panel-budget"), "#goals-card .goal", (box, ids) => {
  budget.goals = byIds(budget.goals, ids);
  saveBudgetData();
}, ".goal-actions, .goal-entries, a, input");
sortable(document.getElementById("panel-fitness"), "#fit-plan .fp-row", (box, ids) => {
  fitness.plan = byIds(fitness.plan, ids);
  saveFitness();
}, "a, input");
sortable(document.getElementById("panel-budget"), "#spending-card .budget-cat", (box, ids) => {
  budget.categories = byIds(budget.categories, ids);
  saveBudgetData();
}, ".expense-list, a, input");

// Home: press and drag a to-do within the day's lists. Dropping it in another
// section moves it there: the day's list sets that date, Anytime clears it,
// Overdue keeps the date it has.
(function(){
  const mainEl = document.querySelector("main");
  const panel = document.getElementById("panel-home");
  let drag = null;
  pressToDrag(panel, ".home-list .todo-wrap[data-todo-id]", (wrap, x, y, id, y0 = y) => {
    if (drag) return;
    try{ wrap.setPointerCapture(id); }catch(err){}
    const rect = wrap.getBoundingClientRect();
    drag = {wrap, clientY:y, grabOffset:y0 - rect.top, raf:0, clip:[...panel.querySelectorAll(".home-list")]};
    drag.clip.forEach(el => el.style.overflow = "visible");
    wrap.classList.add("drag-active");
    document.body.classList.add("todo-dragging");
    tick();
  });
  panel.addEventListener("pointermove", e => { if (drag) drag.clientY = e.clientY; });
  panel.addEventListener("pointerup", () => end(true));
  panel.addEventListener("pointercancel", () => end(false));

  function tick(){
    if (!drag) return;
    const mr = mainEl.getBoundingClientRect();
    if (drag.clientY < mr.top + 70) mainEl.scrollTop -= 9;
    else if (drag.clientY > mr.bottom - 110) mainEl.scrollTop += 9;
    // move the row before the first to-do (in any list) whose middle is below the finger
    const rows = [...panel.querySelectorAll(".home-list .todo-wrap[data-todo-id]:not(.drag-active)")];
    const next = rows.find(r => { const b = r.getBoundingClientRect(); return drag.clientY <= b.top + b.height / 2; });
    if (next){ if (next.previousElementSibling !== drag.wrap) next.parentNode.insertBefore(drag.wrap, next); }
    else {
      // below every row: the end of the last list the finger is past
      const lists = [...panel.querySelectorAll(".home-list")].filter(l => l.getBoundingClientRect().top < drag.clientY);
      const last = lists[lists.length - 1];
      if (last){
        const anchor = last.querySelector(".home-more");
        if (anchor){ if (anchor.previousElementSibling !== drag.wrap) last.insertBefore(drag.wrap, anchor); }
        else if (last.lastElementChild !== drag.wrap) last.appendChild(drag.wrap);
      }
    }
    drag.wrap.style.transform = "";
    const top = drag.wrap.getBoundingClientRect().top;
    drag.wrap.style.transform = `translateY(${drag.clientY - drag.grabOffset - top}px)`;
    drag.raf = requestAnimationFrame(tick);
  }

  function end(commit){
    if (!drag) return;
    dragJustEnded = Date.now();
    cancelAnimationFrame(drag.raf);
    const {wrap} = drag;
    wrap.style.transform = "";
    wrap.classList.remove("drag-active");
    drag.clip.forEach(el => el.style.overflow = "");
    document.body.classList.remove("todo-dragging");
    drag = null;
    if (!commit){ renderHome(); return; }
    // new order of the to-dos shown, and the date each one's section stands for
    const shown = [...panel.querySelectorAll(".home-list .todo-wrap[data-todo-id]")].map(w => {
      const head = w.closest(".home-list").previousElementSibling;
      return {t:todoList.find(x => x.id === w.dataset.todoId), due:head && head.dataset.due != null ? head.dataset.due : "keep"};
    }).filter(x => x.t);
    shown.forEach(({t, due}) => {
      if (due === "keep" || (t.repeat && !due)) return; // a repeat keeps a date
      const d = due || null;
      if (d === t.due || (d && spansOn(t, d))) return;
      if (t.repeat && d) t.repeatDay = dayOf(d);
      t.due = d;
    });
    // the shown to-dos take the same slots in the list, in their new order
    const slots = shown.map(x => todoList.indexOf(x.t)).sort((a, b) => a - b);
    const next = todoList.slice();
    slots.forEach((slot, k) => { next[slot] = shown[k].t; });
    todoList = next;
    saveContent("todo-content", todoList);
    renderHome();
  }
})();

async function hardRefresh(){
  try{
    if ("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  }catch(e){ console.error("hard refresh cleanup failed", e); }
  // come back to the same tab and spot after the reload (this tab only)
  try{ sessionStorage.setItem("resume-view", JSON.stringify({tab:currentTab, scroll:document.querySelector("main").scrollTop})); }catch(e){}
  location.reload();
}
function resumeView(){
  let v = null;
  try{ v = JSON.parse(sessionStorage.getItem("resume-view")); sessionStorage.removeItem("resume-view"); }catch(e){}
  if (!v || !TAB_ORDER.includes(v.tab) || v.tab === currentTab) return;
  activateTab(v.tab);
  const y = Number(v.scroll) || 0;
  if (y) requestAnimationFrame(() => { document.querySelector("main").scrollTop = y; });
}

// ---------- GIST SYNC ----------
// Optional cross-device sync through a private GitHub Gist. The gist holds one
// JSON file with every content/state key plus an updatedAt stamp; conflicts are
// merged per list (see syncNow). Requires a classic PAT with only the `gist`
// scope (fine-grained tokens can't use the Gist API), pasted once per device
// via the cloud button in the header. Token + gist id live in localStorage and
// are never synced themselves.
const SYNC_KEYS = ["skin-rules-content","skin-routine-content","routine-checks","skin-days-content","style-rules-content","sizes-content",
                   "capsule-content","wants-content","todo-content","todo-archive-content",
                   "style-state","wants-state","bills-content","bill-payments","budget-content","fitness-content"];
const GIST_FILENAME = "jazz2-data.json";
let syncPushTimer = null;
let syncBusy = false;

function markDataChanged(){
  localStorage.setItem("data-updated-at", String(Date.now()));
  scheduleSyncPush();
}
function setSyncStatus(state){
  const btn = document.getElementById("sync-btn");
  if (btn) btn.dataset.state = state;
}
async function gistApi(path, opts = {}){
  const res = await fetch("https://api.github.com" + path, {
    ...opts,
    headers:{
      "Authorization": "Bearer " + localStorage.getItem("sync-token"),
      "Accept": "application/vnd.github+json",
      ...(opts.headers || {})
    }
  });
  if (!res.ok) throw new Error("GitHub API " + res.status + " on " + path);
  return res.json();
}
function collectLocal(){
  const data = {};
  SYNC_KEYS.forEach(k => {
    const raw = localStorage.getItem(k);
    if (raw != null){ try{ data[k] = JSON.parse(raw); }catch(e){} }
  });
  return {updatedAt: Number(localStorage.getItem("data-updated-at")) || 0, data};
}
function applyRemote(payload){
  SYNC_KEYS.forEach(k => {
    if (payload.data && k in payload.data) localStorage.setItem(k, JSON.stringify(payload.data[k]));
  });
  // Data from an older app version (or an old backup) has per-day skin lists but
  // no merged routine: drop the local routine so it's rebuilt from those lists
  if (payload.data && "skin-days-content" in payload.data && !("skin-routine-content" in payload.data)){
    localStorage.removeItem("skin-routine-content");
  }
  localStorage.setItem("data-updated-at", String(payload.updatedAt || Date.now()));
  loadAllContent();
  styleState = loadState("style-state");
  wantsState = loadState("wants-state");
  migrateWardrobeNeeds(); // data from an older app version may still have a wardrobe "Still need" list
  archiveOldTodos(); // the other device may have carried expired completed items
  renderSkin(); renderWants(); renderBudget(); renderFitness(); renderHome();
}
async function findOrCreateGist(){
  const gists = await gistApi("/gists?per_page=100");
  const hit = gists.find(g => g.files && g.files[GIST_FILENAME]);
  let id = hit && hit.id;
  if (!id){
    const created = await gistApi("/gists", {method:"POST", body: JSON.stringify({
      description:"Jazz 2.0 app data (auto-sync)", public:false,
      files:{[GIST_FILENAME]:{content: JSON.stringify(collectLocal())}}
    })});
    id = created.id;
  }
  localStorage.setItem("sync-gist-id", id);
  return id;
}
function scheduleSyncPush(){
  if (!localStorage.getItem("sync-token")) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => pushSync().catch(() => {}), 1500);

// Sync is a three-way merge per list (each SYNC_KEYS entry). "sync-base" keeps
// every list as it was at the last successful sync. A list this device changed
// since then is sent up; a list only the other device changed is taken from
// the gist. If both changed the same list, this device's copy wins for that
// list only, so edits to different lists on two devices never clobber each
// other. The gist is always re-read right before writing.
const SYNC_BASE_KEY = "sync-base";
function isEditing(){
  return document.getElementById("modal-backdrop").classList.contains("open")
    || document.getElementById("composer").classList.contains("open");
}
function localSnapshot(){
  const out = {};
  SYNC_KEYS.forEach(k => {
    const raw = localStorage.getItem(k);
    if (raw != null){ try{ out[k] = JSON.stringify(JSON.parse(raw)); }catch(e){} }
  });
  return out;
}
async function fetchRemote(gistId){
  const g = await gistApi("/gists/" + gistId);
  const file = g.files && g.files[GIST_FILENAME];
  if (!file) return null;
  const text = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
  try{ const p = JSON.parse(text); return p && typeof p === "object" && p.data && typeof p.data === "object" ? p : null; }catch(e){ return null; }
}
async function syncNow(){
  if (!localStorage.getItem("sync-token")) return;
  // never swap data out from under an open edit form; try again shortly
  if (syncBusy || isEditing()){ scheduleSyncPush(); return; }
  syncBusy = true; setSyncStatus("busy");
  try{
    const gistId = localStorage.getItem("sync-gist-id") || await findOrCreateGist();
    const remote = await fetchRemote(gistId);
    const local = localSnapshot();
    const remoteStr = {};
    if (remote) Object.entries(remote.data).forEach(([k, v]) => { remoteStr[k] = JSON.stringify(v); });
    let baseRaw = localStorage.getItem(SYNC_BASE_KEY), base = null;
    try{ base = baseRaw ? JSON.parse(baseRaw) : null; }catch(e){ base = null; }
    let merged = {}, takeRemote = [], sendUp = false;
    if (!base){
      // First sync on this device (or the first since this kind of sync existed):
      // fall back to "newest copy wins", which is what earlier versions did
      const localUpdated = Number(localStorage.getItem("data-updated-at")) || 0;
      const remoteUpdated = (remote && remote.updatedAt) || 0;
      if (remote && remoteUpdated > localUpdated){ merged = {...remoteStr}; takeRemote = Object.keys(remoteStr); }
      else { merged = {...local}; sendUp = true; }
    } else {
      new Set([...SYNC_KEYS, ...Object.keys(remoteStr)]).forEach(k => {
        const l = local[k], r = remoteStr[k], b = base[k];
        if (l !== b){ if (l !== undefined) merged[k] = l; if (l !== r) sendUp = true; }        // changed here
        else if (r !== undefined){ merged[k] = r; if (r !== l) takeRemote.push(k); }           // unchanged here
      });
      if (!remote) sendUp = true;
    }
    if (takeRemote.length){
      const data = {};
      takeRemote.forEach(k => { data[k] = JSON.parse(merged[k]); });
      applyRemote({updatedAt:(remote && remote.updatedAt) || Date.now(), data});
      showToast("Synced from your other device");
    }
    if (sendUp){
      const data = {};
      Object.entries(merged).forEach(([k, v]) => { data[k] = JSON.parse(v); });
      const updatedAt = Math.max(Date.now(), (remote && remote.updatedAt) || 0);
      await gistApi("/gists/" + gistId, {method:"PATCH", body: JSON.stringify({
        files:{[GIST_FILENAME]:{content: JSON.stringify({updatedAt, data})}}
      })});
      localStorage.setItem("data-updated-at", String(updatedAt));
    }
    localStorage.setItem(SYNC_BASE_KEY, JSON.stringify(merged));
    setSyncStatus("ok");
  }catch(e){
    console.error("sync failed", e);
    setSyncStatus("error");
    throw e;
  }finally{
    syncBusy = false;
  }
}
async function pushSync(){
  try{ await syncNow(); }
  catch(e){ showToast("Sync failed — will retry on next change", true); throw e; }
}
function pullSync(){ return syncNow(); }
// ---------- BACKUP ----------
// One JSON file holding every synced key. Works with or without gist sync, so
// it doubles as a manual way to move data between devices.
async function downloadBackup(){
  // Live values, not just what's in localStorage: a list still on its built-in
  // defaults has no stored key, and a backup missing it wouldn't fully replace
  // a device where that list was customized.
  const data = liveData();
  const payload = {app:"jazz2", version:1, exportedAt:new Date().toISOString(), data};
  return saveBackupFile(payload);
}
// Every synced list as it is in memory (lists still on their defaults have no
// stored key, so localStorage alone isn't the full picture)
function liveData(){
  return {
    "skin-rules-content":skinRules, "skin-routine-content":skinRoutine, "routine-checks":routineChecks,
    "style-rules-content":styleRules,
    "sizes-content":sizes, "capsule-content":capsule, "wants-content":wantsList, "todo-content":todoList,
    "todo-archive-content":loadContent("todo-archive-content", []),
    "style-state":styleState, "wants-state":wantsState,
    "bills-content":bills, "bill-payments":billPayments, "budget-content":budget, "fitness-content":fitness

}
async function saveBackupFile(payload){
  const name = `jazz2-backup-${isoDate(new Date())}.json`;
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  // Installed iOS PWAs handle <a download> poorly; the share sheet offers "Save to Files"
  const file = new File([blob], name, {type:"application/json"});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"Jazz backup"}); return; }
    catch(e){ if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function restoreBackup(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.onchange = async () => {
    const f = input.files && input.files[0];
    if (!f) return;
    let payload;
    try{ payload = JSON.parse(await f.text()); }catch(e){ showToast("That file isn't a valid backup", true); return; }
    const data = payload && payload.app === "jazz2" && payload.data;
    if (!data || !Object.keys(data).some(k => SYNC_KEYS.includes(k))){ showToast("That file isn't a Jazz backup", true); return; }
    const when = payload.exportedAt ? new Date(payload.exportedAt).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : "an unknown date";
    if (!confirm(`Replace everything on this device with the backup from ${when}? If sync is on, your other device will get it too.`)) return;
    closeModal();
    // "Replace everything": lists the backup doesn't have (e.g. one made before
    // Budget existed) go back to their defaults instead of keeping this device's
    SYNC_KEYS.forEach(k => { if (!(k in data)) localStorage.removeItem(k); });
    // A restore is a deliberate edit: stamp it now so sync pushes it out
    applyRemote({updatedAt:Date.now(), data});
    scheduleSyncPush();
    showToast("Backup restored");
  };
  input.click();
}
function openSyncModal(){
  const connected = !!localStorage.getItem("sync-token");
  openModal("Sync & backup", [
    {type:"note", label:`Syncs everything (to-dos, routines, shopping, budget) through a private gist on

      <b>gist</b> scope at github.com &rsaquo; Settings &rsaquo; Developer settings &rsaquo; Tokens (classic),
      then paste the same token into the app on each device. Newest change wins when

    {key:"token", label:"GitHub token", type:"password"},

// ---------- INIT ----------
function loadAllContent(){
  skinRules = loadContent("skin-rules-content", DEFAULT_SKIN_RULES);
  // skin-routine-content wins; before the first routine edit it's derived from the
  // legacy per-day lists (or the defaults), deterministically, so nothing is written here
  skinRoutine = loadContent("skin-routine-content", null)
    || routineFromDays(loadContent("skin-days-content", DEFAULT_SKIN_DAYS));
  routineChecks = loadContent("routine-checks", {});
  styleRules = loadContent("style-rules-content", DEFAULT_STYLE_RULES);
  sizes = loadContent("sizes-content", DEFAULT_SIZES);
  capsule = loadContent("capsule-content", DEFAULT_CAPSULE);
  wantsList = loadContent("wants-content", DEFAULT_WANTS);
  todoList = loadContent("todo-content", DEFAULT_TODO);
  sanitizeCoreData(); // before anything walks these lists
  if (migrateTodoDays(todoList)) writeQuietly("todo-content", todoList);
  bills = loadContent("bills-content", []);
  billPayments = loadContent("bill-payments", []);
  budget = loadContent("budget-content", JSON.parse(JSON.stringify(DEFAULT_BUDGET)));

  pruneBudgetHistory();

  normalizeFitness();
  normalizeLoadedData(); // last: needs every list loaded
  if (applyRoutineAdditions(skinRoutine)) writeQuietly("skin-routine-content", skinRoutine);

}
// Steps added to an existing routine after it was set up. Each is applied once
// per routine (tracked in `added`, which syncs with it), so deleting a step
// later sticks. Ids are fixed so two devices adding the same step agree.
const ROUTINE_ADDITIONS = [
  // Every night (no `days`) for the box's 20-day course
  {key:"teeth-whitening", band:"pm", step:{id:"pm-teeth-whitening", label:"Teeth whitening",
    product:"Crest 3D Whitestrips Professional Effects",
    note:"Brush first; 30 min. 20-day course, then delete this step or set touch-up days"}},
  {key:"pore-strips", band:"pm", after:/^cleanse/i, step:{id:"pm-pore-strips", label:"Pore strips",
    product:"Bioré Witch Hazel Ultra Strength Blackhead Remover Pore Strips",
    note:"Wet your nose, press on, peel after 10–15 min. No more than every 3 days", days:[0]}},
];
function applyRoutineAdditions(r){
  r.added = Array.isArray(r.added) ? r.added : [];
  let changed = false;
  ROUTINE_ADDITIONS.forEach(({key, band, after, step}) => {
    if (r.added.includes(key)) return;
    const list = r[band] || (r[band] = []);
    if (!list.some(x => x.id === step.id)){
      const i = after ? list.findIndex(x => after.test(x.label)) : -1;
      list.splice(i + 1, 0, JSON.parse(JSON.stringify(step))); // no anchor: goes first
    }
    r.added.push(key);
    changed = true;
  });
  return changed;
}
// Stored data can arrive from sync or a backup file, so it's treated as untrusted:
// text is escaped wherever it's rendered, and ids — which are interpolated into
// inline onclick handlers — must be plain tokens or they're replaced. Older builds
// also stored a few strings as HTML ("&amp;"); those are decoded so all text is
// plain. Runs on every load (idempotent), so nothing is written here.
const SAFE_ID = /^[A-Za-z0-9_-]+$/;
function safeId(id, prefix){ return SAFE_ID.test(String(id)) ? id : genId(prefix); }
// Shape checks for everything outside Budget (which has normalizeBudgetData).
// Synced or restored data is untrusted: wrong types are coerced or dropped, so
// one malformed record can't stop the app from starting. Runs on every load.
function sanitizeCoreData(){
  const arr = v => Array.isArray(v) ? v : [];
  const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
  const str = (v, max) => String(v == null ? "" : v).slice(0, max);
  const isIso = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
  todoList = arr(todoList).filter(isObj);
  todoList.forEach(t => {
    t.text = str(t.text, 500);
    t.done = !!t.done; t.starred = !!t.starred;
    if ("due" in t && t.due !== null && !isIso(t.due)) t.due = null; // (an absent due is left for migrateTodoDays)
    if (t.completedAt != null && !isFinite(Number(t.completedAt))) t.completedAt = null;
    t.subitems = arr(t.subitems).filter(isObj).map(st => ({...st, text:str(st.text, 500), done:!!st.done}));
    if ("repeatDay" in t && !(Number.isInteger(t.repeatDay) && t.repeatDay >= 1 && t.repeatDay <= 31)) delete t.repeatDay;
  });
  if (!isObj(skinRoutine)) skinRoutine = routineFromDays(DEFAULT_SKIN_DAYS);
  ["am", "pm", "washPm"].forEach(b => {
    skinRoutine[b] = arr(skinRoutine[b]).filter(isObj).map(st => {
      const step = {...st, label:str(st.label, 120), product:str(st.product, 200)};
      if (st.note != null) step.note = str(st.note, 200); else delete step.note;
      const days = arr(st.days).filter(d => Number.isInteger(d) && d >= 0 && d <= 6);
      if (days.length && days.length < 7) step.days = [...new Set(days)]; else delete step.days;
      return step;
    });
  });
  if (!isObj(routineChecks)) routineChecks = {};
  Object.keys(routineChecks).forEach(k => {
    const c = routineChecks[k];
    if (!isIso(k) || !isObj(c)){ delete routineChecks[k]; return; }
    c.am = arr(c.am).map(String); c.pm = arr(c.pm).map(String);
  });
  skinRules = arr(skinRules).filter(r => typeof r === "string");
  styleRules = arr(styleRules).filter(r => typeof r === "string");
  sizes = arr(sizes).filter(x => Array.isArray(x) && x.length >= 2).map(([k, v]) => [str(k, 60), str(v, 120)]);
  capsule = arr(capsule).filter(isObj).map(i => ({...i, title:str(i.title, 200)}));
  wantsList = arr(wantsList).filter(isObj).map(w => { const x = {...w, name:str(w.name, 200),
    price:w.price == null || !isFinite(Number(w.price)) ? null : Math.max(0, Number(w.price))}; if (x.later !== true) delete x.later; return x; });
}
function normalizeLoadedData(){
  skinRules = skinRules.map(decodeEntities);

  sizes = sizes.map(([k, v]) => [decodeEntities(k), decodeEntities(v)]);
  capsule.forEach(i => { i.id = safeId(i.id, "cap"); i.title = decodeEntities(i.title); if (i.sub) i.sub = decodeEntities(i.sub); });
  wantsList.forEach(w => { w.id = safeId(w.id, "want"); w.name = decodeEntities(w.name); if (w.meta) w.meta = decodeEntities(w.meta); });
  todoList.forEach(t => { t.id = safeId(t.id, "todo"); (t.subitems || []).forEach(st => { st.id = safeId(st.id, "sub"); }); });
  todoList.forEach(t => { if ("repeat" in t && !REPEATS[t.repeat]) delete t.repeat; }); // unknown rules from sync/backup

    if ("every" in t){ const n = parseInt(t.every, 10); if (CUSTOM_REPEATS[t.repeat] && n >= 1) t.every = Math.min(99, n); else delete t.every; }
    if ("days" in t){ const n = parseInt(t.days, 10); if (t.due && n > 1) t.days = Math.min(60, n); else delete t.days; }

// ---------- import link ----------
// A link ending in #import=<base64url JSON> adds budget data (bills, paychecks
// and their plans, goals) after the user confirms. The data rides in the URL
// fragment, which never reaches a server, so personal numbers don't have to live
// in this public repo. Nothing is replaced: bills/goals already present by name,
// and paydays that already have plan lines, are skipped. Everything still goes
// through normalizeBudgetData on the next load like any other stored data.
function importFromLink(){
  const m = location.hash.match(/^#import=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  let data;
  try{
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
    data = JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ showToast("That import link is damaged", true); return; }
  const wait = localStorage.getItem("sync-token") ? 2500 : 0; // let the first sync pull land before adding on top of it
  if (data && data.app === "jazz3-fitness"){ setTimeout(() => applyFitnessImport(data), wait); return; }
  if (!data || data.app !== "jazz2-budget" || !/^\d{4}-\d{2}$/.test(data.month || "")){ showToast("That isn't an import link", true); return; }
  setTimeout(() => applyBudgetImport(data), wait);
}
// Fitness set-up from a link: weight start/goal (if not set yet), weigh-ins on
// dates without one, and workouts not already in the plan (by name)
function applyFitnessImport(data){
  const arr = v => Array.isArray(v) ? v : [];
  const has = name => fitness.plan.some(w => w.name.toLowerCase() === String(name).toLowerCase());
  const plan = arr(data.plan).filter(w => w && w.name && !has(w.name));
  const weights = arr(data.weights).filter(w => w && /^\d{4}-\d{2}-\d{2}$/.test(w.date || "") && !fitness.weights.some(x => x.date === w.date));
  const setGoal = (data.goal != null && fitness.goal == null) || (data.start != null && fitness.start == null);
  const parts = [plan.length && `${plan.length} workout${plan.length === 1 ? "" : "s"}`, weights.length && `${weights.length} weigh-in${weights.length === 1 ? "" : "s"}`, setGoal && "your weight goal"].filter(Boolean);
  if (!parts.length){ showToast("Everything in that link is already in Fitness"); return; }
  if (!confirm(`Add ${parts.join(", ")} to Fitness? Nothing already there is changed.`)) return;
  if (fitness.start == null && data.start != null) fitness.start = data.start;
  if (fitness.goal == null && data.goal != null) fitness.goal = data.goal;
  weights.forEach(w => fitness.weights.push({id:genId("wt"), date:w.date, lbs:w.lbs}));
  plan.forEach(w => fitness.plan.push({id:genId("wo"), name:w.name, days:w.days, every:w.every, anchor:w.anchor, time:w.time, kind:w.kind}));
  normalizeFitness(); // checks every field
  saveFitness();
  activateTab("fitness");
  showToast(`Added ${parts.join(", ")}`);
}
function applyBudgetImport(data){
  const arr = v => Array.isArray(v) ? v : [];
  const num = v => { const n = Number(v); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : 0; };
  const has = (list, name) => list.some(x => String(x.name).toLowerCase() === String(name).toLowerCase());
  const newBills = arr(data.bills).filter(b => b && b.name && !has(bills, b.name));
  const newGoals = arr(data.goals).filter(g => g && g.name && !has(budget.goals, g.name));
  const incomes = arr(data.income).filter(x => x && x.name && /^\d{4}-\d{2}-\d{2}$/.test(x.start || ""));
  const planCount = incomes.reduce((n, x) => n + arr(x.plans).length, 0);
  const parts = [newBills.length && `${newBills.length} bill${newBills.length === 1 ? "" : "s"}`,
    incomes.length && `${incomes.length} paycheck${incomes.length === 1 ? "" : "s"} with ${planCount} payday plan${planCount === 1 ? "" : "s"}`,
    newGoals.length && `${newGoals.length} goal${newGoals.length === 1 ? "" : "s"}`].filter(Boolean);
  if (!parts.length){ showToast("Everything in that link is already in your budget"); return; }
  if (!confirm(`Add ${parts.join(", ")} to your budget? Bills, goals and plan lines already there aren't changed.`)) return;
  const month = data.month, last = Number(monthEndIso(month).slice(8));
  arr(data.accounts).forEach(a => { a = String(a).trim().slice(0, 40); if (a && !budget.accounts.includes(a)) budget.accounts.push(a); });
  newBills.forEach(b => {
    const day = Math.min(31, Math.max(1, parseInt(b.day, 10) || 1));
    const due = `${month}-${String(Math.min(day, last)).padStart(2, "0")}`;
    const bill = {id:genId("bill"), name:String(b.name).slice(0, 120), amount:num(b.amount), due, day, repeat:BILL_REPEATS[b.repeat] ? b.repeat : "monthly",
      autopay:!!b.autopay, link:null, group:b.group === "joint" ? "joint" : "personal",
      account:budget.accounts.includes(b.account) ? b.account : null, ...(b.varies ? {varies:true} : {})};
    if (b.paid){ // already paid this month: log it and move on to next month's due
      billPayments.push({id:genId("pay"), billId:bill.id, name:bill.name, amount:bill.amount, due, date:due, group:bill.group, account:bill.account});
      bill.due = nextBillIso(due, bill.repeat, day);
    }
    bills.push(bill);
  });
  incomes.forEach(x => {
    const repeat = BILL_REPEATS[x.repeat] ? x.repeat : "biweekly";
    let src = budget.income.find(i => i.name.toLowerCase() === String(x.name).toLowerCase() && i.start === x.start && i.repeat === repeat);
    if (!src){ src = {id:genId("inc"), name:String(x.name).slice(0, 60), amount:num(x.amount), start:x.start, repeat}; budget.income.push(src); }
    if (x.varies) src.varies = true; // an existing paycheck can be switched to "varies"
    arr(x.plans).forEach(pl => {
      if (!pl || !/^\d{4}-\d{2}-\d{2}$/.test(pl.date || "")) return;
      const key = `${src.id}|${pl.date}`, ex = budget.plans[key];
      const amount = pl.amount != null && (src.varies || num(pl.amount) !== src.amount) ? {amount:num(pl.amount)} : {};
      const received = pl.received && src.varies ? {received:true} : {};
      if (ex && ex.lines.length){ Object.assign(ex, amount, received); return; } // keep its lines; just set the check
      budget.plans[key] = {...amount, ...received,
        lines:arr(pl.lines).filter(l => l && l.name).map(l => ({id:genId("line"), name:String(l.name).slice(0, 80), amount:num(l.amount)}))};
    });
  });
  newGoals.forEach(g => budget.goals.push({id:genId("goal"), name:String(g.name).slice(0, 60), target:num(g.target), saved:num(g.saved),
    date:/^\d{4}-\d{2}-\d{2}$/.test(g.date || "") ? g.date : null, created:addDaysIso(0), log:[]}));
  saveBudgetData();
  budgetMonthOffset = 0;
  activateTab("budget");
  showToast(`Added ${parts.join(", ")}`);
}

// Handles ?tab=&action= launch params from the home-screen icon shortcuts
// (manifest.json "shortcuts") so long-pressing the app icon can jump straight
// to a tab or straight into the new-to-do composer.
function applyLaunchParams(){
  const params = new URLSearchParams(location.search);
  const tab = params.get("tab");
  const action = params.get("action");
  if (!tab && !action) return;
  if (action === "addtodo") activateTab("todo");
  else if (tab && (TAB_ORDER.includes(tab) || tab === "style") && tab !== "home") activateTab(tab);
  if (action === "addtodo") openComposer("todo");
  history.replaceState(null, "", location.pathname);
}

// ---------- PWA: service worker registration (only works when hosted on a real http(s) origin) ----------
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).catch(err => console.log("SW registration skipped:", err));
  });
}
</script>
