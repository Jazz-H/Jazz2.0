<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jazz 2.0</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#18191b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jazz 2.0">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg:#18191b;
    --surface:#232427;
    --surface-2:#2b2c30;
    --line:#37383c;
    --text:#ededee;
    --text-dim:#95979d;
    --gold:#c8a24a;
    --navy:#3a4a6b;
    --olive:#7c8a63;
    --olive-dim:#565f47;
    --danger:#a4573f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none;}
  body{display:flex; flex-direction:column;}

  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim); font-weight:600; margin-bottom:2px;
  }
  header h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.01em; padding-right:44px;}

  main{flex:1; overflow-y:auto; padding:16px 16px 100px;}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10.5px; font-family:inherit; font-weight:600;
    letter-spacing:.02em; padding:6px 2px; border-radius:10px;
  }
  nav.tabbar button svg{width:21px; height:21px;}
  nav.tabbar button.active{color:var(--olive);}
  nav.tabbar button.active svg{stroke:var(--olive);}

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-bottom:12px;
  }
  .card h2{margin:0 0 10px; font-size:15px; font-weight:700;}
  .card h3{margin:0 0 8px; font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}

  .pinned{border-color:var(--olive-dim); background:linear-gradient(180deg, rgba(124,138,99,.10), var(--surface) 70%); padding:0; overflow:hidden;}
  .pinned .coll-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px; cursor:pointer;
  }
  .pinned .coll-head h3{margin:0;}
  .pinned .chev{transition:transform .2s; color:var(--text-dim); flex-shrink:0;}
  .pinned.open .chev{transform:rotate(180deg);}
  .pinned .coll-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .pinned.open .coll-body{max-height:3000px;}
  .pinned .coll-inner{padding:0 16px 16px;}

  .rule{font-size:13.5px; line-height:1.5; color:var(--text); margin:0 0 8px; padding-left:14px; position:relative;}
  .rule:before{content:"·"; position:absolute; left:0; color:var(--olive); font-weight:900;}
  .rule:last-child{margin-bottom:0;}

  .sizegrid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; font-size:13px;}
  .sizegrid div span{display:block; color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:1px;}

  /* Day accordion (skin/hair) */
  .day{border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--surface);}
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; cursor:pointer; background:var(--surface-2);
  }
  .day-head .name{font-weight:700; font-size:14.5px;}
  .day-head .chev{transition:transform .2s; color:var(--text-dim);}
  .day.open .chev{transform:rotate(180deg);}
  .day-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .day.open .day-body{max-height:1400px;}
  .band{padding:12px 16px;}
  .band.am{border-left:3px solid var(--gold);}
  .band.pm{border-left:3px solid var(--navy); border-top:1px solid var(--line);}
  .band .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:8px;}
  .band.am .label{color:var(--gold);}
  .band.pm .label{color:#7a8cbf;}
  .step{font-size:13px; line-height:1.45; margin-bottom:7px; display:flex; gap:8px;}
  .step:last-child{margin-bottom:0;}
  .step .n{color:var(--text-dim); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .step b{font-weight:600;}
  .step .note{color:var(--text-dim); font-size:12px; display:block;}

  /* checklist items */
  .item{display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .body{flex:1; order:1;}
  .box{
    width:21px; height:21px; border-radius:6px; border:1.5px solid var(--text-dim);
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s; order:2;
  }
  .item .title{font-size:13.5px; font-weight:600; line-height:1.35;}
  .item.checked .box{background:var(--olive); border-color:var(--olive);}
  .box svg{width:13px; height:13px; opacity:0; transition:opacity .15s;}
  .item.checked .box svg{opacity:1;}
  .item.checked .title{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .item .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .badge{display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:1px;}
  .badge.pending{background:rgba(200,162,74,.18); color:var(--gold);}

  /* fitness */
  .exday{margin-bottom:6px;}
  .exday summary{list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .exday summary::-webkit-details-marker{display:none;}
  .exday summary .chev{transition:transform .2s; color:var(--text-dim); flex-shrink:0;}
  .exday[open] summary .chev{transform:rotate(180deg);}
  .exday-title{font-size:14px; font-weight:700;}
  .exday-sub{font-size:11.5px; color:var(--text-dim); font-weight:500;}
  .ex-row{display:flex; align-items:center; gap:10px; padding:9px 2px; border-top:1px solid var(--line);}
  .ex-row .meta{flex:1; order:1;}
  .ex-row .box{order:2;}
  .ex-row .name{font-size:13px; font-weight:600;}
  .ex-row .setsreps{font-size:11.5px; color:var(--text-dim);}
  .reset-btn{
    width:100%; margin-top:2px; padding:11px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); font-size:12.5px; font-weight:700;
    letter-spacing:.03em; font-family:inherit;
  }
  .reset-btn:active{background:var(--line);}

  /* wants */
  .want-card{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line);}
  .want-card:last-child{border-bottom:none;}
  .want-card .body{flex:1;}
  .want-card .name{font-size:13.5px; font-weight:700; line-height:1.35;}
  .want-card .meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .want-card .link{font-size:12px; color:var(--olive); text-decoration:none; font-weight:600; display:inline-block; margin-top:4px;}
  .want-card .price{font-size:14px; font-weight:700; color:var(--gold); margin-top:5px;}
  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px 2px; margin-top:6px; border-top:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--text-dim);
  }
  .total-row span{font-size:14px; font-weight:700; color:var(--text);}
  .total-row.grand{border-top:none; padding-top:2px;}
  .total-row.grand span{color:var(--olive); font-size:16px;}
  .toggle{
    flex-shrink:0; padding:7px 12px; border-radius:20px; border:1.5px solid var(--olive-dim);
    background:none; color:var(--olive); font-size:11px; font-weight:700; font-family:inherit;
    letter-spacing:.03em; white-space:nowrap;
  }
  .toggle.done{background:var(--olive); color:#161710; border-color:var(--olive);}
  .section-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:700; margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}
  .cat-title{font-size:11.5px; font-weight:700; color:var(--olive); margin:12px 0 2px;}
  .cat-title:first-child{margin-top:0;}
  .insight{font-size:10.5px; font-weight:600; color:var(--text-dim); background:var(--surface-2);
    padding:2px 7px; border-radius:8px; white-space:nowrap;}
  .footnote{font-size:11px; color:var(--text-dim); margin:8px 0 0; font-style:italic;}
  .badge.today{background:rgba(124,138,99,.22); color:var(--olive); margin-left:8px;}
  .badge.wash{background:rgba(58,74,107,.28); color:#7a8cbf; margin-left:8px;}
  .day.today .day-head{border-left:3px solid var(--olive);}
  .progress-wrap{margin-bottom:12px;}
  .progress-label{display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
  .progress-label b{color:var(--text); font-weight:700;}
  .progress-bar{height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:var(--olive); border-radius:5px; transition:width .3s ease;}

  .skeleton{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
  .skel-line{height:12px; border-radius:6px; background:var(--surface-2); margin-bottom:10px;
    animation:pulse 1.2s ease-in-out infinite;}
  .skel-line:last-child{margin-bottom:0; width:60%;}
  @keyframes pulse{0%,100%{opacity:.5;} 50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .skel-line{animation:none; opacity:.7;} }

  :focus-visible{outline:2px solid var(--olive); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important; animation-duration:.001ms !important;}
  }

  .toast{
    position:fixed; left:50%; bottom:82px; transform:translateX(-50%) translateY(10px);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:20px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--danger); color:#e0a493;}

  .empty{font-size:12.5px; color:var(--text-dim); font-style:italic; padding:6px 2px;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  #pull-indicator{
    height:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
    gap:8px; color:var(--text-dim); font-size:12px; font-weight:600; letter-spacing:.02em;
  }
  #pull-indicator.animated{transition:height .2s ease;}
  #pull-indicator.ready{color:var(--olive);}
  .pull-spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--text-dim); border-top-color:transparent;
    flex-shrink:0; opacity:0; transition:opacity .15s;
  }
  #pull-indicator.ready .pull-spinner{border-color:var(--olive); border-top-color:transparent;}
  #pull-indicator.refreshing .pull-spinner{opacity:1; animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    #pull-indicator.refreshing .pull-spinner{animation:none;}
  }

  /* ---------- editing ---------- */
  .edit-toggle-btn{
    position:absolute; top:18px; right:20px; background:none; border:1px solid var(--line);
    color:var(--text-dim); width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .edit-toggle-btn.active{background:var(--olive); border-color:var(--olive); color:#161710;}

  .editable{cursor:pointer;}
  .editable:active{background:var(--surface-2); border-radius:6px;}
  .inline-pencil{display:inline-flex; vertical-align:middle; margin-left:6px; color:var(--text-dim); opacity:.7; flex-shrink:0;}
  .inline-pencil svg{display:block;}

  .row-edit-btn{
    flex-shrink:0; width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  }
  .item .row-edit-btn{order:3;}
  .ex-row .row-edit-btn{order:3;}

  .add-row{
    width:100%; margin-top:8px; padding:10px; border-radius:10px; border:1.5px dashed var(--olive-dim);
    background:none; color:var(--olive); font-size:12.5px; font-weight:700; font-family:inherit;
  }
  .add-row:active{background:rgba(124,138,99,.12);}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:30;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal-sheet{
    width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(16px); transition:transform .2s;
    max-height:80vh; overflow-y:auto;
  }
  .modal-backdrop.open .modal-sheet{transform:translateY(0);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .modal-head h3{margin:0; font-size:16px; font-weight:700;}
  .modal-x{background:none; border:none; color:var(--text-dim); font-size:22px; line-height:1; padding:4px 8px;}
  .modal-field{display:block; margin-bottom:12px;}
  .modal-field span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700; margin-bottom:5px;}
  .modal-field input, .modal-field textarea, .modal-field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:14px; font-family:inherit; padding:10px 12px; resize:vertical;
  }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus{outline:2px solid var(--olive); outline-offset:1px;}
  .modal-checkbox{display:flex; align-items:center; gap:8px;}
  .modal-checkbox span{margin:0; text-transform:none; font-size:13px; letter-spacing:0; color:var(--text);}
  .modal-checkbox input{width:auto;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-btn{flex:1; padding:12px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; font-family:inherit;}
  .modal-btn.primary{background:var(--olive); color:#161710;}
  .modal-btn.danger{background:none; border:1.5px solid var(--danger); color:#e0a493;}
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="eyebrow">Jazz 2.0</div>
  <h1 id="headline">Skin &amp; Hair</h1>
  <button class="edit-toggle-btn" id="edit-toggle" onclick="toggleEditMode()" aria-label="Toggle edit mode" title="Edit">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
</header>

<main>
  <div id="pull-indicator"><span class="pull-spinner"></span><span class="pull-label">Pull to refresh</span></div>
  <!-- SKIN / HAIR -->
  <section class="tabpanel active" id="panel-skin"></section>
  <!-- STYLE -->
  <section class="tabpanel" id="panel-style">
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div>
  </section>
  <!-- FITNESS -->
  <section class="tabpanel" id="panel-fitness">
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div>
  </section>
  <!-- WANTS -->
  <section class="tabpanel" id="panel-wants">
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div>
  </section>
</main>

<div class="toast" id="toast" aria-live="polite"></div>

<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal-sheet">
    <div class="modal-head">
      <h3 id="modal-heading">Edit</h3>
      <button class="modal-x" onclick="closeModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="modal-btn danger" id="modal-delete-btn" onclick="modalDelete()">Delete</button>
      <button class="modal-btn primary" onclick="modalSave()">Save</button>
    </div>
  </div>
</div>

<nav class="tabbar">
  <button data-tab="skin" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="#95979d" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s-7-4.6-9.3-9.2C1 8 2.7 4.6 6 4.1c2-.3 3.7.9 4.5 2.3.8-1.4 2.5-2.6 4.5-2.3 3.3.5 5 3.9 3.3 7.7C19 16.4 12 21 12 21z"/></svg>
    Skin/Hair
  </button>
  <button data-tab="style">
    <svg viewBox="0 0 24 24" fill="none" stroke="#95979d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l3 3 3-3h3l2 5-3 2v11H7V10L4 8z"/></svg>
    Style
  </button>
  <button data-tab="fitness">
    <svg viewBox="0 0 24 24" fill="none" stroke="#95979d" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6M2 10v4M20 9v6M22 10v4M7 12h10M6 8v8M18 8v8"/></svg>
    Fitness
  </button>
  <button data-tab="wants">
    <svg viewBox="0 0 24 24" fill="none" stroke="#95979d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
    Wants
  </button>
</nav>

<script>
const HEADLINES = {skin:"Skin & Hair", style:"Style Capsule", fitness:"Fitness Split", wants:"Wants List"};
const PENCIL_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

// ---------- storage helpers (one JSON blob per key, plain localStorage) ----------
async function loadState(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
async function saveState(key, obj){
  try{
    localStorage.setItem(key, JSON.stringify(obj));
    showToast("Saved");
  }catch(e){
    console.error("save failed", e);
    showToast("Save failed — storage may be full or disabled", true);
  }
}
function loadContent(key, defaults){
  try{
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(defaults));
}
function saveContent(key, data){
  try{
    localStorage.setItem(key, JSON.stringify(data));
    showToast("Saved");
  }catch(e){
    console.error("save failed", e);
    showToast("Save failed — storage may be full or disabled", true);
  }
}
function genId(prefix){
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
}
let toastTimer;
function showToast(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), isError ? 2600 : 1400);
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function escapeAttr(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

let styleState = {};
let fitnessState = {};
let wantsState = {};
let editMode = localStorage.getItem("edit-mode") === "1";
// Collapsible open/closed state is tracked here (not just DOM classes) because
// edits trigger full re-renders, which would otherwise silently re-collapse
// whatever the user had open.
let openPinned = new Set(["cap-needed-card"]);
let openDays = null; // lazily seeded with today's index on first renderSkin()

// ---------- DEFAULT DATA (seeds localStorage on first run; everything below is editable in-app after) ----------

const DEFAULT_SKIN_RULES = [

// ---------- MODAL ENGINE (reused for every add/edit form) ----------
let modalFields = [];
let modalOnSave = null;
let modalOnDelete = null;

function openModal(title, fields, values, onSave, onDelete){
  document.getElementById("modal-heading").textContent = title;
  modalFields = fields;
  modalOnSave = onSave;
  modalOnDelete = onDelete || null;
  const body = document.getElementById("modal-body");
  body.innerHTML = fields.map(f => {
    const val = (values && values[f.key] != null) ? values[f.key] : (f.type === "checkbox" ? false : "");
    if (f.type === "select"){
      const opts = f.options.map(o => `<option value="${escapeAttr(o)}" ${o===val?"selected":""}>${o}</option>`).join("");
      return `<label class="modal-field"><span>${f.label}</span><select id="modal-${f.key}">${opts}</select></label>`;
    }
    if (f.type === "textarea"){
      return `<label class="modal-field"><span>${f.label}</span><textarea id="modal-${f.key}" rows="2">${escapeHtml(val)}</textarea></label>`;
    }
    if (f.type === "checkbox"){
      return `<label class="modal-field modal-checkbox"><input id="modal-${f.key}" type="checkbox" ${val?"checked":""}><span>${f.label}</span></label>`;
    }
    return `<label class="modal-field"><span>${f.label}</span><input id="modal-${f.key}" type="${f.type||'text'}" value="${escapeAttr(val)}"${f.step?` step="${f.step}"`:""}></label>`;
  }).join("");
  document.getElementById("modal-delete-btn").style.display = modalOnDelete ? "block" : "none";
  document.getElementById("modal-backdrop").classList.add("open");
}
function closeModal(){
  document.getElementById("modal-backdrop").classList.remove("open");
}
function modalSave(){
  const values = {};
  modalFields.forEach(f => {
    const el = document.getElementById("modal-"+f.key);
    let v = f.type === "checkbox" ? el.checked : el.value;
    if (f.type === "number") v = v === "" ? null : parseFloat(v);
    if (typeof v === "string") v = v.trim();
    values[f.key] = v;
  });
  if (modalOnSave) modalOnSave(values);
  closeModal();
}
function modalDelete(){
  if (!modalOnDelete) return;
  if (confirm("Delete this? This can't be undone.")){
    modalOnDelete();
    closeModal();
  }
}

  editMode = !editMode;

}

  if (openDays === null){
    openDays = new Set();

    if (todayIdx >= 0) openDays.add(todayIdx);
  }
  skinDays.forEach((d,i) => {

    const isOpen = openDays.has(i);
    const isWashSat = d.day === "Saturday" && !!d.pmWash && washWeek;
    const pmBand = (d.day === "Saturday" && d.pmWash) ? (washWeek ? "pmWash" : "pm") : "pm";
    const pmSteps = d[pmBand];
    html += `<div class="day ${isOpen?'open':''} ${isToday?'today':''}" data-idx="${i}">
      <div class="day-head" onclick="toggleDay(${i})">
        <span class="name">${d.day}${isToday?'<span class="badge today">Today</span>':''}${isWashSat?'<span class="badge wash">Wash day</span>':''}</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>

      <div class="day-body">
        <div class="band am"><div class="label">AM</div>

        </div>
        <div class="band pm"><div class="label">PM${pmBand==='pmWash'?' · wash day':''}</div>
          ${pmSteps.map((s,n)=>stepHtml(s,n,i,pmBand)).join("")}
          ${editMode?`<button class="add-row" onclick="addStep(${i},'${pmBand}')">+ Add PM step</button>`:""}
        </div>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}
// Wash day falls on Saturday every 2 weeks; last wash was Sat Jul 18, 2026 (the week of the 16th).
const WASH_DAY_ANCHOR = new Date(2026, 6, 18);
function isWashWeek(){
  const today = new Date();
  const thisSaturday = new Date(today.getFullYear(), today.getMonth(), today.getDate() + (6 - today.getDay()));
  const diffWeeks = Math.round((thisSaturday - WASH_DAY_ANCHOR) / (7 * 86400000));
  return ((diffWeeks % 2) + 2) % 2 === 0;
}
function stepHtml(s,n,dayIdx,band){
  const body = `<b>${s[0]}</b> — ${s[1]}${s[2]?`<span class="note">${s[2]}</span>`:""}`;
  if (editMode){
    return `<div class="step editable" onclick="editStep(${dayIdx},'${band}',${n})"><span class="n">${n+1}.</span><div>${body}<span class="inline-pencil">${PENCIL_ICON}</span></div></div>`;
  }
  return `<div class="step"><span class="n">${n+1}.</span><div>${body}</div></div>`;
}
function toggleDay(i){
  if (openDays.has(i)) openDays.delete(i); else openDays.add(i);
  document.querySelector(`.day[data-idx="${i}"]`).classList.toggle("open");
}
function toggleRules(id){
  if (openPinned.has(id)) openPinned.delete(id); else openPinned.add(id);
  document.getElementById(id).classList.toggle("open");
}
function editSkinRule(i){
  openModal("Edit rule", [{key:"text",label:"Rule",type:"textarea"}], {text:skinRules[i]},
    (v) => { if(!v.text) return; skinRules[i]=v.text; saveContent("skin-rules-content", skinRules); renderSkin(); },
    () => { skinRules.splice(i,1); saveContent("skin-rules-content", skinRules); renderSkin(); }
  );
}
function addSkinRule(){
  openModal("Add rule", [{key:"text",label:"Rule",type:"textarea"}], {},
    (v) => { if(!v.text) return; skinRules.push(v.text); saveContent("skin-rules-content", skinRules); renderSkin(); }
  );
}
function editStep(dayIdx, band, stepIdx){
  const arr = skinDays[dayIdx][band];
  const s = arr[stepIdx];
  openModal("Edit step", [
    {key:"label",label:"Step name",type:"text"},
    {key:"desc",label:"Product / description",type:"text"},
    {key:"note",label:"Note (optional)",type:"text"}
  ], {label:s[0], desc:s[1], note:s[2]||""},
    (v) => {
      if(!v.label || !v.desc) return;
      arr[stepIdx] = v.note ? [v.label,v.desc,v.note] : [v.label,v.desc];
      saveContent("skin-days-content", skinDays); renderSkin();
    },
    () => { arr.splice(stepIdx,1); saveContent("skin-days-content", skinDays); renderSkin(); }
  );
}
function addStep(dayIdx, band){
  const arr = skinDays[dayIdx][band];
  openModal("Add step", [
    {key:"label",label:"Step name",type:"text"},
    {key:"desc",label:"Product / description",type:"text"},
    {key:"note",label:"Note (optional)",type:"text"}
  ], {},
    (v) => {
      if(!v.label || !v.desc) return;
      const step = v.note ? [v.label,v.desc,v.note] : [v.label,v.desc];
      const last = arr[arr.length-1];
      if (last && /last step/i.test(last[0])) arr.splice(arr.length-1, 0, step);
      else arr.push(step);
      saveContent("skin-days-content", skinDays); renderSkin();
    }
  );
}

      <div style="display:flex;align-items:center;gap:8px;">
        <span class="insight" id="cap-owned-insight"></span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <div class="coll-body"><div class="coll-inner" id="cap-owned"></div></div>
  </div>`;
  el.innerHTML = html;
  renderCapsuleLists();
}
function currentCapState(item){
  if (styleState[item.id] !== undefined) return styleState[item.id];
  return item.state === "owned" || item.state === "pending" ? "owned" : "needed";
}
function renderCapsuleLists(){
  const ownedEl = document.getElementById("cap-owned");
  const neededEl = document.getElementById("cap-needed");
  const CAT_ORDER = CAP_CATS;
  const ownedByCat = {};
  const neededByCat = {};

  capsule.forEach(item => {
    const checked = currentCapState(item) === "owned";
    const pendingBadge = item.state === "pending" ? `<span class="badge pending">fit pending</span>` : "";
    const editBtn = editMode ? `<button class="row-edit-btn" onclick="event.stopPropagation(); editCapsuleItem('${item.id}')">${PENCIL_ICON}</button>` : "";
    const row = `<div class="item ${checked?'checked':''}" onclick="toggleCapsule('${item.id}')">
        <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#161710" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
        <div class="body"><div class="title">${item.title}${pendingBadge}</div>${item.sub?`<div class="sub">${item.sub}</div>`:""}</div>
        ${editBtn}
      </div>`;
    const cat = item.cat || "Other";
    const bucket = checked ? ownedByCat : neededByCat;
    if (!bucket[cat]) bucket[cat] = "";
    bucket[cat] += row;
  });

  function buildGrouped(byCat){
    let out = "";
    CAT_ORDER.forEach(cat => { if (byCat[cat]) out += `<div class="cat-title">${cat}</div>${byCat[cat]}`; });
    Object.keys(byCat).forEach(cat => { if (!CAT_ORDER.includes(cat)) out += `<div class="cat-title">${cat}</div>${byCat[cat]}`; });
    return out;
  }

  ownedEl.innerHTML = (buildGrouped(ownedByCat) || `<div class="empty">Nothing here yet.</div>`) + (editMode?`<button class="add-row" onclick="addCapsuleItem('owned')">+ Add item</button>`:"");
  neededEl.innerHTML = (buildGrouped(neededByCat) || `<div class="empty">All acquired.</div>`) + (editMode?`<button class="add-row" onclick="addCapsuleItem('needed')">+ Add item</button>`:"");

  const ownedCount = capsule.filter(i => currentCapState(i) === "owned").length;
  const neededCount = capsule.length - ownedCount;
  document.getElementById("cap-owned-insight").textContent = `${ownedCount} items`;
  document.getElementById("cap-needed-insight").textContent = `${neededCount} items`;
  const pct = capsule.length ? Math.round((ownedCount / capsule.length) * 100) : 0;
  document.getElementById("cap-progress-label").textContent = `${ownedCount}/${capsule.length} · ${pct}%`;
  document.getElementById("cap-progress-fill").style.width = `${pct}%`;
}
async function toggleCapsule(id){
  const cur = currentCapState(capsule.find(i=>i.id===id));
  styleState[id] = cur === "owned" ? "needed" : "owned";
  renderCapsuleLists();
  await saveState("style-state", styleState);
}
function editStyleRule(i){
  openModal("Edit rule", [{key:"text",label:"Rule",type:"textarea"}], {text:styleRules[i]},
    (v) => { if(!v.text) return; styleRules[i]=v.text; saveContent("style-rules-content", styleRules); renderStyle(); },
    () => { styleRules.splice(i,1); saveContent("style-rules-content", styleRules); renderStyle(); }
  );
}
function addStyleRule(){
  openModal("Add rule", [{key:"text",label:"Rule",type:"textarea"}], {},
    (v) => { if(!v.text) return; styleRules.push(v.text); saveContent("style-rules-content", styleRules); renderStyle(); }
  );
}
function editSize(i){
  const [k,v] = sizes[i];
  openModal("Edit size", [{key:"k",label:"Category",type:"text"},{key:"v",label:"Size",type:"text"}], {k,v},
    (vals) => { if(!vals.k||!vals.v) return; sizes[i] = [vals.k, vals.v]; saveContent("sizes-content", sizes); renderStyle(); },
    () => { sizes.splice(i,1); saveContent("sizes-content", sizes); renderStyle(); }
  );
}
function addSize(){
  openModal("Add size", [{key:"k",label:"Category",type:"text"},{key:"v",label:"Size",type:"text"}], {},
    (vals) => { if(!vals.k||!vals.v) return; sizes.push([vals.k, vals.v]); saveContent("sizes-content", sizes); renderStyle(); }
  );
}
function editCapsuleItem(id){
  const item = capsule.find(i=>i.id===id);
  openModal("Edit item", [
    {key:"title",label:"Title",type:"text"},
    {key:"sub",label:"Notes (optional)",type:"text"},
    {key:"cat",label:"Category",type:"select",options:CAP_CATS},
    {key:"pending",label:"Fit pending",type:"checkbox"}
  ], {title:item.title, sub:item.sub||"", cat:item.cat||CAP_CATS[0], pending:item.state==="pending"},
    (v) => {
      if(!v.title) return;
      item.title=v.title; item.sub=v.sub||undefined; item.cat=v.cat;
      if (v.pending) item.state = "pending";
      else if (item.state === "pending") item.state = currentCapState(item);
      saveContent("capsule-content", capsule); renderStyle();
    },
    () => {
      const idx = capsule.findIndex(i=>i.id===id);
      capsule.splice(idx,1);
      delete styleState[id];
      saveContent("capsule-content", capsule); saveState("style-state", styleState); renderStyle();
    }
  );
}
function addCapsuleItem(bucket){
  openModal("Add item", [
    {key:"title",label:"Title",type:"text"},
    {key:"sub",label:"Notes (optional)",type:"text"},
    {key:"cat",label:"Category",type:"select",options:CAP_CATS},
    {key:"pending",label:"Fit pending",type:"checkbox"}
  ], {cat:CAP_CATS[0]},
    (v) => {
      if(!v.title) return;
      capsule.push({id:genId("cap"), title:v.title, sub:v.sub||undefined, cat:v.cat, state: v.pending ? "pending" : bucket});
      saveContent("capsule-content", capsule); renderStyle();
    }
  );
}

// ---------- RENDER: FITNESS ----------
function renderFitness(){
  const el = document.getElementById("panel-fitness");
  let html = "";
  fitnessDays.forEach(day => {
    const doneCount = day.exercises.filter((ex,i) => !!fitnessState[`${day.id}:${i}`]).length;
    const dayEditBtn = editMode ? `<button class="row-edit-btn" onclick="event.preventDefault(); event.stopPropagation(); editFitnessDay('${day.id}')">${PENCIL_ICON}</button>` : "";
    html += `<details class="card exday" open><summary>
        <div><div class="exday-title">${day.title}</div><div class="exday-sub">${day.sub}</div></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="insight">${doneCount}/${day.exercises.length} done</span>
          ${dayEditBtn}
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </summary>`;
    day.exercises.forEach((ex, i) => {
      const key = `${day.id}:${i}`;
      const done = !!fitnessState[key];
      const exEditBtn = editMode ? `<button class="row-edit-btn" onclick="event.stopPropagation(); editExercise('${day.id}',${i})">${PENCIL_ICON}</button>` : "";
      html += `<div class="ex-row" onclick="toggleEx('${key}')">
          <div class="box ${done?'checkedbox':''}" style="${done?'background:var(--olive);border-color:var(--olive)':''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#161710" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:${done?1:0}"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="meta"><div class="name" style="${done?'color:var(--text-dim);text-decoration:line-through':''}">${ex[0]}</div><div class="setsreps">${ex[1]}</div></div>
          ${exEditBtn}
        </div>`;
    });
    if (editMode) html += `<button class="add-row" onclick="addExercise('${day.id}')">+ Add exercise</button>`;
    html += `</details>`;
  });
  if (editMode) html += `<button class="add-row" onclick="addFitnessDay()">+ Add workout day</button>`;
  html += `<button class="reset-btn" onclick="resetFitness()">Reset week</button>`;
  el.innerHTML = html;
}
async function toggleEx(key){
  fitnessState[key] = !fitnessState[key];
  renderFitness();
  await saveState("fitness-state", fitnessState);
}
async function resetFitness(){
  if (!confirm("Reset all checked exercises for the week? This can't be undone.")) return;
  fitnessState = {};
  renderFitness();
  await saveState("fitness-state", fitnessState);
}
function editFitnessDay(id){
  const day = fitnessDays.find(d=>d.id===id);
  openModal("Edit workout day", [
    {key:"title",label:"Title",type:"text"},
    {key:"sub",label:"Subtitle",type:"text"}
  ], {title:day.title, sub:day.sub},
    (v) => { if(!v.title) return; day.title=v.title; day.sub=v.sub; saveContent("fitness-days-content", fitnessDays); renderFitness(); },
    () => {
      const idx = fitnessDays.findIndex(d=>d.id===id);
      fitnessDays.splice(idx,1);
      Object.keys(fitnessState).forEach(k => { if (k.startsWith(id+":")) delete fitnessState[k]; });
      saveContent("fitness-days-content", fitnessDays); saveState("fitness-state", fitnessState); renderFitness();
    }
  );
}
function addFitnessDay(){
  openModal("Add workout day", [
    {key:"title",label:"Title",type:"text"},
    {key:"sub",label:"Subtitle",type:"text"}
  ], {},
    (v) => {
      if(!v.title) return;
      fitnessDays.push({id:genId("day"), title:v.title, sub:v.sub||"", exercises:[]});
      saveContent("fitness-days-content", fitnessDays); renderFitness();
    }
  );
}
function editExercise(dayId, idx){
  const day = fitnessDays.find(d=>d.id===dayId);
  const ex = day.exercises[idx];
  openModal("Edit exercise", [
    {key:"name",label:"Exercise",type:"text"},
    {key:"setsreps",label:"Sets × reps",type:"text"}
  ], {name:ex[0], setsreps:ex[1]},
    (v) => { if(!v.name) return; day.exercises[idx]=[v.name,v.setsreps]; saveContent("fitness-days-content", fitnessDays); renderFitness(); },
    () => {
      const oldCount = day.exercises.length;
      day.exercises.splice(idx,1);
      const newState = {};
      for (let i=0, j=0; i<oldCount; i++){
        if (i===idx) continue;
        if (fitnessState[`${dayId}:${i}`]) newState[`${dayId}:${j}`] = true;
        j++;
      }
      Object.keys(fitnessState).forEach(k => { if (k.startsWith(dayId+":")) delete fitnessState[k]; });
      Object.assign(fitnessState, newState);
      saveContent("fitness-days-content", fitnessDays); saveState("fitness-state", fitnessState); renderFitness();
    }
  );
}
function addExercise(dayId){
  const day = fitnessDays.find(d=>d.id===dayId);
  openModal("Add exercise", [
    {key:"name",label:"Exercise",type:"text"},
    {key:"setsreps",label:"Sets × reps",type:"text"}
  ], {},
    (v) => { if(!v.name) return; day.exercises.push([v.name, v.setsreps||""]); saveContent("fitness-days-content", fitnessDays); renderFitness(); }
  );
}

// ---------- RENDER: WANTS ----------
function renderWants(){
  const el = document.getElementById("panel-wants");
  let pending = "", done = "";
  let pendingTotal = 0, doneTotal = 0;
  const byPriceAsc = (a,b) => (a.price ?? Infinity) - (b.price ?? Infinity);
  const pendingItems = wantsList.filter(w => !wantsState[w.id]).sort(byPriceAsc);
  const doneItems = wantsList.filter(w => !!wantsState[w.id]).sort(byPriceAsc);
  const wantRow = (w, isDone) => {
    const priceStr = w.price != null ? `${w.estimated?'~':''}$${w.price.toFixed(2)}${w.estimated?' (est.)':''}` : "—";
    const linkHtml = w.link ? `<a class="link" href="${w.link}" target="_blank" rel="noopener">View product →</a>` : "";
    const editBtn = editMode ? `<button class="row-edit-btn" onclick="event.stopPropagation(); editWant('${w.id}')">${PENCIL_ICON}</button>` : "";
    return `<div class="want-card">
        <div class="body">
          <div class="name">${w.name}</div>
          ${w.meta?`<div class="meta">${w.meta}</div>`:""}
          <div class="price">${priceStr}</div>
          ${linkHtml}
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
          <button class="toggle ${isDone?'done':''}" onclick="toggleWant('${w.id}')">${isDone?'Purchased':'Mark bought'}</button>
          ${editBtn}
        </div>
      </div>`;
  };
  pendingItems.forEach(w => { pending += wantRow(w, false); pendingTotal += (w.price||0); });
  doneItems.forEach(w => { done += wantRow(w, true); doneTotal += (w.price||0); });
  let html = `<div class="card"><div class="section-title">Pending</div>${pending||'<div class="empty">All caught up.</div>'}
      <div class="total-row">Pending total <span>$${pendingTotal.toFixed(2)}</span></div>
      ${editMode?`<button class="add-row" onclick="addWant()">+ Add want</button>`:""}
      </div>`;
  html += `<div class="card"><div class="section-title">Purchased</div>${done||'<div class="empty">Nothing marked yet.</div>'}
      <div class="total-row">Spent so far <span>$${doneTotal.toFixed(2)}</span></div></div>`;
  html += `<div class="card"><div class="total-row grand">List total <span>$${(pendingTotal+doneTotal).toFixed(2)}</span></div></div>`;
  el.innerHTML = html;
}
async function toggleWant(id){
  wantsState[id] = !wantsState[id];
  renderWants();
  await saveState("wants-state", wantsState);
}
function editWant(id){
  const w = wantsList.find(x=>x.id===id);
  openModal("Edit want", [
    {key:"name",label:"Name",type:"text"},
    {key:"meta",label:"Notes (optional)",type:"text"},
    {key:"price",label:"Price",type:"number",step:"0.01"},
    {key:"link",label:"Link (optional)",type:"url"},
    {key:"estimated",label:"Estimated price",type:"checkbox"}
  ], {name:w.name, meta:w.meta||"", price:w.price, link:w.link||"", estimated:!!w.estimated},
    (v) => {
      if(!v.name) return;
      w.name=v.name; w.meta=v.meta||""; w.price=v.price; w.link=v.link||null; w.estimated=v.estimated;
      saveContent("wants-content", wantsList); renderWants();
    },
    () => {
      const idx = wantsList.findIndex(x=>x.id===id);
      wantsList.splice(idx,1);
      delete wantsState[id];
      saveContent("wants-content", wantsList); saveState("wants-state", wantsState); renderWants();
    }
  );
}
function addWant(){
  openModal("Add want", [
    {key:"name",label:"Name",type:"text"},
    {key:"meta",label:"Notes (optional)",type:"text"},
    {key:"price",label:"Price",type:"number",step:"0.01"},
    {key:"link",label:"Link (optional)",type:"url"},
    {key:"estimated",label:"Estimated price",type:"checkbox"}
  ], {},
    (v) => {
      if(!v.name) return;
      wantsList.push({id:genId("want"), name:v.name, meta:v.meta||"", price:v.price, link:v.link||null, estimated:v.estimated});
      saveContent("wants-content", wantsList); renderWants();
    }
  );
}

// ---------- TAB SWITCHING ----------
const TAB_ORDER = ["skin","style","fitness","wants"];
let currentTab = "skin";

function activateTab(tab){
  currentTab = tab;
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".tabpanel").forEach(p => p.classList.toggle("active", p.id === "panel-"+tab));
  document.getElementById("headline").textContent = HEADLINES[tab];
  document.querySelector("main").scrollTop = 0;
}

document.querySelectorAll("nav.tabbar button").forEach(btn => {
  btn.addEventListener("click", () => activateTab(btn.dataset.tab));
});

// Swipe left/right between tabs (ignored if the gesture looks like a vertical scroll)
(function(){
  const mainEl = document.querySelector("main");
  let startX = 0, startY = 0, tracking = false;
  mainEl.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  mainEl.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    const idx = TAB_ORDER.indexOf(currentTab);
    if (dx < 0 && idx < TAB_ORDER.length - 1) activateTab(TAB_ORDER[idx + 1]);
    if (dx > 0 && idx > 0) activateTab(TAB_ORDER[idx - 1]);
  }, {passive:true});
})();

// Pull-to-refresh: dragging down from the top of main triggers a hard refresh
// (clears the service worker cache + unregisters it, then reloads) rather than
// a normal reload, so stale cached assets can't linger. User content in
// localStorage is untouched by this -- only the cached app shell is cleared.
(function(){
  const mainEl = document.querySelector("main");
  const indicator = document.getElementById("pull-indicator");
  const label = indicator.querySelector(".pull-label");
  const THRESHOLD = 70;
  const MAX_PULL = 110;
  let startY = 0, pulling = false, dragging = false;

  mainEl.addEventListener("touchstart", e => {
    pulling = mainEl.scrollTop <= 0;
    dragging = false;
    startY = e.touches[0].clientY;
  }, {passive:true});

  mainEl.addEventListener("touchmove", e => {
    if (!pulling) return;
    if (mainEl.scrollTop > 0){ pulling = false; return; }
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    dragging = true;
    e.preventDefault();
    indicator.classList.remove("animated");
    const pull = Math.min(dy * 0.5, MAX_PULL);
    indicator.style.height = pull + "px";
    const ready = pull >= THRESHOLD;
    indicator.classList.toggle("ready", ready);
    label.textContent = ready ? "Release to refresh" : "Pull to refresh";
  }, {passive:false});

  mainEl.addEventListener("touchend", () => {
    if (!dragging){ pulling = false; return; }
    dragging = false;
    indicator.classList.add("animated");
    if (indicator.classList.contains("ready")){
      indicator.classList.add("refreshing");
      label.textContent = "Refreshing…";
      indicator.style.height = THRESHOLD + "px";
      hardRefresh();
    } else {
      indicator.style.height = "0px";
    }
    pulling = false;
  }, {passive:true});
})();

async function hardRefresh(){
  try{
    if ("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  }catch(e){ console.error("hard refresh cleanup failed", e); }
  location.reload();
}

// ---------- INIT ----------
(async function init(){
  skinRules = loadContent("skin-rules-content", DEFAULT_SKIN_RULES);
  skinDays = loadContent("skin-days-content", DEFAULT_SKIN_DAYS);
  styleRules = loadContent("style-rules-content", DEFAULT_STYLE_RULES);
  sizes = loadContent("sizes-content", DEFAULT_SIZES);
  capsule = loadContent("capsule-content", DEFAULT_CAPSULE);
  fitnessDays = loadContent("fitness-days-content", DEFAULT_FITNESS);
  wantsList = loadContent("wants-content", DEFAULT_WANTS);

  document.getElementById("edit-toggle").classList.toggle("active", editMode);

  renderSkin();
  const [s, f, w] = await Promise.all([
    loadState("style-state"),
    loadState("fitness-state"),
    loadState("wants-state")
  ]);
  styleState = s; fitnessState = f; wantsState = w;
  renderStyle();
  renderFitness();
  renderWants();
})();

// ---------- PWA: service worker registration (only works when hosted on a real http(s) origin) ----------
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).catch(err => console.log("SW registration skipped:", err));
  });
}
