<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz 2.0</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jazz 2.0">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    /* "Graphite" theme -- neutral charcoal ground, soft-white primary accent,
       pastel blue (AM) and pink (PM). Token names predate the palette
       (--gold = AM, --navy = PM, --olive = primary accent); every color in the
       app derives from these, so a theme swap only touches this block. */
    --bg:#0c0c0d;
    --surface:#161618;
    --surface-2:#1d1d20;
    --surface-3:#232327;
    --line:#2c2c31;
    --text:#f2f2f3;
    --text-dim:#8e8e96;
    --gold:#93c5fd;
    --navy:#f9a8d4;
    --olive:#f2f2f3;
    --olive-dim:#4b4d52;
    --danger:#f87171;
    --danger-text:#fecaca;
    --on-accent:#111113;   /* text/glyphs drawn on top of --olive fills */
    --link:#93c5fd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button{cursor:pointer;}
  .box, .subitem-box{cursor:pointer;}
  html{color-scheme:dark;} /* dark native scrollbars, select dropdowns, etc. */
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none;}
  body{display:flex; flex-direction:column;}

  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim); font-weight:600;
  }
  .header-meta{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:2px; flex-shrink:0;}
  /* Desktop stand-in for pull-to-refresh (a touch-only gesture): same
     hardRefresh() escape hatch, hidden below the desktop breakpoint. */
  .hard-refresh-btn{
    display:none; width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:none; color:var(--text-dim); align-items:center; justify-content:center; flex-shrink:0;
  }
  .hard-refresh-btn.spinning svg{animation:spin .8s linear infinite;}
  /* Gist sync status button — shown on every size (phones need to connect too).
     data-state: off (dim) / busy (pulsing) / ok (lime) / error (red). */
  .sync-btn{
    display:flex; width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:none; color:var(--text-dim); align-items:center; justify-content:center; flex-shrink:0;
  }
  .sync-btn[data-state="ok"]{color:var(--olive); border-color:var(--olive-dim);}
  .sync-btn[data-state="error"]{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, transparent);}
  .sync-btn[data-state="busy"] svg{animation:pulse 1.1s ease-in-out infinite;}
  .modal-note{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:0 0 12px;}
  .modal-note a{color:var(--olive);}
  header h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.01em;}
  .header-row{display:flex; align-items:center; gap:12px;}

  main{flex:1; overflow-y:auto; padding:16px 16px 100px;}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10.5px; font-family:inherit; font-weight:600;
    letter-spacing:.02em; padding:6px 2px; border-radius:10px;
  }
  nav.tabbar button svg{width:21px; height:21px;}
  nav.tabbar button.active{color:var(--olive);}
  nav.tabbar button.active svg{stroke:var(--olive);}

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-bottom:12px;
  }
  .card h2{margin:0 0 10px; font-size:15px; font-weight:700;}
  .card h3{margin:0 0 8px; font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}

  .pinned{border-color:var(--line); background:var(--surface); padding:0; overflow:hidden;}
  .pinned .coll-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px; cursor:pointer;
  }
  .pinned .coll-head h3{margin:0;}
  .pinned .chev{transition:transform .2s; color:var(--text-dim); flex-shrink:0;}
  .pinned.open .chev{transform:rotate(180deg);}
  .pinned .coll-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .pinned.open .coll-body{max-height:3000px;}
  .pinned .coll-inner{padding:0 16px 16px;}

  .rule{font-size:13.5px; line-height:1.5; color:var(--text); margin:0 0 8px; padding-left:14px; position:relative;}
  .rule:before{content:"·"; position:absolute; left:0; color:var(--olive); font-weight:900;}
  .rule:last-child{margin-bottom:0;}

  .sizegrid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; font-size:13px;}
  .sizegrid div span{display:block; color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:1px;}

  /* Day accordion (skin/hair) */
  .day{border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--surface);}
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; cursor:pointer; background:var(--surface-2);
  }
  .day-head .name{font-weight:700; font-size:14.5px;}
  .day-head .chev{transition:transform .2s; color:var(--text-dim);}
  .day.open .chev{transform:rotate(180deg);}
  .day-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .day.open .day-body{max-height:1400px;}
  .band{padding:12px 16px;}
  .band.am{border-left:3px solid var(--gold);}
  .band.pm{border-left:3px solid var(--navy); border-top:1px solid var(--line);}
  .band .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:8px;}
  .band.am .label{color:var(--gold);}
  .band.pm .label{color:var(--navy);}
  .step{font-size:13px; line-height:1.45; margin-bottom:7px; display:flex; gap:8px;}
  .step:last-child{margin-bottom:0;}
  .step .n{color:var(--text-dim); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .step b{font-weight:600;}
  .step .note{color:var(--text-dim); font-size:12px; display:block;}

  /* checklist items */
  .item{display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .body{flex:1; order:1;}
  .box{
    width:21px; height:21px; border-radius:6px; border:1.5px solid var(--text-dim);
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s; order:2;
  }
  .item .title{font-size:13.5px; font-weight:600; line-height:1.35;}
  .item.checked .box{background:var(--olive); border-color:var(--olive);}
  .box svg{width:13px; height:13px; opacity:0; transition:opacity .15s;}
  .box, .subitem-box{color:var(--on-accent);}
  .item.checked .box svg{opacity:1;}
  .item.checked .title{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .item .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .badge{display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:1px;}
  .badge.pending{background:color-mix(in srgb, var(--gold) 18%, transparent); color:var(--gold);}

  /* home */
  .glance{cursor:pointer;}
  .glance:active{background:var(--surface-2);}
  .glance-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .glance-head h3{margin:0;}
  .glance-arrow{color:var(--text-dim); flex-shrink:0;}
  .glance-stat{font-size:18px; font-weight:800; color:var(--olive); margin-bottom:6px;}
  .wash-note{
    display:flex; align-items:center; gap:8px; margin-top:10px; padding:9px 12px;
    background:color-mix(in srgb, var(--navy) 12%, transparent); border:1px solid color-mix(in srgb, var(--navy) 35%, transparent); border-radius:10px;
    color:var(--text); font-size:12.5px; font-weight:700;
  }
  .wash-note svg{flex-shrink:0; color:var(--navy);}
  .glance-routine-row{display:flex; gap:8px; align-items:flex-start; margin-bottom:5px;}
  .glance-routine-row:last-of-type{margin-bottom:0;}
  .glance-tag{
    flex-shrink:0; font-size:9.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
    padding:2px 6px; border-radius:5px; margin-top:1px;
  }
  .glance-tag.am{background:color-mix(in srgb, var(--gold) 16%, transparent); color:var(--gold);}
  .glance-tag.pm{background:color-mix(in srgb, var(--navy) 16%, transparent); color:var(--navy);}
  .glance-detail-text{font-size:12px; color:var(--text-dim); line-height:1.5;}
  .glance-icon{
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .glance-icon svg{width:15px; height:15px;}
  .glance-title-row{display:flex; align-items:center; gap:10px;}

  /* home stat tiles (wardrobe / wants) */
  .home-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .home-grid .card{margin-bottom:0; padding:14px; min-width:0; display:flex; flex-direction:column;}
  .tile-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .tile-label{font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
  .tile-stat{font-size:23px; font-weight:800; line-height:1; margin:3px 0 5px;}
  .tile-caption{font-size:11px; color:var(--text-dim); margin-bottom:12px;}
  .home-grid .progress-bar{margin-top:auto;}
  .progress-fill.wants{background:linear-gradient(90deg, color-mix(in srgb, var(--navy) 55%, white), var(--navy));}
  .tile-actions{display:flex; gap:6px; flex-shrink:0;}

  /* home "Up next" rows (full-width so product names have room to breathe) */
  .next-row{display:flex; align-items:center; gap:12px; padding:11px 0; cursor:pointer;}
  .next-row + .next-row{border-top:1px solid var(--line);}
  .next-row .tile-actions{align-self:flex-start;}
  .next-info{flex:1; min-width:0;}
  .next-name{
    font-size:13.5px; font-weight:600; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .next-meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .next-meta b{color:var(--gold); font-weight:700;}
  .icon-btn{
    flex-shrink:0; width:36px; height:36px; border-radius:50%; border:1.5px solid var(--olive-dim);
    background:none; color:var(--olive); display:flex; align-items:center; justify-content:center;
  }
  /* .icon-btn.link must undo the generic text-link `.link` rule (display:inline-block,
     margin-top) that otherwise wins the cascade and knocks the glyph off-center */
  .icon-btn.link{border-color:color-mix(in srgb, var(--gold) 40%, transparent); color:var(--gold); display:flex; margin-top:0;}
  .icon-btn:active{background:var(--surface-2);}

  /* wants */
  .quick-add{display:flex; gap:8px; margin-bottom:16px;}
  .quick-add input{
    flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-size:14px; font-family:inherit; padding:0 14px; height:46px;
  }
  .quick-add input::placeholder{color:var(--text-dim);}
  .quick-add input:focus{outline:2px solid var(--olive); outline-offset:1px;}
  .quick-add button{
    flex-shrink:0; width:46px; height:46px; border-radius:12px; border:none;
    background:var(--olive); color:var(--on-accent); display:flex; align-items:center; justify-content:center;
  }
  .quick-add button:active{opacity:.85;}
  .want-card{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line);}
  .want-card:last-child{border-bottom:none;}
  .want-card .body{flex:1;}
  .want-card .name{font-size:13.5px; font-weight:700; line-height:1.35;}
  .want-card .meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .link{font-size:12px; color:var(--link); text-decoration:none; font-weight:600; display:inline-block; margin-top:4px;}
  .want-card .price{font-size:14px; font-weight:700; color:var(--gold); margin-top:5px;}
  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px 2px; margin-top:6px; border-top:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--text-dim);
  }
  .total-row span{font-size:14px; font-weight:700; color:var(--text);}
  .total-row.grand{border-top:none; padding-top:2px;}
  .total-row.grand span{color:var(--olive); font-size:16px;}
  .toggle{
    flex-shrink:0; padding:7px 12px; border-radius:20px; border:1.5px solid var(--olive-dim);
    background:none; color:var(--olive); font-size:11px; font-weight:700; font-family:inherit;
    letter-spacing:.03em; white-space:nowrap;
  }
  .toggle.done{background:var(--olive); color:var(--on-accent); border-color:var(--olive);}
  .section-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:700; margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}
  .cat-title{font-size:11.5px; font-weight:700; color:var(--olive); margin:12px 0 2px;}
  .cat-title:first-child{margin-top:0;}
  .insight{font-size:10.5px; font-weight:600; color:var(--text-dim); background:var(--surface-2);
    padding:2px 7px; border-radius:8px; white-space:nowrap;}
  .footnote{font-size:11px; color:var(--text-dim); margin:8px 0 0; font-style:italic;}
  .badge.today{background:color-mix(in srgb, var(--olive) 22%, transparent); color:var(--olive); margin-left:8px;}
  .badge.wash{background:color-mix(in srgb, var(--navy) 22%, transparent); color:var(--navy); margin-left:8px;}
  .day.today .day-head{border-left:3px solid var(--olive);}
  .progress-wrap{margin-bottom:12px;}
  .progress-label{display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
  .progress-label b{color:var(--text); font-weight:700;}
  .progress-bar{height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--olive)); border-radius:5px; transition:width .3s ease;}

  .skeleton{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
  .skel-line{height:12px; border-radius:6px; background:var(--surface-2); margin-bottom:10px;
    animation:pulse 1.2s ease-in-out infinite;}
  .skel-line:last-child{margin-bottom:0; width:60%;}
  @keyframes pulse{0%,100%{opacity:.5;} 50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .skel-line{animation:none; opacity:.7;} }

  :focus-visible{outline:2px solid var(--olive); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important; animation-duration:.001ms !important;}
  }

  .toast{
    position:fixed; left:50%; bottom:calc(82px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:20px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--danger); color:var(--danger-text);}

  .empty{font-size:12.5px; color:var(--text-dim); font-style:italic; padding:6px 2px;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  #pull-indicator{
    height:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
    gap:8px; color:var(--text-dim); font-size:12px; font-weight:600; letter-spacing:.02em;
  }
  #pull-indicator.animated{transition:height .2s ease;}
  #pull-indicator.ready{color:var(--olive);}
  .pull-spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--text-dim); border-top-color:transparent;
    flex-shrink:0; opacity:0; transition:opacity .15s;
  }
  #pull-indicator.ready .pull-spinner{border-color:var(--olive); border-top-color:transparent;}
  #pull-indicator.refreshing .pull-spinner{opacity:1; animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    #pull-indicator.refreshing .pull-spinner{animation:none;}
  }

  /* ---------- editing (per-card, toggled by the Edit chip in each card head) ---------- */
  .edit-chip{
    flex-shrink:0; border:1px solid var(--line); background:none; color:var(--text-dim); font-family:inherit;
    font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:4px 10px; border-radius:14px;
    display:inline-flex; align-items:center; gap:5px;
  }
  .edit-chip svg{width:11px; height:11px;}
  .edit-chip.on{background:var(--olive); border-color:var(--olive); color:var(--on-accent);}

  .editable{cursor:pointer;}
  .editable:active{background:var(--surface-2); border-radius:6px;}
  .inline-pencil{display:inline-flex; vertical-align:middle; margin-left:6px; color:var(--text-dim); opacity:.7; flex-shrink:0;}
  .inline-pencil svg{display:block;}

  .row-edit-btn{
    flex-shrink:0; width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  }
  .item .row-edit-btn{order:3;}

  .add-row{
    width:100%; margin:0 0 10px; padding:10px; border-radius:10px; border:1.5px dashed var(--olive-dim);
    background:none; color:var(--olive); font-size:12.5px; font-weight:700; font-family:inherit;
  }
  .add-row:active{background:color-mix(in srgb, var(--olive) 12%, transparent);}
  .reset-btn{
    width:100%; margin-top:10px; padding:10px; border-radius:10px; border:1.5px solid color-mix(in srgb, var(--danger) 35%, transparent);
    background:none; color:var(--danger); font-size:12.5px; font-weight:700; font-family:inherit;
  }
  .reset-btn:active{background:color-mix(in srgb, var(--danger) 12%, transparent);}

  /* to-do: star / sub-checklist / completed archive */
  .todo-wrap{border-bottom:1px solid var(--line);}
  .todo-wrap:last-child{border-bottom:none;}
  .todo-wrap .item{border-bottom:none;}
  .todo-icon-btn{
    flex-shrink:0; width:26px; height:26px; border-radius:8px; border:none; background:none;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; position:relative;
  }
  .todo-icon-btn.starred{color:var(--gold);}
  .todo-icon-btn.active{color:var(--olive);}
  .subitem-list{padding:0 0 10px 26px;}
  .subitem-row{display:flex; align-items:center; gap:8px; padding:5px 0;}
  .sub-drag-handle{
    flex-shrink:0; width:18px; height:24px; margin-left:-4px; padding:0; border:none; background:none;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:grab; opacity:.55;
  }
  .sub-drag-handle svg{width:12px; height:12px;}
  .subitem-row.drag-active-sub{
    position:relative; z-index:15; background:var(--surface-2); border-radius:10px;
    outline:1.5px solid var(--olive); box-shadow:0 8px 20px rgba(0,0,0,.5);
  }
  /* dragging left past the threshold: dashed outline = will promote to a full to-do */
  .subitem-row.drag-active-sub.promoting{outline-style:dashed; outline-color:var(--gold);}
  .subitem-box{
    width:16px; height:16px; border-radius:5px; border:1.5px solid var(--text-dim); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;
  }
  .subitem-box svg{width:10px; height:10px; opacity:0; transition:opacity .15s;}
  .subitem-box.checked{background:var(--olive); border-color:var(--olive);}
  .subitem-box.checked svg{opacity:1;}
  .subitem-text{flex:1; font-size:12.5px; color:var(--text);}
  .subitem-text.checked{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .subitem-del{flex-shrink:0; width:22px; height:22px; border:none; background:none; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
  .subitem-add-toggle{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:14px;
    border:1.5px dashed var(--olive-dim); background:none; color:var(--olive);
    font-size:11.5px; font-weight:700; font-family:inherit;
    width:fit-content; margin:6px 0 2px auto;
  }
  .subitem-add-toggle:active{background:color-mix(in srgb, var(--olive) 12%, transparent);}
  .subitem-add{display:flex; gap:6px; margin:6px 0 2px;}
  .subitem-add input{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:12px; font-family:inherit; padding:0 10px; height:32px;
  }
  .subitem-add input::placeholder{color:var(--text-dim);}
  .subitem-add button{
    flex-shrink:0; width:32px; height:32px; border-radius:8px; border:none;
    background:var(--surface-2); color:var(--olive); display:flex; align-items:center; justify-content:center;
  }
  .completed-actions{flex-shrink:0; width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center;}

  /* to-do drag-to-reorder */
  .drag-handle{
    flex-shrink:0; width:24px; height:28px; margin-left:-6px; padding:0; border:none; background:none;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:grab; order:0; opacity:.65; align-self:center;
  }
  .todo-wrap.drag-active{position:relative; z-index:15;}
  .todo-wrap.drag-active .item{
    background:var(--surface-2); border-radius:12px; outline:1.5px solid var(--olive);
    box-shadow:0 10px 26px rgba(0,0,0,.55);
  }
  /* dragging right past the threshold: dragged row shows cyan, the row above
     (the future parent) gets a dashed cyan target outline */
  .todo-wrap.drag-active.indenting .item{outline-color:var(--gold);}
  .todo-wrap.indent-target .item{
    background:color-mix(in srgb, var(--gold) 7%, transparent); border-radius:12px;
    outline:1.5px dashed color-mix(in srgb, var(--gold) 55%, transparent);
  }
  body.todo-dragging, body.todo-dragging *{user-select:none; -webkit-user-select:none;}

  /* ---------- to-do rows: checkbox first, ~44px touch targets ----------
     Scoped to to-do rows only — the Style tab checklist shares .item/.box.
     Visible icons keep their old sizes; only the tappable boxes grow. Rows
     are 44px tall, and the body's 12px vertical padding centers a one-line
     title against the 44px buttons. */
  .todo-wrap .item, #todo-completed .item{padding:0 2px 0 0; gap:0;}
  .todo-wrap .item .body, #todo-completed .item .body{order:2; padding:12px 6px 12px 2px; min-width:0;}
  .todo-wrap .item .body{cursor:pointer;}
  .todo-wrap .drag-handle{height:44px; width:28px; margin-left:-8px; align-self:flex-start;}
  .todo-check{
    order:1; flex-shrink:0; width:40px; height:44px; padding:0; border:none; background:none;
    display:flex; align-items:center; justify-content:center;
  }
  .todo-check .box{margin-top:0;}
  .todo-icon-btn{width:36px; height:44px; border-radius:10px;}
  .todo-meta{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
  .overdue{color:var(--danger); font-weight:600;}
  .cat-title.overdue{color:var(--danger);}
  .todo-card-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .todo-card-head h3{margin:0;}
  .show-more{
    width:100%; margin-top:8px; min-height:44px; border-radius:10px; border:1px solid var(--line);
    background:none; color:var(--text-dim); font:inherit; font-size:12.5px; font-weight:700;
  }
  .completed-toggle{
    display:flex; align-items:center; gap:8px; width:100%; min-height:44px; margin-top:8px; padding:0 2px;
    border:none; border-top:1px solid var(--line); background:none; color:var(--text-dim);
    font:inherit; font-size:12.5px; font-weight:700; text-align:left;
  }
  .completed-toggle span{flex:1;}
  .completed-toggle .chev{transition:transform .2s;}
  .completed-toggle.open .chev{transform:rotate(180deg);}
  .badge.high{background:color-mix(in srgb, var(--navy) 22%, transparent); color:var(--navy); margin-left:8px;}
  .modal-section{display:block; margin:6px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700;}
  .backup-actions{display:flex; gap:8px; margin-top:10px;}
  .backup-btn{
    flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font:inherit; font-size:13px; font-weight:700;
  }
  /* quick-add date preview: collapses to the old 16px gap when empty */
  .todo-quick-add{margin-bottom:0;}
  .due-hint-row:empty{height:16px;}
  .due-hint-row:not(:empty){margin:8px 0 12px;}
  .due-hint{
    display:inline-flex; align-items:center; gap:2px; padding-left:12px; border-radius:16px;
    background:color-mix(in srgb, var(--gold) 16%, transparent); color:var(--gold);
    font-size:12.5px; font-weight:700;
  }
  .due-hint button{
    width:36px; height:32px; border:none; background:none; color:inherit;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-field input[type=date]{min-height:44px; -webkit-appearance:none; appearance:none;}
  /* boxed buttons: the visible 26px box is drawn by ::before inside a 36×44 hit area */
  .todo-wrap .row-edit-btn, #todo-completed .completed-actions{
    width:36px; height:44px; border:none; background:none; position:relative; isolation:isolate;
  }
  .todo-wrap .row-edit-btn::before, #todo-completed .completed-actions::before{
    content:""; position:absolute; inset:9px 5px; z-index:-1;
    border:1px solid var(--line); background:var(--surface-2); border-radius:8px;
  }
  .subitem-row{padding:0; gap:2px; min-height:44px;}
  .sub-drag-handle{height:44px;}
  .subitem-check{
    flex-shrink:0; width:36px; height:44px; padding:0; border:none; background:none;
    display:flex; align-items:center; justify-content:center;
  }
  .subitem-del{width:36px; height:44px;}
  .subitem-add-toggle{min-height:40px; padding:8px 14px;}

  /* undo toast: tappable, unlike the plain status toast */
  .toast.actionable{pointer-events:auto; display:flex; align-items:center; gap:6px; padding:0 0 0 16px;}
  .toast-action{
    background:none; border:none; color:var(--olive); font:inherit; font-weight:800;
    min-height:44px; padding:0 16px; border-radius:20px;
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:30;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal-sheet{
    width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(16px); transition:transform .2s;
    max-height:80vh; overflow-y:auto;
  }
  .modal-backdrop.open .modal-sheet{transform:translateY(0);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .modal-head h3{margin:0; font-size:16px; font-weight:700;}
  .modal-x{background:none; border:none; color:var(--text-dim); font-size:22px; line-height:1; padding:4px 8px;}
  .modal-field{display:block; margin-bottom:12px;}
  .modal-field span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700; margin-bottom:5px;}
  .modal-field input, .modal-field textarea, .modal-field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:14px; font-family:inherit; padding:10px 12px; resize:vertical;
  }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus{outline:2px solid var(--olive); outline-offset:1px;}
  .modal-checkbox{display:flex; align-items:center; gap:8px;}
  .modal-checkbox span{margin:0; text-transform:none; font-size:13px; letter-spacing:0; color:var(--text);}
  .modal-checkbox input{width:auto;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-btn{flex:1; padding:12px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; font-family:inherit;}
  .modal-btn.primary{background:var(--olive); color:var(--on-accent);}
  .modal-btn.danger{background:none; border:1.5px solid var(--danger); color:var(--danger-text);}

  /* iOS Safari zooms the page when a focused field is under 16px. Must stay
     below the base input rules (incl. the modal's) so it wins the cascade. */
  @media (pointer:coarse){
    .quick-add input, .subitem-add input,
    .modal-field input, .modal-field textarea, .modal-field select{font-size:16px;}
    .subitem-add input{height:38px;}
    .subitem-add button{width:38px; height:38px;}
  }

  /* ---------- hover feedback (mouse/trackpad only) ----------
     Mirrors the existing :active touch styles so pointer users can see what's
     interactive; gated on hover+fine-pointer so touch devices never get
     sticky-hover artifacts. */
  @media (hover:hover) and (pointer:fine){
    .glance:hover, .coll-head:hover{background:var(--surface-2);}
    .day-head:hover{background:var(--surface-3);}
    .icon-btn:hover, .toggle:hover:not(.done), .edit-chip:hover:not(.on),
    .row-edit-btn:hover, .todo-icon-btn:hover, .completed-actions:hover,
    .subitem-del:hover, .modal-x:hover, .hard-refresh-btn:hover, .show-more:hover{background:var(--surface-2); color:var(--text);}
    .sync-btn:hover{background:var(--surface-2);} /* keeps its state color */
    .icon-btn:hover{color:var(--olive);}
    .icon-btn.link:hover{color:var(--gold);}
    .todo-icon-btn.starred:hover{color:var(--gold);}
    .toggle:hover:not(.done){color:var(--olive);}
    .toggle.done:hover, .edit-chip.on:hover, .quick-add button:hover,
    .modal-btn.primary:hover, .subitem-add button:hover{opacity:.85;}
    .add-row:hover, .subitem-add-toggle:hover{background:color-mix(in srgb, var(--olive) 12%, transparent);}
    .reset-btn:hover, .modal-btn.danger:hover{background:color-mix(in srgb, var(--danger) 12%, transparent);}
    .box:hover, .subitem-box:not(.checked):hover{border-color:var(--olive);}
    .link:hover{text-decoration:underline;}
    .drag-handle:hover, .sub-drag-handle:hover{opacity:1; color:var(--text);}
    .todo-wrap .row-edit-btn:hover, #todo-completed .completed-actions:hover{background:none;}
    .todo-wrap .row-edit-btn:hover::before, #todo-completed .completed-actions:hover::before{border-color:var(--text-dim);}
    .todo-check:hover .box, .subitem-check:hover .subitem-box:not(.checked){border-color:var(--olive);}
  }
  body.todo-dragging .drag-handle, body.todo-dragging .sub-drag-handle{cursor:grabbing;}

  /* ---------- desktop (≥768px): tab bar moves to the top, content centers ----------
     Body is a flex column and main scrolls internally, so the nav can leave its
     fixed-bottom position and slot between header and main via flex `order`.
     The shared max(24px, 50% - 380px) padding keeps header, tabs, and content
     aligned on one centered 760px column. */
  @media (min-width:768px){
    header{order:-2; padding:18px max(24px, calc(50% - 380px)) 14px;}
    nav.tabbar{
      order:-1; position:static;
      border-top:none; border-bottom:1px solid var(--line);
      padding:0 max(24px, calc(50% - 380px)); gap:2px;
    }
    nav.tabbar button{
      flex:0 0 auto; flex-direction:row; gap:8px;
      font-size:13px; letter-spacing:.01em; padding:13px 16px;
      border-radius:0; position:relative; cursor:pointer;
    }
    nav.tabbar button svg{width:18px; height:18px;}
    nav.tabbar button:hover{color:var(--text);}
    nav.tabbar button.active::after{
      content:""; position:absolute; left:14px; right:14px; bottom:-1px;
      height:2px; background:var(--olive); border-radius:2px;
    }
    main{padding:24px max(24px, calc(50% - 380px)) 48px;}
    .hard-refresh-btn{display:flex;}
    .toast{bottom:32px;}
    .modal-backdrop{align-items:center;}
    .modal-sheet{border-radius:18px; padding:18px;}
  }
  /* Large screens: widen the column to 920px so 1440px+ displays aren't
     mostly empty margin. Lists stay single-column on purpose. */
  @media (min-width:1440px){
    header{padding-left:max(24px, calc(50% - 460px)); padding-right:max(24px, calc(50% - 460px));}
    nav.tabbar{padding-left:max(24px, calc(50% - 460px)); padding-right:max(24px, calc(50% - 460px));}
    main{padding-left:max(24px, calc(50% - 460px)); padding-right:max(24px, calc(50% - 460px));}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1 id="headline">Home</h1>
    <div class="header-meta">
      <div class="eyebrow" id="header-date"></div>
    </div>
    <button class="sync-btn" id="sync-btn" data-state="off" onclick="openSyncModal()" title="Sync &amp; backup" aria-label="Sync and backup">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
    </button>
    <button class="hard-refresh-btn" onclick="this.classList.add('spinning'); hardRefresh()" title="Clear cached app files and reload (your data is kept)" aria-label="Hard refresh">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="pull-indicator"><span class="pull-spinner"></span><span class="pull-label">Pull to refresh</span></div>
  <!-- HOME -->
  <section class="tabpanel active" id="panel-home"></section>
  <!-- SKIN / HAIR -->
  <section class="tabpanel" id="panel-skin"></section>
  <!-- STYLE -->
  <section class="tabpanel" id="panel-style">
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div>
  </section>
  <!-- WANTS -->
  <section class="tabpanel" id="panel-wants">
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div>
  </section>
</main>

<div class="toast" id="toast" aria-live="polite"></div>

<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal-sheet">
    <div class="modal-head">
      <h3 id="modal-heading">Edit</h3>
      <button class="modal-x" onclick="closeModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="modal-btn danger" id="modal-delete-btn" onclick="modalDelete()">Delete</button>
      <button class="modal-btn primary" onclick="modalSave()">Save</button>
    </div>
  </div>
</div>

<nav class="tabbar" aria-label="Sections">
  <button data-tab="home" class="active" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>
    Home

    Skin &amp; Hair
  </button>
  <button data-tab="style">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l3 3 3-3h3l2 5-3 2v11H7V10L4 8z"/></svg>
    Wardrobe
  </button>
  <button data-tab="wants">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
    Wants
  </button>
</nav>

<script>

function openModal(title, fields, values, onSave, onDelete, deleteOpts){
  document.getElementById("modal-heading").textContent = title;
  modalFields = fields;
  modalOnSave = onSave;
  modalOnDelete = onDelete || null;
  modalDeleteConfirm = (deleteOpts && deleteOpts.confirm) || "Delete this? This can't be undone.";
  document.getElementById("modal-delete-btn").textContent = (deleteOpts && deleteOpts.label) || "Delete";
  const body = document.getElementById("modal-body");
  body.innerHTML = fields.map(f => {
    const val = (values && values[f.key] != null) ? values[f.key] : (f.type === "checkbox" ? false : "");
    if (f.type === "note"){
      return `<p class="modal-note">${f.label}</p>`; // f.label is trusted app-authored HTML
    }
    if (f.type === "select"){
      const opts = f.options.map(o => `<option value="${escapeAttr(o)}" ${o===val?"selected":""}>${o}</option>`).join("");
      return `<label class="modal-field"><span>${f.label}</span><select id="modal-${f.key}">${opts}</select></label>`;
    }
    if (f.type === "textarea"){
      // enterSaves: a wrapping single-value field (e.g. a long to-do title) — Enter saves instead of adding a newline
      return `<label class="modal-field"><span>${f.label}</span><textarea id="modal-${f.key}" rows="2"${f.enterSaves?' data-enter-saves enterkeyhint="done"':''}>${escapeHtml(val)}</textarea></label>`;
    }
    if (f.type === "checkbox"){
      return `<label class="modal-field modal-checkbox"><input id="modal-${f.key}" type="checkbox" ${val?"checked":""}><span>${f.label}</span></label>`;
    }
    return `<label class="modal-field"><span>${f.label}</span><input id="modal-${f.key}" type="${f.type||'text'}" value="${escapeAttr(val)}"${f.step?` step="${f.step}"`:""}></label>`;
  }).join("");
  document.getElementById("modal-delete-btn").style.display = modalOnDelete ? "block" : "none";
  document.getElementById("modal-backdrop").classList.add("open");
  // Autofocus the first field — desktop only, so mobile doesn't pop the keyboard
  // over the sheet the moment it opens.
  if (window.matchMedia("(hover:hover) and (pointer:fine)").matches){
    const first = body.querySelector("input, textarea, select");
    if (first) setTimeout(() => first.focus(), 60);
  }
}

    let v = f.type === "checkbox" ? el.checked : el.value;

// ---------- RENDER: HOME ----------
// ---------- to-do dates ----------
// A to-do's `due` is a local "YYYY-MM-DD" string, or null for Anytime. Older
// data stored `day` (a bare weekday name with no real date); migrateTodoDays()
// converts that to the next occurrence of the weekday, today included.
// Date math runs at local noon so DST shifts can't push a day over a boundary.
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function noonOf(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d, 12); }
function addDaysIso(n){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return isoDate(d); }
function daysFromToday(iso){
  const now = new Date(); now.setHours(12,0,0,0);
  return Math.round((noonOf(iso) - now) / 86400000);
}
function nextWeekdayIso(dayIdx){ return addDaysIso((dayIdx - new Date().getDay() + 7) % 7); }
function dueLabel(iso){
  const n = daysFromToday(iso);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n > 1 && n < 7) return WEEKDAYS[noonOf(iso).getDay()];
  return noonOf(iso).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
// Groups in display order. Overdue and Today sit above Anytime because they're
// time-critical and usually short; Anytime stays near the top so quick-adds
// (undated by default) land right under the input.
function todoGroup(t){
  if (!t.due) return "anytime";
  const n = daysFromToday(t.due);
  if (n < 0) return "overdue";
  if (n === 0) return "today";
  return n < 7 ? "d" + n : "later";
}
function todoGroups(){
  const g = [
    {key:"overdue", label:"Overdue", due:"keep"},
    {key:"today", label:"Today", due:addDaysIso(0)},
    {key:"anytime", label:"Anytime", due:""},
    {key:"d1", label:"Tomorrow", due:addDaysIso(1)}
  ];
  for (let n = 2; n < 7; n++) g.push({key:"d"+n, label:WEEKDAYS[noonOf(addDaysIso(n)).getDay()], due:addDaysIso(n)});
  g.push({key:"later", label:"Later", due:"keep"});
  return g;
}
function migrateTodoDays(list){
  let changed = false;
  list.forEach(t => {
    if ("day" in t){
      if (t.due === undefined){
        const i = WEEKDAYS.indexOf(t.day);
        t.due = i >= 0 ? nextWeekdayIso(i) : null;
      }
      delete t.day;
      changed = true;
    }
    if (t.due === undefined){ t.due = null; changed = true; }
  });
  return changed;
}
// Trailing date word in quick-add: "dentist fri", "call mom tomorrow",
// "pay rent by today". Only the final word counts, and the input shows a
// dismissible preview, so a title that legitimately ends in a day name can
// be kept as plain text.
const DAY_ALIASES = {sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6};
function parseQuickAdd(raw){
  const m = raw.match(/^(.*?)\s+(?:on\s+|by\s+)?(today|tonight|tomorrow|tmrw|tmr|sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)$/i);
  if (!m || !m[1].trim()) return {text:raw, due:null};
  const w = m[2].toLowerCase();
  let due;
  if (w === "today" || w === "tonight") due = addDaysIso(0);
  else if (w.startsWith("tom") || w.startsWith("tm")) due = addDaysIso(1);
  else due = nextWeekdayIso(DAY_ALIASES[w.slice(0,3)]);
  return {text:m[1].trim(), due};
}
let quickAddIgnoreDate = false;
function updateDueHint(){
  const input = document.getElementById("todo-quick-add-input");
  const hint = document.getElementById("todo-due-hint");
  if (!input || !hint) return;
  if (!input.value.trim()) quickAddIgnoreDate = false;
  const p = parseQuickAdd(input.value.trim());
  if (!p.due || quickAddIgnoreDate){ hint.innerHTML = ""; return; }
  hint.innerHTML = `<span class="due-hint">Due ${escapeHtml(dueLabel(p.due))}<button type="button" onclick="quickAddIgnoreDate=true; updateDueHint(); document.getElementById('todo-quick-add-input').focus();" aria-label="Keep as text, no due date">${X_ICON}</button></span>`;
}

        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="todo-due-hint" class="due-hint-row"></div>`;
  const renderSubitems = (t) => {
    const subs = t.subitems || [];
    const rows = subs.map(s => `<div class="subitem-row" data-sub-id="${s.id}">
        <button class="sub-drag-handle" onclick="event.stopPropagation()" aria-label="Drag to reorder">${GRIP_ICON}</button>
        <button class="subitem-check" role="checkbox" aria-checked="${!!s.done}" aria-label="Complete: ${escapeAttr(s.text)}" onclick="event.stopPropagation(); toggleSubitem('${t.id}','${s.id}')"><span class="subitem-box ${s.done?'checked':''}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </span></button>
        <div class="subitem-text ${s.done?'checked':''}">${escapeHtml(s.text)}</div>
        <button class="subitem-del" onclick="event.stopPropagation(); deleteSubitem('${t.id}','${s.id}')" aria-label="Delete sub-item">${X_ICON}</button>
      </div>`).join("");
    const addUi = subAddOpen.has(t.id)
      ? `<div class="subitem-add">
          <input type="text" id="subitem-input-${t.id}" placeholder="Add sub-item" autocomplete="off" onkeydown="if(event.key==='Enter') addSubitem('${t.id}');">
          <button onclick="addSubitem('${t.id}')" aria-label="Add sub-item">${SMALL_PLUS_ICON}</button>
        </div>`
      : `<button class="subitem-add-toggle" onclick="openSubitemAdd('${t.id}')">${SMALL_PLUS_ICON} Add sub-item</button>`;
    return `<div class="subitem-list" onclick="event.stopPropagation()">
        ${rows}
        ${addUi}
      </div>`;
  };
  const todoRow = (t) => {
    const subs = t.subitems || [];
    const subDone = subs.filter(s => s.done).length;
    const expanded = expandedTodos.has(t.id);
    const group = todoGroup(t);
    const meta = [];
    if (group === "overdue") meta.push(`<span class="overdue">${escapeHtml(dueLabel(t.due))}</span>`);
    else if (group === "later") meta.push(escapeHtml(dueLabel(t.due)));
    if (subs.length) meta.push(`${subDone}/${subs.length} sub-items`);
    return `<div class="todo-wrap" data-todo-id="${t.id}">
        <div class="item ${t.done?'checked':''}">
          <button class="drag-handle" onclick="event.stopPropagation()" aria-label="Drag to reorder">${GRIP_ICON}</button>
          <button class="todo-check" role="checkbox" aria-checked="${t.done}" aria-label="Complete: ${escapeAttr(t.text)}" onclick="completeTodo('${t.id}')"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></button>
          <div class="body" onclick="editTodo('${t.id}')"><div class="title">${escapeHtml(t.text)}</div>${meta.length?`<div class="todo-meta">${meta.join(" · ")}</div>`:""}</div>
          <button class="todo-icon-btn ${t.starred?'starred':''}" style="order:3;" onclick="event.stopPropagation(); toggleTodoStar('${t.id}')" aria-label="${t.starred?'Unstar':'Star'} to-do">${t.starred?STAR_FILLED_ICON:STAR_ICON}</button>
          ${subs.length ? `<button class="todo-icon-btn ${expanded?'active':''}" style="order:4;" onclick="event.stopPropagation(); toggleTodoExpand('${t.id}')" aria-label="${expanded?'Hide':'Show'} sub-items" aria-expanded="${expanded}">${SUBLIST_ICON}</button>` : ""}
          <button class="row-edit-btn" style="order:5;" onclick="event.stopPropagation(); editTodo('${t.id}')" aria-label="Edit to-do">${PENCIL_ICON}</button>
        </div>
        ${expanded && subs.length ? renderSubitems(t) : ""}
      </div>`;
  };
  const overdueCount = todoList.filter(t => !t.done && todoGroup(t) === "overdue").length;
  const countLabel = todoList.length === 0 ? 'Empty'
    : (totalOpen ? `${totalOpen} open${overdueCount ? ` · <span class="overdue">${overdueCount} overdue</span>` : ''}` : 'All done');
  html += `<div class="card" id="todo-card">
    <div class="todo-card-head"><h3>To-Do</h3><span class="insight">${countLabel}</span></div>`;
  if (todoList.length === 0){
    html += `<div class="empty">Nothing on your list — add one above.</div>`;
  } else if (totalOpen === 0){
    html += `<div class="empty">All done for now.</div>`;
  } else {
    // Within a group, array order IS display order (drag-to-reorder writes it
    // back); Overdue and Later sort by date instead. Only the first few rows
    // show until "Show all" so the rest of Home stays in reach.
    html += `<div id="todo-list">`;
    let shown = 0, hidden = 0, firstGroup = true;
    todoGroups().forEach(g => {
      let items = todoList.filter(t => !t.done && todoGroup(t) === g.key);
      if (g.key === "overdue" || g.key === "later") items = items.slice().sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
      if (!items.length) return;
      const room = showAllTodos ? items.length : Math.max(0, TODO_PREVIEW_COUNT - shown);
      hidden += items.length - Math.min(room, items.length);
      items = items.slice(0, room);
      if (!items.length) return;
      html += `<div class="cat-title${g.key==='overdue'?' overdue':''}" data-due="${g.due}"${firstGroup?' style="margin-top:0;"':''}>${g.label}</div>`;
      firstGroup = false;
      items.forEach(t => { html += todoRow(t); shown++; });
    });
    html += `</div>`;
    if (hidden) html += `<button class="show-more" onclick="showAllTodos=true; renderHome();">Show ${hidden} more</button>`;
    else if (showAllTodos && totalOpen > TODO_PREVIEW_COUNT) html += `<button class="show-more" onclick="showAllTodos=false; renderHome();">Show less</button>`;
  }

  // Completed lives inside the to-do card behind a one-line toggle, so it
  // doesn't take a whole card of Home's height while collapsed.
  if (completedItems.length){
    const completedOpen = openPinned.has('todo-completed');
    const completedRows = completedItems.map(t => {
      const dateLabel = t.completedAt ? new Date(t.completedAt).toLocaleDateString('en-US',{month:'short', day:'numeric'}) : "";
      return `<div class="item checked">
          <button class="todo-check" role="checkbox" aria-checked="true" aria-label="Mark not done: ${escapeAttr(t.text)}" onclick="toggleTodo('${t.id}')"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></button>
          <div class="body"><div class="title">${escapeHtml(t.text)}</div>${dateLabel?`<div class="sub">Completed ${dateLabel}</div>`:""}</div>
          <button class="completed-actions" style="order:3;" onclick="event.stopPropagation(); duplicateTodo('${t.id}')" aria-label="Duplicate to-do">${DUPLICATE_ICON}</button>
          <button class="completed-actions" style="order:4;" onclick="event.stopPropagation(); deleteTodoPermanently('${t.id}')" aria-label="Delete to-do">${TRASH_ICON}</button>
        </div>`;
    }).join("");
    const archivedCount = loadContent("todo-archive-content", []).length;
    html += `<button class="completed-toggle ${completedOpen?'open':''}" onclick="toggleCompletedTodos()" aria-expanded="${completedOpen}">
        ${CHECK_ICON}<span>${completedItems.length} completed</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>`;
    if (completedOpen){
      html += `<div id="todo-completed">
          ${completedRows}
          <button class="reset-btn" onclick="clearCompletedTodos()">Clear completed</button>
          <p class="footnote">Completed to-dos are archived automatically after 7 days${archivedCount ? ` · ${archivedCount} archived so far` : ""}.</p>
        </div>`;
    }
  }
  html += `</div>`;

  const todayName = new Date().toLocaleDateString('en-US', {weekday:'long'});
  const today = skinDays.find(d => d.day === todayName);
  if (today){
    const washWeek = isWashWeek();
    const isWashDay = !!today.pmWash && washWeek;
    const pmBand = today.pmWash ? (washWeek ? "pmWash" : "pm") : "pm";
    const pmSteps = today[pmBand];
    const amNames = today.am.map(shortStepLabel).join(", ");
    const pmNames = pmSteps.map(shortStepLabel).join(", ");
    const washDays = daysUntilWashDay();
    const washDateLabel = nextWashDate().toLocaleDateString('en-US', {month:'short', day:'numeric'});
    const washNote = isWashDay ? "" : `<div class="wash-note">${DROPLET_ICON}Next wash day: ${washDateLabel} — ${washDays===1?'tomorrow':`in ${washDays} days`}</div>`;
    html += `<div class="card glance" onclick="activateTab('skin')">
        <div class="glance-head">
          <div class="glance-title-row">
            <div class="glance-icon" style="background:color-mix(in srgb, var(--gold) 15%, transparent); color:var(--gold);">${SKIN_ICON}</div>
            <h3 style="margin:0;">Today — ${today.day}</h3>${isWashDay?'<span class="badge wash">Wash day</span>':''}
          </div>
          <svg class="glance-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="glance-stat">${today.am.length} AM steps · ${pmSteps.length} PM steps</div>
        <div class="glance-routine-row"><span class="glance-tag am">AM</span><span class="glance-detail-text">${amNames}</span></div>
        <div class="glance-routine-row"><span class="glance-tag pm">PM</span><span class="glance-detail-text">${pmNames}</span></div>
        ${washNote}
      </div>`;
  }

  const ownedCount = capsule.filter(i => currentCapState(i) === "owned").length;
  const capPct = capsule.length ? Math.round((ownedCount / capsule.length) * 100) : 0;
  const cheapestNeeded = capsule.filter(i => currentCapState(i) !== "owned").sort((a,b)=>(a.price??Infinity)-(b.price??Infinity))[0];
  const pendingItems = wantsList.filter(w => !wantsState[w.id]);
  const pendingTotal = pendingItems.reduce((sum,w) => sum + (w.price||0), 0);
  const nextWant = pendingItems.slice().sort(wantsOrder)[0];

  const boughtCount = wantsList.length - pendingItems.length;
  const boughtPct = wantsList.length ? Math.round((boughtCount / wantsList.length) * 100) : 0;

  html += `<div class="home-grid">
      <div class="card glance" onclick="activateTab('style')">
        <div class="tile-head">
          <div class="glance-icon" style="background:color-mix(in srgb, var(--olive) 15%, transparent); color:var(--olive);">${SHIRT_ICON}</div>
          <svg class="glance-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="tile-label">Wardrobe</div>
        <div class="tile-stat" style="color:var(--olive);">${capPct}%</div>
        <div class="tile-caption">${ownedCount}/${capsule.length} owned</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${capPct}%"></div></div>
      </div>
      <div class="card glance" onclick="activateTab('wants')">
        <div class="tile-head">
          <div class="glance-icon" style="background:color-mix(in srgb, var(--navy) 15%, transparent); color:var(--navy);">${BAG_ICON}</div>
          <svg class="glance-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="tile-label">Wants</div>
        <div class="tile-stat" style="color:var(--navy);">$${fmtMoney(pendingTotal)}</div>
        <div class="tile-caption">${pendingItems.length} still needed${boughtCount ? ` · ${boughtCount} bought` : ""}</div>
        ${boughtCount ? `<div class="progress-bar"><div class="progress-fill wants" style="width:${boughtPct}%"></div></div>` : ""}
      </div>
    </div>`;

  if (cheapestNeeded || nextWant){
    const nextRow = (tab, iconBg, iconColor, icon, name, priceStr, context, link, checkCall, checkLabel) => `
      <div class="next-row" onclick="activateTab('${tab}')">
        <div class="glance-icon" style="background:${iconBg}; color:${iconColor};">${icon}</div>
        <div class="next-info">
          <div class="next-name">${escapeHtml(name)}</div>
          <div class="next-meta">${priceStr?`<b>${priceStr}</b> · `:""}${context}</div>
        </div>
        <div class="tile-actions">
          ${link?`<a href="${link}" target="_blank" rel="noopener" class="icon-btn link" onclick="event.stopPropagation()" aria-label="View product">${LINK_ICON}</a>`:''}
          <button class="icon-btn" onclick="event.stopPropagation(); ${checkCall}" aria-label="${checkLabel}">${CHECK_ICON}</button>
        </div>
      </div>`;
    html += `<div class="card">
        <div class="glance-head"><h3>Up next</h3><span class="insight">priority, then price</span></div>
        ${cheapestNeeded ? nextRow('style', 'color-mix(in srgb, var(--olive) 15%, transparent)', 'var(--olive)', SHIRT_ICON, cheapestNeeded.title,
            cheapestNeeded.price!=null?`${cheapestNeeded.estimated?'~':''}$${fmtMoney(cheapestNeeded.price)}`:'',
            'Wardrobe · still need', cheapestNeeded.link,
            `toggleCapsule('${cheapestNeeded.id}').then(renderHome);`, 'Mark owned') : ''}
        ${nextWant ? nextRow('wants', 'color-mix(in srgb, var(--navy) 15%, transparent)', 'var(--navy)', BAG_ICON, nextWant.name,
            nextWant.price!=null?`${nextWant.estimated?'~':''}$${fmtMoney(nextWant.price)}`:'',
            nextWant.priority === 'high' ? 'Wants · high priority' : 'Wants · still need', nextWant.link,
            `toggleWant('${nextWant.id}').then(renderHome);`, 'Mark bought') : ''}
      </div>`;
  }

  el.innerHTML = html;
}
function quickAddTodo(){
  const input = document.getElementById("todo-quick-add-input");
  const raw = input.value.trim();
  if (!raw) return;
  const parsed = quickAddIgnoreDate ? {text:raw, due:null} : parseQuickAdd(raw);
  quickAddIgnoreDate = false;
  const t = {id:genId("todo"), text:parsed.text, done:false, due:parsed.due, starred:false, subitems:[], completedAt:null};
  // New items go to the top of their group so they land in view, not below the fold
  const at = todoList.findIndex(x => !x.done && todoGroup(x) === todoGroup(t));
  if (at >= 0) todoList.splice(at, 0, t); else todoList.push(t);
  saveContent("todo-content", todoList);
  renderHome();
  if (!document.querySelector(`#todo-list [data-todo-id="${t.id}"]`)){ showAllTodos = true; renderHome(); }
  if (t.due) showToast(`Added for ${dueLabel(t.due)}`);
  document.getElementById("todo-quick-add-input").focus();
}
function toggleTodo(id){
  const t = todoList.find(x=>x.id===id);
  t.done = !t.done;
  t.completedAt = t.done ? Date.now() : null;
  saveContent("todo-content", todoList);
  renderHome();
}
// Completing from the open list hides the row in the collapsed Completed card,
// so offer a short undo window. Array position never changes on toggle, so
// undoing puts the item back exactly where it was.
function completeTodo(id){
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} // Android only; iOS ignores it
  toggleTodo(id);
  showUndoToast("To-do completed", () => {
    const t = todoList.find(x=>x.id===id);
    if (!t || !t.done) return;
    t.done = false;
    t.completedAt = null;
    saveContent("todo-content", todoList);
    renderHome();
  });
}
function toggleTodoStar(id){
  const t = todoList.find(x=>x.id===id);
  t.starred = !t.starred;
  if (t.starred){
    // float to the top of the list once; drag order takes over from there
    todoList.splice(todoList.indexOf(t), 1);
    todoList.unshift(t);
  }
  saveContent("todo-content", todoList);
  renderHome();
}
function toggleTodoExpand(id){
  if (expandedTodos.has(id)){
    expandedTodos.delete(id);
    subAddOpen.delete(id); // reset to view-only next time it opens
  } else {
    expandedTodos.add(id);
  }
  renderHome();
}
function openSubitemAdd(id){
  subAddOpen.add(id);
  renderHome();
  const input = document.getElementById(`subitem-input-${id}`);
  if (input) input.focus();
}
function addSubitem(todoId){
  const input = document.getElementById(`subitem-input-${todoId}`);
  const text = input.value.trim();
  if (!text) return;
  const t = todoList.find(x=>x.id===todoId);
  if (!t.subitems) t.subitems = [];
  t.subitems.push({id:genId("sub"), text, done:false});
  saveContent("todo-content", todoList);
  renderHome();
  const fresh = document.getElementById(`subitem-input-${todoId}`);
  if (fresh) fresh.focus();
}
function toggleSubitem(todoId, subId){
  const t = todoList.find(x=>x.id===todoId);
  const s = t.subitems.find(x=>x.id===subId);
  s.done = !s.done;
  saveContent("todo-content", todoList);
  renderHome();
}
function deleteSubitem(todoId, subId){
  const t = todoList.find(x=>x.id===todoId);
  t.subitems = t.subitems.filter(x=>x.id!==subId);
  saveContent("todo-content", todoList);
  renderHome();
}
function duplicateTodo(id){
  const t = todoList.find(x=>x.id===id);
  const copy = {
    id:genId("todo"), text:t.text, done:false, due:t.due||null, starred:false, completedAt:null,
    subitems:(t.subitems||[]).map(s => ({id:genId("sub"), text:s.text, done:false}))
  };
  todoList.push(copy);
  saveContent("todo-content", todoList);
  renderHome();
}
function deleteTodoPermanently(id){
  if (!confirm("Delete this to-do? This can't be undone.")) return;
  const idx = todoList.findIndex(x=>x.id===id);
  todoList.splice(idx,1);
  saveContent("todo-content", todoList);
  renderHome();
}
function editTodo(id){
  const t = todoList.find(x=>x.id===id);
  openModal("Edit to-do", [
    {key:"text",label:"To-do",type:"textarea",enterSaves:true},
    {key:"due",label:"Due date — clear it for Anytime",type:"date"},
    {key:"subs",label:"Add sub-items — one per line",type:"textarea"}
  ], {text:t.text, due:t.due||""},
    (v) => {
      const text = (v.text || "").replace(/\s*\n\s*/g, " ").trim();
      if(!text) return;
      t.text = text;
      t.due = /^\d{4}-\d{2}-\d{2}$/.test(v.due || "") ? v.due : null;
      const newSubs = (v.subs || "").split("\n").map(s => s.trim()).filter(Boolean);
      if (newSubs.length){
        if (!t.subitems) t.subitems = [];
        newSubs.forEach(s => t.subitems.push({id:genId("sub"), text:s, done:false}));
        expandedTodos.add(t.id);
      }
      saveContent("todo-content", todoList); renderHome();
    },
    () => {
      const idx = todoList.findIndex(x=>x.id===id);
      todoList.splice(idx,1);
      saveContent("todo-content", todoList); renderHome();
    }
  );
}
function clearCompletedTodos(){
  if (!confirm("Clear all completed to-dos? This can't be undone.")) return;
  todoList = todoList.filter(t => !t.done);
  saveContent("todo-content", todoList);
  renderHome();
}

// Completed to-dos auto-move to a hidden archive (todo-archive-content, synced,
// capped) once they're 7+ days old, keeping the Completed card short-term only.
// Runs on load, after a sync pull, and on return to foreground; saves silently
// (no "Saved" toast) since the user didn't do anything. Returns true if it
// changed anything so callers know to re-render.
const TODO_RETENTION_MS = 7 * 24 * 60 * 60 * 1000;
const TODO_ARCHIVE_MAX = 200;
function archiveOldTodos(){
  let changed = false;
  // done items missing a stamp (older data): stamp now so their 7 days start today
  todoList.forEach(t => { if (t.done && !t.completedAt){ t.completedAt = Date.now(); changed = true; } });
  const cutoff = Date.now() - TODO_RETENTION_MS;
  const old = todoList.filter(t => t.done && t.completedAt < cutoff);
  if (old.length){
    const archive = loadContent("todo-archive-content", []);
    archive.push(...old.map(t => ({
      text:t.text, completedAt:t.completedAt, due:t.due || null,
      subitems:(t.subitems || []).map(s => ({text:s.text, done:!!s.done}))
    })));
    archive.sort((a,b) => (b.completedAt||0) - (a.completedAt||0));
    if (archive.length > TODO_ARCHIVE_MAX) archive.length = TODO_ARCHIVE_MAX;
    todoList = todoList.filter(t => !old.includes(t));
    writeQuietly("todo-archive-content", archive);
    changed = true;
  }
  if (changed) writeQuietly("todo-content", todoList);
  return changed;
}

    const pmBand = d.pmWash ? (washWeek ? "pmWash" : "pm") : "pm";

    const dayEdit = editCards.has('day-'+i);

// Wash day falls on Thursday every 2 weeks; last wash was Thu Jul 16, 2026.
const WASH_DAY_ANCHOR = new Date(2026, 6, 16);
function isWashWeek(){
  const today = new Date();
  const thisThursday = new Date(today.getFullYear(), today.getMonth(), today.getDate() + ((4 - today.getDay() + 7) % 7));
  const diffWeeks = Math.round((thisThursday - WASH_DAY_ANCHOR) / (7 * 86400000));
  return ((diffWeeks % 2) + 2) % 2 === 0;
}
function isWashThursday(thuDate){
  const diffWeeks = Math.round((thuDate - WASH_DAY_ANCHOR) / (7 * 86400000));
  return ((diffWeeks % 2) + 2) % 2 === 0;
}
function nextWashDate(){
  const today = new Date();
  today.setHours(0,0,0,0);
  let cand = new Date(today.getFullYear(), today.getMonth(), today.getDate() + ((4 - today.getDay() + 7) % 7));
  while (!isWashThursday(cand)) cand = new Date(cand.getFullYear(), cand.getMonth(), cand.getDate() + 7);
  return cand;
}
function daysUntilWashDay(){
  const today = new Date();
  today.setHours(0,0,0,0);
  return Math.round((nextWashDate() - today) / 86400000);
}
function stepHtml(s,n,dayIdx,band,edit){
  const body = `<b>${s[0]}</b> — ${s[1]}${s[2]?`<span class="note">${s[2]}</span>`:""}`;
  if (edit){
    return `<div class="step editable" onclick="editStep(${dayIdx},'${band}',${n})"><span class="n">${n+1}.</span><div>${body}<span class="inline-pencil">${PENCIL_ICON}</span></div></div>`;
  }
  return `<div class="step"><span class="n">${n+1}.</span><div>${body}</div></div>`;
}

  capsule.forEach(item => {

        ${editBtn}
      </div>`;
    const cat = item.cat || "Other";
    const bucket = checked ? ownedByCat : neededByCat;
    if (!bucket[cat]) bucket[cat] = "";
    bucket[cat] += row;
  });

  function buildGrouped(byCat){
    let out = "";
    CAT_ORDER.forEach(cat => { if (byCat[cat]) out += `<div class="cat-title">${cat}</div>${byCat[cat]}`; });
    Object.keys(byCat).forEach(cat => { if (!CAT_ORDER.includes(cat)) out += `<div class="cat-title">${cat}</div>${byCat[cat]}`; });

// Money summary for a list where some items may have no price yet. Each total
// appears once: a complete sum goes in the card-header badge (visible even when
// the card is collapsed); a partial sum goes in an in-card row labeled as
// partial so it never reads as the full cost; no prices at all shows nothing.
function priceSummary(items){
  const priced = items.filter(i => i.price != null);
  const sum = priced.reduce((s,i) => s + i.price, 0);
  const missing = items.length - priced.length;
  const full = priced.length > 0 && missing === 0;
  return {
    badge: full ? ` · $${fmtMoney(sum)}` : "",
    row: priced.length && !full
      ? `<div class="total-row">Known prices · ${missing} unpriced <span>$${fmtMoney(sum)}</span></div>` : ""
  };
}

// High-priority wants first, then cheapest; unpriced items sort last.
function wantsOrder(a, b){

}
