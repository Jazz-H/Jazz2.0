<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz 2.0</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jazz 2.0">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    /* "Graphite" theme -- neutral charcoal ground, soft-white primary accent,
       pastel blue (AM) and pink (PM). Token names predate the palette
       (--gold = AM, --navy = PM, --olive = primary accent); every color in the
       app derives from these, so a theme swap only touches this block. */
    --bg:#0c0c0d;
    --surface:#161618;
    --surface-2:#1d1d20;
    --surface-3:#232327;
    --line:#2c2c31;
    --text:#f2f2f3;
    --text-dim:#8e8e96;
    --gold:#93c5fd;
    --navy:#f9a8d4;
    --olive:#f2f2f3;
    --olive-dim:#4b4d52;
    --danger:#f87171;
    --danger-text:#fecaca;
    --on-accent:#111113;   /* text/glyphs drawn on top of --olive fills */
    --link:#93c5fd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button{cursor:pointer;}
  .box, .subitem-box{cursor:pointer;}
  html{color-scheme:dark;} /* dark native scrollbars, select dropdowns, etc. */
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none;}
  body{display:flex; flex-direction:column;}

  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim); font-weight:600;
  }
  .header-meta{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:2px; flex-shrink:0;}
  /* Desktop stand-in for pull-to-refresh (a touch-only gesture): same
     hardRefresh() escape hatch, hidden below the desktop breakpoint. */
  .hard-refresh-btn{
    display:none; width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:none; color:var(--text-dim); align-items:center; justify-content:center; flex-shrink:0;
  }
  .hard-refresh-btn.spinning svg{animation:spin .8s linear infinite;}
  /* Gist sync status button — shown on every size (phones need to connect too).
     data-state: off (dim) / busy (pulsing) / ok (lime) / error (red). */
  .sync-btn{
    display:flex; width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:none; color:var(--text-dim); align-items:center; justify-content:center; flex-shrink:0;
  }
  .sync-btn[data-state="ok"]{color:var(--olive); border-color:var(--olive-dim);}
  .sync-btn[data-state="error"]{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, transparent);}
  .sync-btn[data-state="busy"] svg{animation:pulse 1.1s ease-in-out infinite;}
  .modal-note{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:0 0 12px;}
  .modal-note a{color:var(--olive);}
  header h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.01em;}
  .header-row{display:flex; align-items:center; gap:12px;}

  main{flex:1; overflow-y:auto; padding:16px 16px 100px;}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10.5px; font-family:inherit; font-weight:600;
    letter-spacing:.02em; padding:6px 2px; border-radius:10px;
  }
  nav.tabbar button svg{width:21px; height:21px;}
  nav.tabbar button.active{color:var(--olive);}
  nav.tabbar button.active svg{stroke:var(--olive);}

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-bottom:12px;
  }
  .card h2{margin:0 0 10px; font-size:15px; font-weight:700;}
  .card h3{margin:0 0 8px; font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}

  .pinned{border-color:var(--line); background:var(--surface); padding:0; overflow:hidden;}
  .pinned .coll-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px; cursor:pointer;
  }
  .pinned .coll-head h3{margin:0;}
  .pinned .chev{transition:transform .2s; color:var(--text-dim); flex-shrink:0;}
  .pinned.open .chev{transform:rotate(180deg);}
  .pinned .coll-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .pinned.open .coll-body{max-height:3000px;}
  .pinned .coll-inner{padding:0 16px 16px;}

  .rule{font-size:13.5px; line-height:1.5; color:var(--text); margin:0 0 8px; padding-left:14px; position:relative;}
  .rule:before{content:"·"; position:absolute; left:0; color:var(--olive); font-weight:900;}
  .rule:last-child{margin-bottom:0;}

  .sizegrid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; font-size:13px;}
  .sizegrid div span{display:block; color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:1px;}

  .band{padding:12px 16px;}
  .band.am{border-left:3px solid var(--gold);}
  .band.pm{border-left:3px solid var(--navy); border-top:1px solid var(--line);}
  .band .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:8px;}
  .band.am .label{color:var(--gold);}
  .band.pm .label{color:var(--navy);}
  .step{font-size:13px; line-height:1.45; margin-bottom:7px; display:flex; gap:8px;}
  .step:last-child{margin-bottom:0;}
  .step .n{color:var(--text-dim); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .step b{font-weight:600;}
  .step .note{color:var(--text-dim); font-size:12px; display:block;}

  /* checklist items */
  .item{display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .body{flex:1; order:1;}
  .box{
    width:21px; height:21px; border-radius:6px; border:1.5px solid var(--text-dim);
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s; order:2;
  }
  .item .title{font-size:13.5px; font-weight:600; line-height:1.35;}
  .item.checked .box{background:var(--olive); border-color:var(--olive);}
  .box svg{width:13px; height:13px; opacity:0; transition:opacity .15s;}
  .box, .subitem-box{color:var(--on-accent);}
  .item.checked .box svg{opacity:1;}
  .item.checked .title{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .item .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .badge{display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:1px;}
  .badge.pending{background:color-mix(in srgb, var(--gold) 18%, transparent); color:var(--gold);}

  .glance-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .glance-head h3{margin:0;}

  /* home: week strip + day agenda */
  .home-cal{margin:-4px 0 12px; touch-action:none;}
  .home-cal-head{display:flex; align-items:center; gap:2px; margin:0 -8px 2px 2px;}
  .home-cal-title{flex:1; font-size:15px; font-weight:800;}
  .home-cal-today{border:1px solid var(--line); background:none; color:var(--text); font:inherit; font-size:12px; font-weight:700; padding:5px 11px; border-radius:14px; margin-right:4px;}
  .home-cal .cal-nav{width:38px; height:38px;}
  .home-week, .home-month{display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;}
  .home-month{gap:2px 4px;}
  .home-cal.anim .home-week, .home-cal.anim .home-month{animation:homeCalIn .22s ease-out;}
  @keyframes homeCalIn{from{opacity:0; transform:translateY(-8px);}}
  .home-day{
    display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; padding:8px 0 6px;
    border:none; border-radius:12px; background:none; color:var(--text-dim); font:inherit;
    font-size:10.5px; font-weight:700;
  }
  .home-day b{font-size:16px; font-weight:800; color:var(--text); line-height:1.1;}
  .home-month .home-day{padding:6px 0 4px; gap:2px;}
  .home-month .home-day b{font-size:14.5px; font-weight:700;}
  .home-day.today:not(.on){box-shadow:inset 0 0 0 1px var(--line);}
  .home-day.past:not(.on){opacity:.5;}
  .home-day.blank{visibility:hidden;}
  .home-day.on{background:var(--olive); color:var(--on-accent);}
  .home-day.on b{color:var(--on-accent);}
  .home-day .marks{display:flex; align-items:center; gap:2px; height:9px;}
  .home-day .marks i{width:5px; height:5px; border-radius:50%; background:var(--gold);}
  .home-day .marks svg{width:9px; height:9px; color:var(--navy); stroke-width:2.6;}
  .home-day.on .marks i{background:var(--on-accent);}
  .home-day.on .marks svg{color:var(--on-accent);}
  .home-cal-grab{display:flex; justify-content:center; width:100%; padding:8px 0 2px; border:none; background:none;}
  .home-cal-grab span{width:36px; height:4px; border-radius:2px; background:var(--line);}
  .home-hero{display:flex; align-items:center; gap:14px; margin:0 2px 14px;}
  .home-hero h2{margin:0; font-size:22px; font-weight:800; letter-spacing:-.01em; line-height:1.2;}
  .home-hero .sub{color:var(--text-dim); font-size:13px; margin-top:3px;}
  .home-ring{width:58px; height:58px; flex-shrink:0;}
  .home-sec{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:16px 2px 6px;}
  .home-hero + .home-sec{margin-top:6px;}
  .home-sec.overdue{color:var(--danger);}
  .home-list{padding-top:2px; padding-bottom:2px; margin-bottom:0;}
  .home-list .todo-wrap:last-of-type{border-bottom:none;}
  .home-list .empty{padding:14px 0;}
  .wash-row .wash-icon{order:1; display:flex; align-items:center; justify-content:center; width:40px; height:44px; flex-shrink:0; color:var(--navy);}
  #todo-list .wash-row .item{padding-left:20px;} /* lines up with rows that have a drag handle */
  .wash-row .wash-icon svg{width:18px; height:18px;}
  .wash-tag{color:var(--navy); font-weight:700;}
  .home-star{display:inline-flex; vertical-align:-2px; margin-left:6px; color:var(--gold);}
  .home-star svg{width:13px; height:13px;}
  .home-more{display:block; border:none; background:none; padding:10px 0 6px; color:var(--link); font:inherit; font-size:12.5px; font-weight:700;}
  .home-all{margin:6px 2px 0;}

  /* shopping */
  .want-card{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line);}
  .want-card:last-child{border-bottom:none;}
  .want-card .body{flex:1;}
  .want-card .name{font-size:13.5px; font-weight:700; line-height:1.35;}
  .want-card .meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .link{font-size:12px; color:var(--link); text-decoration:none; font-weight:600; display:inline-block; margin-top:4px;}
  .want-card .price{font-size:14px; font-weight:700; color:var(--gold); margin-top:5px;}
  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px 2px; margin-top:6px; border-top:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--text-dim);
  }
  .total-row span{font-size:14px; font-weight:700; color:var(--text);}
  .toggle{
    flex-shrink:0; padding:7px 12px; border-radius:20px; border:1.5px solid var(--olive-dim);
    background:none; color:var(--olive); font-size:11px; font-weight:700; font-family:inherit;
    letter-spacing:.03em; white-space:nowrap;
  }
  .toggle.done{background:var(--olive); color:var(--on-accent); border-color:var(--olive);}
  .cat-title{font-size:11.5px; font-weight:700; color:var(--olive); margin:12px 0 2px;}
  .cat-title:first-child{margin-top:0;}
  .insight{font-size:10.5px; font-weight:600; color:var(--text-dim); background:var(--surface-2);
    padding:2px 7px; border-radius:8px; white-space:nowrap;}
  .footnote{font-size:11px; color:var(--text-dim); margin:8px 0 0; font-style:italic;}
  /* routine checklist (Skin & Hair "Today" card) */
  .routine-band{padding-top:6px;}
  .routine-band + .routine-band{border-top:1px solid var(--line); margin-top:8px; padding-top:12px;}
  .routine-band-head{
    display:flex; align-items:center; gap:8px; width:100%; min-height:40px; padding:0;
    border:none; background:none; color:var(--text); font:inherit; text-align:left; cursor:pointer;
  }
  .routine-band-head .label{flex:1;}
  .routine-band-head .chev{color:var(--text-dim); transition:transform .2s; flex-shrink:0;}
  .routine-band.open .routine-band-head .chev{transform:rotate(180deg);}
  .routine-count.complete{display:inline-flex; align-items:center; gap:4px; color:var(--olive);}
  .routine-count.complete svg{width:12px; height:12px;}
  .routine-band .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700;}
  .routine-band.am .label{color:var(--gold);}
  .routine-band.pm .label{color:var(--navy);}
  .routine-count{font-size:11.5px; font-weight:700; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .routine-step{
    display:flex; align-items:flex-start; gap:12px; width:100%; min-height:44px; padding:11px 0;
    border:none; background:none; color:var(--text); font:inherit; font-size:13px; line-height:1.4; text-align:left;
  }
  .routine-step + .routine-step{border-top:1px solid color-mix(in srgb, var(--line) 60%, transparent);}
  .routine-step .box{order:0; margin-top:-1px;} /* base .box is order:2 (checkbox-right lists) */
  .routine-text{flex:1; min-width:0;}
  .routine-step.done .box{background:var(--olive); border-color:var(--olive);}
  .routine-step.done .box svg{opacity:1;}
  .routine-step.done .routine-text{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .routine-text b{font-weight:600;}
  .routine-text .note, .step .note{display:block; color:var(--text-dim); font-size:12px;}
  /* this week overview */
  .week-day + .week-day{border-top:1px solid var(--line);}
  .week-day-head{
    display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:0;
    border:none; background:none; color:var(--text); font:inherit; text-align:left;
  }
  .week-day-name{width:34px; flex-shrink:0; font-size:13px; font-weight:700; color:var(--text-dim);}
  .week-day.today .week-day-name{color:var(--text);}
  .week-day-extras{flex:1; min-width:0; font-size:12.5px; color:var(--text-dim);}
  .week-day-extras .badge.today{margin:0 8px 0 0;}
  .week-day-done{display:flex; color:var(--olive);}
  .week-day-done svg{width:14px; height:14px;}
  .week-day .chev{color:var(--text-dim); transition:transform .2s; flex-shrink:0;}
  .week-day.open .chev{transform:rotate(180deg);}
  .week-day-body{padding:0 0 12px 44px;}
  .week-day-body .wl{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin:6px 0 4px;}
  .week-day-body .wl.am{color:var(--gold);} .week-day-body .wl.pm{color:var(--navy);}
  .routine-sub{margin-left:6px; text-transform:none; letter-spacing:0; font-weight:600; color:var(--text-dim);}
  /* modal "days" field */
  .day-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .day-chip{position:relative; cursor:pointer;}
  .day-chip input{position:absolute; opacity:0; pointer-events:none;}
  .modal-field .day-chip span{
    display:inline-flex; align-items:center; justify-content:center; min-width:42px; min-height:40px; margin:0;
    border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text-dim); font-size:12.5px; font-weight:700; text-transform:none; letter-spacing:0;
  }
  .modal-field .day-chip input:checked + span{background:var(--olive); border-color:var(--olive); color:var(--on-accent);}
  .modal-field .day-chip input:focus-visible + span{outline:2px solid var(--olive); outline-offset:2px;}
  .badge.today{background:color-mix(in srgb, var(--olive) 22%, transparent); color:var(--olive); margin-left:8px;}
  .badge.wash{background:color-mix(in srgb, var(--navy) 22%, transparent); color:var(--navy); margin-left:8px;}
  .progress-wrap{margin-bottom:12px;}
  .progress-label{display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
  .progress-label b{color:var(--text); font-weight:700;}
  .progress-bar{height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--olive)); border-radius:5px; transition:width .3s ease;}

  .skeleton{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
  .skel-line{height:12px; border-radius:6px; background:var(--surface-2); margin-bottom:10px;
    animation:pulse 1.2s ease-in-out infinite;}
  .skel-line:last-child{margin-bottom:0; width:60%;}
  @keyframes pulse{0%,100%{opacity:.5;} 50%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .skel-line{animation:none; opacity:.7;} }

  :focus-visible{outline:2px solid var(--olive); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important; animation-duration:.001ms !important;}
  }

  .toast{
    position:fixed; left:50%; bottom:calc(82px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:20px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:40; /* above the composer sheet */
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--danger); color:var(--danger-text);}

  .empty{font-size:12.5px; color:var(--text-dim); font-style:italic; padding:6px 2px;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  #pull-indicator{
    height:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
    gap:8px; color:var(--text-dim); font-size:12px; font-weight:600; letter-spacing:.02em;
  }
  #pull-indicator.animated{transition:height .2s ease;}
  #pull-indicator.ready{color:var(--olive);}
  .pull-spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--text-dim); border-top-color:transparent;
    flex-shrink:0; opacity:0; transition:opacity .15s;
  }
  #pull-indicator.ready .pull-spinner{border-color:var(--olive); border-top-color:transparent;}
  #pull-indicator.refreshing .pull-spinner{opacity:1; animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    #pull-indicator.refreshing .pull-spinner{animation:none;}
  }

  /* ---------- editing (per-card, toggled by the Edit chip in each card head) ---------- */
  .edit-chip{
    flex-shrink:0; border:1px solid var(--line); background:none; color:var(--text-dim); font-family:inherit;
    font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:4px 10px; border-radius:14px;
    display:inline-flex; align-items:center; gap:5px;
  }
  .edit-chip svg{width:11px; height:11px;}
  .edit-chip.on{background:var(--olive); border-color:var(--olive); color:var(--on-accent);}

  .editable{cursor:pointer;}
  .editable:active{background:var(--surface-2); border-radius:6px;}
  .inline-pencil{display:inline-flex; vertical-align:middle; margin-left:6px; color:var(--text-dim); opacity:.7; flex-shrink:0;}
  .inline-pencil svg{display:block;}

  .row-edit-btn{
    flex-shrink:0; width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  }
  .item .row-edit-btn{order:3;}

  .add-row{
    width:100%; margin:0 0 10px; padding:10px; border-radius:10px; border:1.5px dashed var(--olive-dim);
    background:none; color:var(--olive); font-size:12.5px; font-weight:700; font-family:inherit;
  }
  .add-row:active{background:color-mix(in srgb, var(--olive) 12%, transparent);}
  .reset-btn{
    width:100%; margin-top:10px; padding:10px; border-radius:10px; border:1.5px solid color-mix(in srgb, var(--danger) 35%, transparent);
    background:none; color:var(--danger); font-size:12.5px; font-weight:700; font-family:inherit;
  }
  .reset-btn:active{background:color-mix(in srgb, var(--danger) 12%, transparent);}

  /* to-do: star / sub-checklist / completed archive */
  .todo-wrap{border-bottom:1px solid var(--line);}
  .todo-wrap:last-child{border-bottom:none;}
  .todo-wrap .item{border-bottom:none;}
  .todo-icon-btn{
    flex-shrink:0; width:26px; height:26px; border-radius:8px; border:none; background:none;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; position:relative;
  }
  .todo-icon-btn.starred{color:var(--gold);}
  .todo-icon-btn.active{color:var(--olive);}
  .subitem-list{padding:0 0 10px 26px;}
  .subitem-row{display:flex; align-items:center; gap:8px; padding:5px 0;}
  .sub-drag-handle{
    flex-shrink:0; width:18px; height:24px; margin-left:-4px; padding:0; border:none; background:none;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:grab; opacity:.55;
  }
  .sub-drag-handle svg{width:12px; height:12px;}
  .subitem-row.drag-active-sub{
    position:relative; z-index:15; background:var(--surface-2); border-radius:10px;
    outline:1.5px solid var(--olive); box-shadow:0 8px 20px rgba(0,0,0,.5);
  }
  /* dragging left past the threshold: dashed outline = will promote to a full to-do */
  .subitem-row.drag-active-sub.promoting{outline-style:dashed; outline-color:var(--gold);}
  .subitem-box{
    width:16px; height:16px; border-radius:5px; border:1.5px solid var(--text-dim); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;
  }
  .subitem-box svg{width:10px; height:10px; opacity:0; transition:opacity .15s;}
  .subitem-box.checked{background:var(--olive); border-color:var(--olive);}
  .subitem-box.checked svg{opacity:1;}
  .subitem-text{flex:1; font-size:12.5px; color:var(--text);}
  .subitem-text.checked{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line);}
  .subitem-del{flex-shrink:0; width:22px; height:22px; border:none; background:none; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
  .subitem-add-toggle{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:14px;
    border:1.5px dashed var(--olive-dim); background:none; color:var(--olive);
    font-size:11.5px; font-weight:700; font-family:inherit;
    width:fit-content; margin:6px 0 2px auto;
  }
  .subitem-add-toggle:active{background:color-mix(in srgb, var(--olive) 12%, transparent);}
  .subitem-add{display:flex; gap:6px; margin:6px 0 2px;}
  .subitem-add input{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:12px; font-family:inherit; padding:0 10px; height:32px;
  }
  .subitem-add input::placeholder{color:var(--text-dim);}
  .subitem-add button{
    flex-shrink:0; width:32px; height:32px; border-radius:8px; border:none;
    background:var(--surface-2); color:var(--olive); display:flex; align-items:center; justify-content:center;
  }
  .completed-actions{flex-shrink:0; width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center;}

  /* to-do drag-to-reorder */
  .drag-handle{
    flex-shrink:0; width:24px; height:28px; margin-left:-6px; padding:0; border:none; background:none;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:grab; order:0; opacity:.65; align-self:center;
  }
  .todo-wrap.drag-active{position:relative; z-index:15;}
  .todo-wrap.drag-active .item{
    background:var(--surface-2); border-radius:12px; outline:1.5px solid var(--olive);
    box-shadow:0 10px 26px rgba(0,0,0,.55);
  }
  /* dragging right past the threshold: dragged row shows cyan, the row above
     (the future parent) gets a dashed cyan target outline */
  .todo-wrap.drag-active.indenting .item{outline-color:var(--gold);}
  .todo-wrap.indent-target .item{
    background:color-mix(in srgb, var(--gold) 7%, transparent); border-radius:12px;
    outline:1.5px dashed color-mix(in srgb, var(--gold) 55%, transparent);
  }
  body.todo-dragging, body.todo-dragging *{user-select:none; -webkit-user-select:none;}

  /* ---------- to-do rows: checkbox first, ~44px touch targets ----------
     Scoped to to-do rows only — the Style tab checklist shares .item/.box.
     Visible icons keep their old sizes; only the tappable boxes grow. Rows
     are 44px tall, and the body's 12px vertical padding centers a one-line
     title against the 44px buttons. */
  .todo-wrap .item, #todo-completed .item{padding:0 2px 0 0; gap:0;}
  .todo-wrap .item .body, #todo-completed .item .body{order:2; padding:12px 6px 12px 2px; min-width:0;}
  .todo-wrap .item .body{cursor:pointer;}
  .todo-wrap .drag-handle{height:44px; width:28px; margin-left:-8px; align-self:flex-start;}
  .todo-check{
    order:1; flex-shrink:0; width:40px; height:44px; padding:0; border:none; background:none;
    display:flex; align-items:center; justify-content:center;
  }
  .todo-check .box{margin-top:0;}
  .todo-icon-btn{width:36px; height:44px; border-radius:10px;}
  .todo-meta{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
  .overdue{color:var(--danger); font-weight:600;}
  .cat-title.overdue{color:var(--danger);}
  .todo-card-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .todo-card-head h3{margin:0;}
  .completed-toggle{
    display:flex; align-items:center; gap:8px; width:100%; min-height:44px; margin-top:8px; padding:0 2px;
    border:none; border-top:1px solid var(--line); background:none; color:var(--text-dim);
    font:inherit; font-size:12.5px; font-weight:700; text-align:left;
  }
  .completed-toggle span{flex:1;}
  .completed-toggle .chev{transition:transform .2s;}
  .completed-toggle.open .chev{transform:rotate(180deg);}
  .shop-link{
    display:flex; align-items:center; justify-content:space-between; width:100%; min-height:44px; margin-top:12px;
    padding:0; border:none; border-top:1px solid var(--line); background:none; color:var(--text);
    font:inherit; font-size:13px; font-weight:600; text-align:left;
  }
  .shop-link-go{color:var(--link); font-size:12.5px; font-weight:700;}
  .closet-item{cursor:default;}
  .filter-chip{
    flex-shrink:0; min-height:36px; padding:0 14px; border-radius:18px; border:1px solid var(--line);
    background:none; color:var(--text-dim); font:inherit; font-size:12.5px; font-weight:700;
  }
  .filter-chip.on{background:var(--olive); border-color:var(--olive); color:var(--on-accent);}
  /* Shopping filters: one row that scrolls sideways. The scrollbar is hidden (Android
     drew a gray bar under it), and on phones the row bleeds to the screen edges with
     a right-edge fade so a partly visible chip reads as "swipe for more". */
  .filter-chips{
    display:flex; gap:6px; margin:0 0 14px; overflow-x:auto; overscroll-behavior-x:contain;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .filter-chips::-webkit-scrollbar{display:none;}
  @media (max-width:767px){
    .filter-chips{
      margin-left:-16px; margin-right:-16px; padding:0 16px; scroll-padding:0 16px;
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent);
      mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent);
    }
    .filter-chips::after{content:""; flex:0 0 10px;} /* room to scroll the last chip clear of the fade */
  }
  .filter-chips .filter-chip{
    flex:0 0 auto; min-height:40px; padding:0 14px;
    display:flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap;
  }
  .fc-label{overflow:hidden; text-overflow:ellipsis;}
  .fc-count{flex-shrink:0; opacity:.7; font-variant-numeric:tabular-nums;}
  .want-tag{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--olive); margin-top:2px;}
  .want-tag svg{width:12px; height:12px;}
  .want-tag.moto{color:var(--gold);}
  /* wash-day calendar */
  .wash-freq{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700;}
  .cal-nav{width:44px; height:44px; border:none; background:none; color:var(--text); font:inherit; font-size:20px; border-radius:10px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; text-align:center;}
  .cal-dow{font-size:10.5px; font-weight:700; color:var(--text-dim); padding:4px 0;}
  .cal-day{
    min-height:42px; border:none; border-radius:10px; background:none; padding:0;
    color:var(--text); font:inherit; font-size:13px; font-variant-numeric:tabular-nums;
  }
  .cal-day.past{color:var(--text-dim); opacity:.55;}
  .cal-day.today{box-shadow:inset 0 0 0 1px var(--line); font-weight:800;}
  .cal-day.wash{background:color-mix(in srgb, var(--navy) 24%, transparent); color:var(--navy); font-weight:800; opacity:1;}
  .cal-day.blank{visibility:hidden;}
  .badge.kind-need{background:color-mix(in srgb, var(--gold) 20%, transparent); color:var(--gold); margin-left:8px;}
  .badge.kind-want{background:var(--surface-2); color:var(--text-dim); margin-left:8px;}
  /* floating + button (Home and To-Do) and the new-to-do composer sheet */
  .fab{
    display:none; position:fixed; right:18px; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:12;
    width:58px; height:58px; border:none; border-radius:18px; align-items:center; justify-content:center;
    background:var(--olive); color:var(--on-accent); box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .fab:active{transform:scale(.96);}
  body[data-tab="home"] .fab, body[data-tab="todo"] .fab, body[data-tab="wants"] .fab, body[data-tab="style"] .fab{display:flex;}
  body[data-tab="home"] main, body[data-tab="todo"] main,
  body[data-tab="wants"] main, body[data-tab="style"] main{padding-bottom:170px;} /* last row clears the button */
  .composer-backdrop{
    position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .composer-backdrop.open{opacity:1; pointer-events:auto;}
  .composer-sheet{
    width:100%; max-width:480px; max-height:85vh; overflow-y:auto; background:var(--surface);
    border:1px solid var(--line); border-radius:18px 18px 0 0;
    padding:8px 18px calc(18px + env(safe-area-inset-bottom)); transition:transform .2s;
  }
  .composer-grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:2px auto 10px;}
  .composer-sheet .modal-head h3{display:flex; align-items:center; gap:8px;}
  #composer-text, #composer-subs, #composer-extra input, #composer-buy input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-family:inherit; font-size:16px; padding:12px; resize:none;
  }
  #composer-text:focus, #composer-subs:focus, #composer-extra input:focus, #composer-buy input:focus{outline:2px solid var(--olive); outline-offset:1px;}
  #composer-extra{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  #composer-extra[hidden]{display:none;}
  #composer-extra input, #composer-buy input{min-height:46px; padding:0 12px;}
  #composer-buy{margin-top:10px;}
  #composer-buy[hidden]{display:none;}
  .composer-row{display:flex; gap:8px;}
  .composer-row input{flex:1; min-width:0;}
  #composer-chips2{margin-top:8px;}
  .composer-chips{display:flex; gap:6px; margin:12px -18px 0; padding:0 18px; overflow-x:auto; scrollbar-width:none;}
  .composer-chips::-webkit-scrollbar{display:none;}
  .composer-chips .filter-chip{flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; min-height:40px;}
  .composer-chips .filter-chip svg{width:14px; height:14px;}
  #composer-count:empty{display:none;}
  .composer-date-input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}
  .composer-add{width:100%; margin-top:14px; min-height:48px;}
  .badge.high{background:color-mix(in srgb, var(--navy) 22%, transparent); color:var(--navy); margin-left:8px;}
  .modal-section{display:block; margin:6px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700;}
  .backup-actions{display:flex; gap:8px; margin-top:10px;}
  .backup-btn{
    flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font:inherit; font-size:13px; font-weight:700;
  }
  .modal-field input[type=date]{min-height:44px; -webkit-appearance:none; appearance:none;}
  /* boxed buttons: the visible 26px box is drawn by ::before inside a 36×44 hit area */
  .todo-wrap .row-edit-btn, #todo-completed .completed-actions{
    width:36px; height:44px; border:none; background:none; position:relative; isolation:isolate;
  }
  .todo-wrap .row-edit-btn::before, #todo-completed .completed-actions::before{
    content:""; position:absolute; inset:9px 5px; z-index:-1;
    border:1px solid var(--line); background:var(--surface-2); border-radius:8px;
  }
  .subitem-row{padding:0; gap:2px; min-height:44px;}
  .sub-drag-handle{height:44px;}
  .subitem-check{
    flex-shrink:0; width:36px; height:44px; padding:0; border:none; background:none;
    display:flex; align-items:center; justify-content:center;
  }
  .subitem-del{width:36px; height:44px;}
  .subitem-add-toggle{min-height:40px; padding:8px 14px;}

  /* undo toast: tappable, unlike the plain status toast */
  .toast.actionable{pointer-events:auto; display:flex; align-items:center; gap:6px; padding:0 0 0 16px;}
  .toast-action{
    background:none; border:none; color:var(--olive); font:inherit; font-weight:800;
    min-height:44px; padding:0 16px; border-radius:20px;
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:30;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal-sheet{
    width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(16px); transition:transform .2s;
    max-height:80vh; overflow-y:auto;
  }
  .modal-backdrop.open .modal-sheet{transform:translateY(0);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .modal-head h3{margin:0; font-size:16px; font-weight:700;}
  .modal-x{background:none; border:none; color:var(--text-dim); font-size:22px; line-height:1; padding:4px 8px;}
  .modal-field{display:block; margin-bottom:12px;}
  .modal-field span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700; margin-bottom:5px;}
  .modal-field input, .modal-field textarea, .modal-field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:14px; font-family:inherit; padding:10px 12px; resize:vertical;
  }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus{outline:2px solid var(--olive); outline-offset:1px;}
  .modal-checkbox{display:flex; align-items:center; gap:8px;}
  .modal-checkbox span{margin:0; text-transform:none; font-size:13px; letter-spacing:0; color:var(--text);}
  .modal-checkbox input{width:auto;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-btn{flex:1; padding:12px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; font-family:inherit;}
  .modal-btn.primary{background:var(--olive); color:var(--on-accent);}
  .modal-btn.danger{background:none; border:1.5px solid var(--danger); color:var(--danger-text);}

  /* iOS Safari zooms the page when a focused field is under 16px. Must stay
     below the base input rules (incl. the modal's) so it wins the cascade. */
  @media (pointer:coarse){
    .subitem-add input, #composer-extra input, #composer-buy input,
    .modal-field input, .modal-field textarea, .modal-field select{font-size:16px;}
    .subitem-add input{height:38px;}
    .subitem-add button{width:38px; height:38px;}
  }

  /* ---------- hover feedback (mouse/trackpad only) ----------
     Mirrors the existing :active touch styles so pointer users can see what's
     interactive; gated on hover+fine-pointer so touch devices never get
     sticky-hover artifacts. */
  @media (hover:hover) and (pointer:fine){
    .home-day:not(.on):not(.blank):hover, .home-cal-today:hover, .coll-head:hover{background:var(--surface-2);}
    .home-more:hover{text-decoration:underline;}
    .week-day-head:hover .week-day-name, .routine-step:hover .routine-text{color:var(--text);}
    .routine-step:not(.done):hover .box{border-color:var(--olive);}
    .toggle:hover:not(.done), .edit-chip:hover:not(.on),
    .row-edit-btn:hover, .todo-icon-btn:hover, .completed-actions:hover,
    .subitem-del:hover, .modal-x:hover, .hard-refresh-btn:hover{background:var(--surface-2); color:var(--text);}
    .sync-btn:hover{background:var(--surface-2);} /* keeps its state color */
    .cal-day:not(.blank):hover, .cal-nav:hover{background:var(--surface-2);}
    .cal-day.wash:hover{background:color-mix(in srgb, var(--navy) 32%, transparent);}
    .todo-icon-btn.starred:hover{color:var(--gold);}
    .toggle:hover:not(.done){color:var(--olive);}
    .toggle.done:hover, .edit-chip.on:hover, .fab:hover,
    .modal-btn.primary:hover, .subitem-add button:hover{opacity:.85;}
    .add-row:hover, .subitem-add-toggle:hover{background:color-mix(in srgb, var(--olive) 12%, transparent);}
    .reset-btn:hover, .modal-btn.danger:hover{background:color-mix(in srgb, var(--danger) 12%, transparent);}
    .box:hover, .subitem-box:not(.checked):hover{border-color:var(--olive);}
    .link:hover{text-decoration:underline;}
    .drag-handle:hover, .sub-drag-handle:hover{opacity:1; color:var(--text);}
    .todo-wrap .row-edit-btn:hover, #todo-completed .completed-actions:hover{background:none;}
    .todo-wrap .row-edit-btn:hover::before, #todo-completed .completed-actions:hover::before{border-color:var(--text-dim);}
    .todo-check:hover .box, .subitem-check:hover .subitem-box:not(.checked){border-color:var(--olive);}
  }
  body.todo-dragging .drag-handle, body.todo-dragging .sub-drag-handle{cursor:grabbing;}

  /* ---------- desktop (≥768px): tab bar moves to the top, content centers ----------
     Body is a flex column and main scrolls internally, so the nav can leave its
     fixed-bottom position and slot between header and main via flex `order`.
     The shared max(24px, 50% - 380px) padding keeps header, tabs, and content
     aligned on one centered 760px column. */
  @media (min-width:768px){
    header{order:-2; padding:18px max(24px, calc(50% - 380px)) 14px;}
    nav.tabbar{
      order:-1; position:static;
      border-top:none; border-bottom:1px solid var(--line);
      padding:0 max(24px, calc(50% - 380px)); gap:2px;
    }
    nav.tabbar button{
      flex:0 0 auto; flex-direction:row; gap:8px;
      font-size:13px; letter-spacing:.01em; padding:13px 16px;
      border-radius:0; position:relative; cursor:pointer;
    }
    nav.tabbar button svg{width:18px; height:18px;}
    nav.tabbar button:hover{color:var(--text);}
    nav.tabbar button.active::after{
      content:""; position:absolute; left:14px; right:14px; bottom:-1px;
      height:2px; background:var(--olive); border-radius:2px;
    }
    main{padding:24px max(24px, calc(50% - 380px)) 48px;}
    .fab{bottom:32px; right:32px;}
    body[data-tab="home"] main, body[data-tab="todo"] main,
    body[data-tab="wants"] main, body[data-tab="style"] main{padding-bottom:110px;}
    .composer-backdrop{align-items:center;}
    .composer-sheet{border-radius:18px; padding-bottom:18px;}
    .composer-grab{display:none;}
    .composer-chips{flex-wrap:wrap; overflow:visible; margin:12px 0 0; padding:0;}
    .hard-refresh-btn{display:flex;}
    .toast{bottom:32px;}
    .modal-backdrop{align-items:center;}
    .modal-sheet{border-radius:18px; padding:18px;}
  }
  /* Large screens: widen the column to 920px so 1440px+ displays aren't
     mostly empty margin. Lists stay single-column on purpose. */
  @media (min-width:1440px){
    header{padding-left:max(24px, calc(50% - 460px)); padding-right:max(24px, calc(50% - 460px));}
    nav.tabbar{padding-left:max(24px, calc(50% - 460px)); padding-right:max(24px, calc(50% - 460px));}
    main{padding-left:max(24px, calc(50% - 460px)); padding-right:max(24px, calc(50% - 460px));}
  }
</style>
</head>
<body data-tab="home">

<header>
  <div class="header-row">
    <h1 id="headline">Home</h1>
    <div class="header-meta">
      <div class="eyebrow" id="header-date"></div>

// ---------- storage helpers (one JSON blob per key, plain localStorage) ----------
function loadContent(key, defaults){
  try{
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(defaults));
}
function saveContent(key, data, {toast = true} = {}){
  try{
    localStorage.setItem(key, JSON.stringify(data));
    markDataChanged();
    if (toast) showToast("Saved");
  }catch(e){
    console.error("save failed", e);
    showToast("Save failed — storage may be full or disabled", true);
  }
}
function genId(prefix){
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
}
let toastTimer;
function showToast(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("actionable");
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), isError ? 2600 : 1400);
}
function showUndoToast(msg, onUndo){
  const t = document.getElementById("toast");
  t.innerHTML = `<span>${escapeHtml(msg)}</span><button type="button" class="toast-action">Undo</button>`;
  t.classList.remove("error");
  t.classList.add("show", "actionable");
  t.querySelector(".toast-action").onclick = () => {
    clearTimeout(toastTimer);
    t.classList.remove("show", "actionable");
    onUndo();
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show", "actionable"), 5000);
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function escapeAttr(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}
// Only http(s) links are rendered; anything else (javascript:, data:, junk) is dropped.
function safeUrl(u){
  if (!u) return "";
  try{
    const url = new URL(String(u), location.href);
    return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
  }catch(e){ return ""; }
}
function linkHtml(u, attrs, inner){
  const href = safeUrl(u);
  return href ? `<a href="${escapeAttr(href)}" target="_blank" rel="noopener" ${attrs}>${inner}</a>` : "";
}

// ---------- RENDER: HOME ----------
// ---------- to-do dates ----------
// A to-do's `due` is a local "YYYY-MM-DD" string, or null for Anytime. Older
// data stored `day` (a bare weekday name with no real date); migrateTodoDays()
// converts that to the next occurrence of the weekday, today included.
// Date math runs at local noon so DST shifts can't push a day over a boundary.
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function noonOf(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d, 12); }
function addDaysIso(n){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return isoDate(d); }
function daysFromToday(iso){
  const now = new Date(); now.setHours(12,0,0,0);
  return Math.round((noonOf(iso) - now) / 86400000);
}
function nextWeekdayIso(dayIdx){ return addDaysIso((dayIdx - new Date().getDay() + 7) % 7); }
function dueLabel(iso){
  const n = daysFromToday(iso);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n > 1 && n < 7) return WEEKDAYS[noonOf(iso).getDay()];
  return noonOf(iso).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
// Groups in display order. Overdue and Today sit above Anytime because they're
// time-critical and usually short; Anytime stays near the top so new to-dos
// (undated by default) land in view.
function todoGroup(t){
  if (!t.due) return "anytime";
  const n = daysFromToday(t.due);
  if (n < 0) return "overdue";
  if (n === 0) return "today";
  return n < 7 ? "d" + n : "later";
}
function todoGroups(){
  const g = [
    {key:"overdue", label:"Overdue", due:"keep"},
    {key:"today", label:"Today", due:addDaysIso(0)},
    {key:"anytime", label:"Anytime", due:""},
    {key:"d1", label:"Tomorrow", due:addDaysIso(1)}
  ];
  for (let n = 2; n < 7; n++) g.push({key:"d"+n, label:WEEKDAYS[noonOf(addDaysIso(n)).getDay()], due:addDaysIso(n)});
  g.push({key:"later", label:"Later", due:"keep"});
  return g;
}
function migrateTodoDays(list){
  let changed = false;
  list.forEach(t => {
    if ("day" in t){
      if (t.due === undefined){
        const i = WEEKDAYS.indexOf(t.day);
        t.due = i >= 0 ? nextWeekdayIso(i) : null;
      }
      delete t.day;
      changed = true;
    }
    if (t.due === undefined){ t.due = null; changed = true; }
  });
  return changed;
}
// Trailing date word in a new to-do: "dentist fri", "call mom tomorrow",
// "pay rent by today". Only the final word counts, and the composer lights up
// the matching chip (tap it to dismiss), so a title that legitimately ends in
// a day name can be kept as plain text.
const DAY_ALIASES = {sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6};
function parseQuickAdd(raw){
  const m = raw.match(/^(.*?)\s+(?:on\s+|by\s+)?(today|tonight|tomorrow|tmrw|tmr|sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)$/i);
  if (!m || !m[1].trim()) return {text:raw, due:null};
  const w = m[2].toLowerCase();
  let due;
  if (w === "today" || w === "tonight") due = addDaysIso(0);
  else if (w.startsWith("tom") || w.startsWith("tm")) due = addDaysIso(1);
  else due = nextWeekdayIso(DAY_ALIASES[w.slice(0,3)]);
  return {text:m[1].trim(), due};
}
// ---------- HOME: calendar strip + day agenda ----------
// Home is a day planner. A Monday-first week strip picks the day; swiping it
// sideways pages weeks, and swiping it down (or the chevron) opens the full
// month, so any date can be picked. The list below shows everything due that
// day; today also carries Overdue and a short Anytime peek. To-dos finished
// that day stay visible, struck through, so the progress ring has something to
// show. Selection is per-session only.
let homeDate = null;     // selected "YYYY-MM-DD"; null means today
let homeAnchor = null;   // a date inside the week/month on screen; null follows homeDate

function shiftHomeCal(delta){
  const d = noonOf(homeAnchor || homeSelected());
  if (homeCalOpen){ d.setDate(1); d.setMonth(d.getMonth() + delta); }
  else d.setDate(d.getDate() + 7 * delta);

function completedOn(t, iso){ return t.done && !!t.completedAt && isoDate(new Date(t.completedAt)) === iso; }
function starredFirst(list){ return [...list.filter(t => t.starred), ...list.filter(t => !t.starred)]; }
const byDue = (a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
function homeDayItems(iso){
  const today = addDaysIso(0);
  const open = starredFirst(todoList.filter(t => !t.done && t.due === iso));
  const wash = isWashDay(noonOf(iso));
  if (iso > today) return {wash, overdue:[], anytime:[], open, done:todoList.filter(t => t.done && t.due === iso)};
  // A past day shows what was due then (still open) and what got done that day
  if (iso < today) return {wash, overdue:[], anytime:[], open, done:todoList.filter(t => completedOn(t, iso))};
  // Today's done list: anything ticked off today that wasn't scheduled for later
  return {wash, open,
    overdue:todoList.filter(t => !t.done && todoGroup(t) === "overdue").sort(byDue),
    done:todoList.filter(t => completedOn(t, iso) && (!t.due || t.due <= iso)),
    anytime:starredFirst(todoList.filter(t => !t.done && !t.due))};

// Open to-dos per due date, for the calendar dots; today's count includes overdue
function homeDueCounts(){
  const today = addDaysIso(0), counts = {};
  todoList.forEach(t => {
    if (t.done || !t.due) return;
    const key = t.due < today ? today : t.due;
    counts[key] = (counts[key] || 0) + 1;

}
function homeCalDayHtml(d, counts, monthView){

function homeCalHtml(){
  const counts = homeDueCounts();
  const anchor = noonOf(homeAnchor || homeSelected());
  const today = addDaysIso(0);
  let body, period, showsToday;
  if (homeCalOpen){
    const first = new Date(anchor); first.setDate(1);
    const lead = (first.getDay() + 6) % 7; // Monday-first, like the wash-day calendar
    const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    body = ["M","T","W","T","F","S","S"].map(x => `<div class="cal-dow">${x}</div>`).join("");
    for (let i = 0; i < lead; i++) body += `<div class="home-day blank"></div>`;
    for (let n = 1; n <= days; n++) body += homeCalDayHtml(new Date(first.getFullYear(), first.getMonth(), n, 12), counts, true);
    body = `<div class="home-month">${body}</div>`;
    period = first;
    showsToday = today.slice(0, 7) === isoDate(first).slice(0, 7);
  } else {
    const start = new Date(anchor); start.setDate(start.getDate() - (start.getDay() + 6) % 7);
    body = "";
    for (let n = 0; n < 7; n++){ const d = new Date(start); d.setDate(start.getDate() + n); body += homeCalDayHtml(d, counts, false); }
    body = `<div class="home-week">${body}</div>`;

// The calendar strip's own gestures: down opens the month, up closes it, and

(function(){

    on = !!e.target.closest(".home-cal");
    if (on){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, {passive:true});
  panel.addEventListener("touchmove", e => { if (on) e.preventDefault(); }, {passive:false});
  panel.addEventListener("touchend", e => {

    if (Math.abs(dy) > 35 && Math.abs(dy) > Math.abs(dx)) setHomeCalOpen(dy > 0);

  }, {passive:true});

function editTodo(id){

  ], {text:t.text, due:t.due||""},

// Completed to-dos auto-move to a hidden archive (todo-archive-content, synced,
// capped) once they're 7+ days old, keeping the Completed card short-term only.
// Runs on load, after a sync pull, and on return to foreground; saves silently
// (no "Saved" toast) since the user didn't do anything. Returns true if it
// changed anything so callers know to re-render.
const TODO_RETENTION_MS = 7 * 24 * 60 * 60 * 1000;
const TODO_ARCHIVE_MAX = 200;
function archiveOldTodos(){
  let changed = false;
  // done items missing a stamp (older data): stamp now so their 7 days start today
  todoList.forEach(t => { if (t.done && !t.completedAt){ t.completedAt = Date.now(); changed = true; } });
  const cutoff = Date.now() - TODO_RETENTION_MS;
  const old = todoList.filter(t => t.done && t.completedAt < cutoff);
  if (old.length){
    const archive = loadContent("todo-archive-content", []);
    archive.push(...old.map(t => ({
      text:t.text, completedAt:t.completedAt, due:t.due || null,
      subitems:(t.subitems || []).map(s => ({text:s.text, done:!!s.done}))
    })));
    archive.sort((a,b) => (b.completedAt||0) - (a.completedAt||0));
    if (archive.length > TODO_ARCHIVE_MAX) archive.length = TODO_ARCHIVE_MAX;
    todoList = todoList.filter(t => !old.includes(t));
    writeQuietly("todo-archive-content", archive);
    changed = true;
  }
  if (changed) writeQuietly("todo-content", todoList);
  return changed;
}

// ---------- RENDER: SKIN/HAIR ----------
// ---------- SKIN & HAIR ROUTINE ----------
// One routine instead of seven per-day copies: AM steps, PM steps, and a
// wash-day PM that replaces PM on wash days. A step with `days` (weekday
// numbers, 0 = Sun) only happens on those days; no `days` means every day.
// Older data stored seven full day lists (skin-days-content); routineFromDays()
// folds them into this shape without losing which step happens on which day.
// Migrated step ids are derived from the step's text, so every device computes
// the same ids and synced check-offs keep pointing at the same steps.
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let openWeekDays = new Set();

function decodeEntities(s){
  return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
}
function stableStepId(band, label, product){
  const str = band + "|" + label + "|" + product;
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return band + "-" + (h >>> 0).toString(36);
}
function routineFromDays(days){
  const toStep = (band, raw) => {
    const label = decodeEntities(raw[0]), product = decodeEntities(raw[1]);
    const step = {id:stableStepId(band, label, product), label, product};
    if (raw[2]) step.note = decodeEntities(raw[2]);
    return step;
  };
  // Ordered union of every day's list; each step remembers the days it was on
  const merge = (band, lists) => {
    const merged = [];
    lists.forEach(({dow, steps}) => {
      let at = 0;
      steps.forEach(raw => {
        const step = toStep(band, raw);
        let i = merged.findIndex(m => m.step.id === step.id);
        if (i < 0){ merged.splice(at, 0, {step, days:new Set()}); i = at; }
        merged[i].days.add(dow);
        at = i + 1;
      });
    });
    return merged.map(({step, days}) => {
      if (days.size < lists.length){
        step.days = [...days].sort((a,b) => a - b);
        // a note like "Mon / Wed / Fri only" now duplicates `days`
        if (step.note && / only$/i.test(step.note)) delete step.note;
      }
      return step;
    });
  };
  const week = days.map(d => ({...d, dow:WEEKDAYS.indexOf(d.day)})).filter(d => d.dow >= 0);
  const washDay = week.find(d => d.pmWash && d.pmWash.length);
  return {
    am: merge("am", week.map(d => ({dow:d.dow, steps:d.am || []}))),
    pm: merge("pm", week.map(d => ({dow:d.dow, steps:d.pm || []}))),
    washPm: washDay ? merge("washPm", [{dow:washDay.dow, steps:washDay.pmWash}]) : []
  };
}
function routineForDate(date){
  const dow = date.getDay();
  const on = s => !s.days || s.days.includes(dow);
  const wash = isWashDate(date) && skinRoutine.washPm.length > 0;
  return {am:skinRoutine.am.filter(on), pm:wash ? skinRoutine.washPm : skinRoutine.pm.filter(on), wash};
}
function todayChecks(){
  const c = routineChecks[isoDate(new Date())];
  return {am:(c && c.am) || [], pm:(c && c.pm) || [], amDone:!!(c && c.amDone), pmDone:!!(c && c.pmDone)};
}
function toggleRoutineStep(band, id){
  const key = isoDate(new Date());
  const day = routineChecks[key] || (routineChecks[key] = {am:[], pm:[]});
  const i = day[band].indexOf(id);
  if (i >= 0) day[band].splice(i, 1); else day[band].push(id);
  const wasDone = !!day[band + "Done"];
  // amDone/pmDone are recorded when ticking so the streak survives later routine edits
  const r = routineForDate(new Date());
  day.amDone = r.am.length > 0 && r.am.every(s => day.am.includes(s.id));
  day.pmDone = r.pm.length > 0 && r.pm.every(s => day.pm.includes(s.id));
  const cutoff = addDaysIso(-60);
  Object.keys(routineChecks).forEach(k => { if (k < cutoff) delete routineChecks[k]; });
  try{
    localStorage.setItem("routine-checks", JSON.stringify(routineChecks));
    markDataChanged();
  }catch(e){ showToast("Save failed — storage may be full or disabled", true); }
  if (!wasDone && day[band + "Done"]) showToast(band === "am" ? "Morning routine done" : "Evening routine done");
  renderSkin();
  renderHome(); // both to-do views show the Wash hair row
}
// Consecutive days with both AM and PM finished, counting today only once it's done
function routineStreak(){
  const d = new Date(); d.setHours(12, 0, 0, 0);
  const full = k => { const c = routineChecks[k]; return !!(c && c.amDone && c.pmDone); };
  if (!full(isoDate(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (full(isoDate(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function daysText(days){
  const k = days.join(",");
  if (k === "1,2,3,4,5") return "Weekdays";
  if (k === "0,6") return "Weekends";
  return [...days].sort((a,b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DAY_SHORT[d]).join(" · ");
}
function routineStepText(s){
  return `<b>${escapeHtml(s.label)}</b> — ${escapeHtml(s.product)}${s.note ? `<span class="note">${escapeHtml(s.note)}</span>` : ""}`;
}
function toggleWeekDay(key){
  if (openWeekDays.has(key)) openWeekDays.delete(key); else openWeekDays.add(key);
  renderSkin();
}

// AM/PM bands on the Today card fold away: a finished band closes itself, an
// unfinished one stays open, and a tap overrides either for the rest of the day.
const routineBandChoice = {}; // "YYYY-MM-DD:am" -> open?
function routineBandOpen(key, steps, done){
  const k = `${isoDate(new Date())}:${key}`;
  return k in routineBandChoice ? routineBandChoice[k] : !(steps.length && done === steps.length);
}
function toggleRoutineBand(key){
  const r = routineForDate(new Date()), steps = r[key], checks = todayChecks();
  const done = steps.filter(s => checks[key].includes(s.id)).length;
  routineBandChoice[`${isoDate(new Date())}:${key}`] = !routineBandOpen(key, steps, done);
  renderSkin();
}
function renderSkin(){
  const el = document.getElementById("panel-skin");
  const now = new Date();
  const todayKey = isoDate(now);
  const r = routineForDate(now);
  const checks = todayChecks();
  const streak = routineStreak();

  // 1. Today: tick-off checklist
  const band = (key, label, steps) => {
    const done = steps.filter(s => checks[key].includes(s.id)).length;
    const rows = steps.map(s => {
      const on = checks[key].includes(s.id);
      return `<button class="routine-step ${on?'done':''}" role="checkbox" aria-checked="${on}" onclick="toggleRoutineStep('${key}','${s.id}')"><span class="box">${BOX_CHECK_SVG}</span><span class="routine-text">${routineStepText(s)}</span></button>`;
    }).join("");
    const open = routineBandOpen(key, steps, done);
    const complete = steps.length > 0 && done === steps.length;
    return `<div class="routine-band ${key} ${open ? 'open' : ''}">
        <button class="routine-band-head" onclick="toggleRoutineBand('${key}')" aria-expanded="${open}"><span class="label">${label}</span><span class="routine-count ${complete ? 'complete' : ''}">${complete ? `${BOX_CHECK_SVG}Done` : `${done}/${steps.length}`}</span>${CHEVRON_DOWN}</button>
        ${open ? (rows || '<div class="empty">No steps today.</div>') : ''}
      </div>`;
  };
  let html = `<div class="card routine-today">
      <div class="glance-head"><h3 style="margin:0;">Today — ${WEEKDAYS[now.getDay()]}${r.wash ? '<span class="badge wash">Wash day</span>' : ''}</h3>${streak ? `<span class="insight">${streak}-day streak</span>` : ''}</div>
      ${band("am", "AM", r.am)}
      ${band("pm", r.wash ? "PM · wash day" : "PM", r.pm)}
    </div>`;

  // 2. This week, Mon–Sun: only what differs from the base routine; tap a day for its full list
  const monday = new Date(now); monday.setHours(12, 0, 0, 0);
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  let week = "";
  for (let i = 0; i < 7; i++){
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const key = isoDate(d);
    const rd = routineForDate(d);
    const extras = [...rd.am, ...(rd.wash ? [] : rd.pm)].filter(s => s.days).map(s => escapeHtml(s.label));
    if (rd.wash) extras.unshift("Wash day");
    const log = routineChecks[key];
    const finished = !!(log && log.amDone && log.pmDone);
    const open = openWeekDays.has(key);
    const list = steps => steps.map((s, n) => `<div class="step"><span class="n">${n+1}.</span><div>${routineStepText(s)}</div></div>`).join("");
    week += `<div class="week-day ${key === todayKey ? 'today' : ''} ${open ? 'open' : ''}">
        <button class="week-day-head" onclick="toggleWeekDay('${key}')" aria-expanded="${open}">
          <span class="week-day-name">${DAY_SHORT[d.getDay()]}</span>
          <span class="week-day-extras">${key === todayKey ? '<span class="badge today">Today</span>' : ''}${extras.join(" · ") || "Base routine"}</span>
          ${finished ? `<span class="week-day-done" aria-label="Routine done">${BOX_CHECK_SVG}</span>` : ''}
          ${CHEVRON_DOWN}
        </button>
        ${open ? `<div class="week-day-body"><div class="wl am">AM</div>${list(rd.am)}<div class="wl pm">${rd.wash ? 'PM · wash day' : 'PM'}</div>${list(rd.pm)}</div>` : ''}
      </div>`;
  }
  html += `<div class="card"><div class="glance-head"><h3 style="margin:0;">This week</h3></div>${week}</div>`;

  // 3. Wash-day schedule: frequency + a calendar to pick the date
  const nextWash = nextWashDate();
  const nextLabel = daysUntilWashDay() === 0 ? "today"
    : nextWash.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  html += collapsibleCard({id:"wash-card", title:"Wash day", editable:false,
    insight:`${washFrequencyLabel()} · next ${nextLabel}`, body:washCalendarHtml()});

  // 4. The routine itself, edited in one place
  const edit = editCards.has('routine-card');
  const editorBand = key => {
    const steps = skinRoutine[key];
    const head = key === "washPm"
      ? `Wash-day PM<span class="routine-sub">replaces PM on wash days</span>`
      : key.toUpperCase();
    const rows = steps.map((s, n) => `<div class="step ${edit ? 'editable' : ''}" ${edit ? `onclick="editRoutineStep('${key}','${s.id}')"` : ''}>
        <span class="n">${n+1}.</span><div>${routineStepText(s)}${s.days ? `<span class="note">${daysText(s.days)} only</span>` : ''}${edit ? `<span class="inline-pencil">${PENCIL_ICON}</span>` : ''}</div>
      </div>`).join("");
    return `<div class="band ${key === 'am' ? 'am' : 'pm'}"><div class="label">${head}</div>
        ${edit ? `<button class="add-row" onclick="addRoutineStep('${key}')">+ Add step</button>` : ''}
        ${rows || '<div class="empty">No steps.</div>'}
      </div>`;
  };
  html += collapsibleCard({id:"routine-card", title:"Routine", insight:`${skinRoutine.am.length} AM · ${skinRoutine.pm.length} PM`,
    wrapBody:false, body:`${editorBand('am')}${editorBand('pm')}${skinRoutine.washPm.length || edit ? editorBand('washPm') : ''}`});

  // 5. Key rules (only shown once there are some)
  if (!skinRules.length){ el.innerHTML = html; return; }
  const rulesEdit = editCards.has('rules-skin');
  let rules = rulesEdit ? `<button class="add-row" onclick="addSkinRule()">+ Add rule</button>` : "";
  skinRules.forEach((r,i) => {
    rules += rulesEdit
      ? `<p class="rule editable" onclick="editSkinRule(${i})">${escapeHtml(r)}<span class="inline-pencil">${PENCIL_ICON}</span></p>`
      : `<p class="rule">${escapeHtml(r)}</p>`;
  });
  html += collapsibleCard({id:"rules-skin", title:"Key rules", insight:`${skinRules.length} rules`, body:rules});
  el.innerHTML = html;
}
function routineStepFields(band){
  const fields = [
    {key:"label", label:"Step name", type:"text"},
    {key:"product", label:"Product / description", type:"text"},
    {key:"note", label:"Note (optional)", type:"text"}
  ];
  if (band !== "washPm") fields.push({key:"days", label:"Only on these days — leave all off for every day", type:"days"});
  return fields;
}
function applyStepValues(step, v){
  step.label = v.label; step.product = v.product;
  if (v.note) step.note = v.note; else delete step.note;
  if (v.days && v.days.length && v.days.length < 7) step.days = v.days; else delete step.days;
}
function saveRoutine(){
  saveContent("skin-routine-content", skinRoutine);
  renderSkin();
  renderHomePanel();
}
function editRoutineStep(band, id){
  const s = skinRoutine[band].find(x => x.id === id);
  if (!s) return;
  openModal("Edit step", routineStepFields(band), {label:s.label, product:s.product, note:s.note || "", days:s.days || []},
    v => { if (!v.label || !v.product) return; applyStepValues(s, v); saveRoutine(); },
    () => { skinRoutine[band] = skinRoutine[band].filter(x => x.id !== id); saveRoutine(); }
  );
}
function addRoutineStep(band){
  openModal("Add step", routineStepFields(band), {days:[]},
    v => {
      if (!v.label || !v.product) return;
      const step = {id:genId(band)};
      applyStepValues(step, v);
      // keep "… — last step" entries (SPF, lash serum) last
      const list = skinRoutine[band], last = list[list.length - 1];
      if (last && /last step/i.test(last.label)) list.splice(list.length - 1, 0, step); else list.push(step);
      saveRoutine();
    }
  );
}

// ---------- wash-day schedule ----------
// Wash day repeats every `everyDays` days counting from `anchor` (a YYYY-MM-DD
// wash day). It's stored on the routine (skinRoutine.wash) so it syncs and backs
// up with it. Routines saved before the schedule was editable fall back to the
// original cadence: every 2 weeks from Thu Jul 16, 2026.
const DEFAULT_WASH = {anchor:"2026-07-16", everyDays:14};
const WASH_FREQUENCIES = [[7, "Every week"], [10, "Every 10 days"], [14, "Every 2 weeks"], [21, "Every 3 weeks"], [28, "Every 4 weeks"]];
let washCalOffset = 0; // months from the current one shown in the wash-day calendar
function washSchedule(){
  const w = skinRoutine && skinRoutine.wash;
  return w && /^\d{4}-\d{2}-\d{2}$/.test(w.anchor) && w.everyDays > 0 ? w : DEFAULT_WASH;
}
function washFrequencyLabel(){
  const n = washSchedule().everyDays;
  const hit = WASH_FREQUENCIES.find(([d]) => d === n);
  return hit ? hit[1] : `Every ${n} days`;
}
function isWashDate(date){
  const {anchor, everyDays} = washSchedule();
  const diff = Math.round((noonOf(isoDate(date)) - noonOf(anchor)) / 86400000);
  return ((diff % everyDays) + everyDays) % everyDays === 0;
}
function nextWashDate(){
  const d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 0; i < washSchedule().everyDays && !isWashDate(d); i++) d.setDate(d.getDate() + 1);
  return d;
}
function daysUntilWashDay(){ return daysFromToday(isoDate(nextWashDate())); }
function setWashSchedule(next, message){
  const prev = skinRoutine.wash ? {...skinRoutine.wash} : null;
  skinRoutine.wash = next;
  saveRoutine();
  showUndoToast(message, () => {
    if (prev) skinRoutine.wash = prev; else delete skinRoutine.wash;
    saveRoutine();
  });
}
function setWashDate(iso){
  const label = noonOf(iso).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  setWashSchedule({anchor:iso, everyDays:washSchedule().everyDays}, `Wash day set to ${label}`);
}
function setWashFrequency(n){
  // keep the series lined up with the next upcoming wash day
  setWashSchedule({anchor:isoDate(nextWashDate()), everyDays:n}, `Wash day: ${WASH_FREQUENCIES.find(([d]) => d === n)[1].toLowerCase()}`);
}
function shiftWashMonth(delta){ washCalOffset += delta; renderSkin(); }
function washCalendarHtml(){
  const first = new Date(); first.setHours(12, 0, 0, 0); first.setDate(1); first.setMonth(first.getMonth() + washCalOffset);
  const month = first.getMonth(), todayKey = isoDate(new Date());
  const lead = (first.getDay() + 6) % 7; // Monday-first grid
  const daysInMonth = new Date(first.getFullYear(), month + 1, 0).getDate();
  let cells = ["M","T","W","T","F","S","S"].map(d => `<div class="cal-dow">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += `<div class="cal-day blank"></div>`;
  for (let n = 1; n <= daysInMonth; n++){
    const d = new Date(first.getFullYear(), month, n, 12);
    const key = isoDate(d), wash = isWashDate(d);
    const cls = ["cal-day", wash ? "wash" : "", key === todayKey ? "today" : "", key < todayKey ? "past" : ""].filter(Boolean).join(" ");
    const label = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) + (wash ? ", wash day" : "");
    cells += `<button class="${cls}" onclick="setWashDate('${key}')" aria-label="${label}"${wash ? ' aria-pressed="true"' : ''}>${n}</button>`;
  }
  const freq = washSchedule().everyDays;
  const chips = WASH_FREQUENCIES.map(([n, text]) =>
    `<button class="filter-chip ${n === freq ? "on" : ""}" aria-pressed="${n === freq}" onclick="setWashFrequency(${n})">${text}</button>`).join("");
  return `<div class="wash-freq">${chips}</div>
    <div class="cal-head">
      <button class="cal-nav" onclick="shiftWashMonth(-1)" aria-label="Previous month">‹</button>
      <span>${first.toLocaleDateString('en-US', {month:'long', year:'numeric'})}</span>
      <button class="cal-nav" onclick="shiftWashMonth(1)" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <p class="footnote">Tap a date to make it a wash day — the schedule repeats from there.</p>`;
}
// Collapsible card used across tabs: the header (title, insight badge, optional
// Edit chip, chevron) toggles the body; open state lives in openPinned.
function collapsibleCard({id, title, insight = "", insightId = "", editable = true, body = "", wrapBody = true, innerId = ""}){
  return `<div class="card pinned ${openPinned.has(id) ? 'open' : ''}" id="${id}">

// Clothes still needed live on the Wants list, tagged with a wardrobe category
// (`wardrobeCat`). The closet is derived, not copied: owned capsule items plus
// wardrobe wants marked bought. Buying a wardrobe item puts it in the closet;
// un-buying takes it back out.
const WANT_CAT_OPTIONS = ["General", "Moto", ...CAP_CATS.map(c => "Wardrobe · " + c), "Wardrobe · Other"];
const DEFAULT_BELT_META = "Pending: merge with wardrobe belt? Price/link not locked in";
function closetItems(){
  return [
    ...capsule.map(item => ({kind:"capsule", item, title:item.title, sub:item.sub, cat:item.cat || "Other",
      price:item.price, estimated:item.estimated, link:item.link, pending:item.state === "pending"})),
    ...wantsList.filter(w => w.wardrobeCat && wantsState[w.id]).map(w => ({kind:"want", item:w, title:w.name,
      sub:w.meta, cat:w.wardrobeCat, price:w.price, estimated:w.estimated, link:w.link}))

function wardrobeShopping(){ return wantsList.filter(w => w.wardrobeCat && !wantsState[w.id]); }
// Older data kept a separate "Still need" list inside the capsule (state
// "needed", or toggled via style-state). Move those onto Wants. Ids are derived
// ("w-" + capsule id) so every device migrates to the same result; housekeeping,
// so it saves quietly like the other migrations.
function migrateWardrobeNeeds(){
  const stateOf = item => styleState[item.id] !== undefined ? styleState[item.id]
    : (item.state === "owned" || item.state === "pending" ? "owned" : "needed");
  const moved = capsule.filter(item => stateOf(item) !== "owned");
  const stale = Object.keys(styleState).length > 0;
  if (!moved.length && !stale) return false;
  capsule.forEach(item => { if (stateOf(item) === "owned" && item.state === "needed") item.state = "owned"; });
  capsule = capsule.filter(item => stateOf(item) === "owned");
  moved.forEach(item => {
    // The original data listed the brown belt twice (wardrobe + wants); fold them together
    if (item.id === "need-belt-brown"){
      const twin = wantsList.find(w => w.id === "belt-brown");
      if (twin){
        if (!twin.wardrobeCat) twin.wardrobeCat = item.cat || "Accessories";
        if (twin.meta === DEFAULT_BELT_META) twin.meta = "Price/link not locked in";
        return;
      }
    }
    const id = "w-" + item.id;
    if (wantsList.some(w => w.id === id)) return;
    const w = {id, name:item.title, meta:item.sub || "", price:item.price ?? null, link:item.link || null, wardrobeCat:item.cat || "Other"};
    if (item.estimated) w.estimated = true;
    wantsList.push(w);
  });
  styleState = {};
  writeQuietly("capsule-content", capsule);
  writeQuietly("wants-content", wantsList);
  writeQuietly("style-state", styleState);
  return true;
}

// Money summary for a list where some items may have no price yet. Each total
// appears once: a complete sum goes in the card-header badge (visible even when
// the card is collapsed); a partial sum goes in an in-card row labeled as
// partial so it never reads as the full cost; no prices at all shows nothing.
function priceSummary(items){
  const priced = items.filter(i => i.price != null);
  const sum = priced.reduce((s,i) => s + i.price, 0);
  const missing = items.length - priced.length;
  const full = priced.length > 0 && missing === 0;
  return {
    badge: full ? ` · $${fmtMoney(sum)}` : "",
    row: priced.length && !full
      ? `<div class="total-row">Known prices · ${missing} unpriced <span>$${fmtMoney(sum)}</span></div>` : ""
  };
}

function fmtMoney(n){
  return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
// Category is one of: General, Moto (motorcycle gear, `moto: true`), or a
// wardrobe category (`wardrobeCat`) — mutually exclusive.
function setWantCategory(w, choice){
  delete w.wardrobeCat; delete w.moto;
  if (choice === "Moto") w.moto = true;
  else if (choice && choice.startsWith("Wardrobe · ")) w.wardrobeCat = choice.slice("Wardrobe · ".length);
}
function wantCategoryChoice(w){
  return w.wardrobeCat ? "Wardrobe · " + w.wardrobeCat : w.moto ? "Moto" : "General";
}
// Every item is a "need" or a "want". Unless set explicitly, wardrobe items
// (which came from the old "still need" list) count as needs, everything else as wants.
function wantKind(w){ return w.kind === "need" || w.kind === "want" ? w.kind : (w.wardrobeCat ? "need" : "want"); }
// High priority first, then needs before wants, then cheapest; unpriced last.
function wantsOrder(a, b){
  return ((b.priority === "high") - (a.priority === "high"))
    || ((wantKind(a) === "need" ? 0 : 1) - (wantKind(b) === "need" ? 0 : 1))
    || ((a.price ?? Infinity) - (b.price ?? Infinity));
}
function renderWants(){
  const el = document.getElementById("panel-wants");
  let pending = "", done = "";
  const inFilter = w => wantsFilter === "all"
    || (wantsFilter === "wardrobe" ? !!w.wardrobeCat : wantsFilter === "moto" ? !!w.moto : wantKind(w) === wantsFilter);
  const allPending = wantsList.filter(w => !wantsState[w.id]);
  const pendingItems = allPending.filter(inFilter).sort(wantsOrder);
  const doneItems = wantsList.filter(w => !!wantsState[w.id] && inFilter(w)).sort(wantsOrder);
  const pendingSum = priceSummary(pendingItems), doneSum = priceSummary(doneItems);
  const wantRow = (w, isDone) => {
    const priceStr = w.price != null ? `${w.estimated?'~':''}$${fmtMoney(w.price)}${w.estimated?' (est.)':''}` : "—";
    const linkLine = linkHtml(w.link, 'class="link"', "View product →");
    const editBtn = editCards.has(isDone ? 'wants-purchased-card' : 'wants-pending-card')
      ? `<button class="row-edit-btn" onclick="event.stopPropagation(); editWant('${w.id}')">${PENCIL_ICON}</button>` : "";
    return `<div class="want-card">
        <div class="body">
          <div class="name">${escapeHtml(w.name)}<span class="badge kind-${wantKind(w)}">${wantKind(w) === "need" ? "Need" : "Want"}</span>${w.priority === "high" && !isDone ? '<span class="badge high">High</span>' : ""}</div>
          ${w.wardrobeCat ? `<div class="want-tag">${SHIRT_ICON}Wardrobe · ${escapeHtml(w.wardrobeCat)}${isDone ? " · in closet" : ""}</div>` : ""}
          ${w.moto ? `<div class="want-tag moto">${MOTO_ICON}Moto</div>` : ""}
          ${w.meta?`<div class="meta">${escapeHtml(w.meta)}</div>`:""}
          ${w.price != null ? `<div class="price">${priceStr}</div>` : ""}
          ${linkLine}
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
          <button class="toggle ${isDone?'done':''}" onclick="toggleWant('${w.id}')">${isDone?'Purchased':'Mark bought'}</button>
          ${editBtn}
        </div>
      </div>`;
  };
  pendingItems.forEach(w => { pending += wantRow(w, false); });
  doneItems.forEach(w => { done += wantRow(w, true); });
  let html = "";
  const chip = (key, label, n) => `<button class="filter-chip ${wantsFilter === key ? "on" : ""}" aria-pressed="${wantsFilter === key}" onclick="wantsFilter='${key}'; renderWants();"><span class="fc-label">${label}</span><span class="fc-count">${n}</span></button>`;
  html += `<div class="filter-chips">
      ${chip("all", "All", allPending.length)}
      ${chip("need", "Needs", allPending.filter(w => wantKind(w) === "need").length)}
      ${chip("want", "Wants", allPending.filter(w => wantKind(w) === "want").length)}
      ${chip("wardrobe", "Wardrobe", allPending.filter(w => w.wardrobeCat).length)}
      ${chip("moto", "Moto", allPending.filter(w => w.moto).length)}
    </div>`;
  html += collapsibleCard({id:"wants-pending-card", title:"To buy", insight:`${pendingItems.length}${pendingSum.badge}`, body:`
        ${pending||'<div class="empty">All caught up.</div>'}
        ${pendingSum.row}`});
  html += collapsibleCard({id:"wants-purchased-card", title:"Purchased", insight:doneItems.length ? doneItems.length + doneSum.badge : "None yet", body:`
        ${done||'<div class="empty">Nothing marked yet.</div>'}
        ${doneSum.row}`});
  const prevScroll = el.querySelector(".filter-chips")?.scrollLeft || 0;
  el.innerHTML = html;
  const row = el.querySelector(".filter-chips"), active = row && row.querySelector(".filter-chip.on");
  if (row){
    row.scrollLeft = prevScroll;
    if (active){
      const r = row.getBoundingClientRect(), a = active.getBoundingClientRect();
      if (a.left < r.left + 16) row.scrollLeft -= (r.left + 16) - a.left;
      else if (a.right > r.right - 28) row.scrollLeft += a.right - (r.right - 28);
    }
  }
}
