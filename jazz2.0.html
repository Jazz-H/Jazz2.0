<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#02060b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <link rel="apple-touch-icon" href="jarvis-icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="jarvis-icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme.js"></script>
  </head>
  <body data-tab="home">
    <header>
      <div class="header-row">
        <h1 id="headline">Home</h1>
        <div class="header-meta">
          <div class="eyebrow" id="header-date"></div>
        </div>
        <button
          class="theme-btn"
          id="theme-btn"
          data-action="theme-cycle"
          data-pref="system"
          title="Theme"
          aria-label="Theme"
        >
          <svg
            class="ti-system"
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
          </svg>
          <svg
            class="ti-light"
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
          <svg
            class="ti-dark"
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
        <button
          class="sync-btn"
          id="sync-btn"
          data-state="off"
          data-action="open-sync"
          title="Sync &amp; backup"
          aria-label="Sync and backup"
        >
          <svg
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
          </svg>
        </button>
        <button
          class="hard-refresh-btn"
          data-action="hard-refresh"
          title="Clear cached app files and reload (your data is kept)"
          aria-label="Hard refresh"
        >
          <svg
            viewBox="0 0 24 24"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M23 4v6h-6" />
            <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div id="pull-indicator"><span class="pull-spinner"></span><span class="pull-label">Pull to sync</span></div>
      <!-- Wallet / You: the two-view switch over the group's panels (shell.js renderTabSwitch) -->
      <div class="tab-switch" id="tab-switch" role="group" hidden></div>
      <!-- HOME -->
      <!-- the skeleton shows while the scripts load; renderHome() replaces it -->
      <section class="tabpanel active" id="panel-home" aria-busy="true">
        <div class="sk-wrap" aria-hidden="true">
          <div class="sk sk-line sk-w30"></div>
          <div class="sk sk-line sk-title"></div>
          <div class="sk sk-input"></div>
          <div class="sk-card">
            <div class="sk sk-line sk-w40"></div>
            <div class="sk sk-line sk-head"></div>
            <div class="sk sk-line"></div>
            <div class="sk sk-line sk-w80"></div>
            <div class="sk sk-line sk-w60"></div>
          </div>
          <div class="sk-tiles">
            <div class="sk sk-tile"></div>
            <div class="sk sk-tile"></div>
            <div class="sk sk-tile"></div>
            <div class="sk sk-tile"></div>
            <div class="sk sk-tile"></div>
            <div class="sk sk-tile"></div>
          </div>
        </div>
        <span class="sk-label">Loading Jarvis…</span>
      </section>
      <!-- TO-DO -->
      <section class="tabpanel" id="panel-todo"></section>
      <!-- CONSOLE (the orb): Ask / Capture box and this week's feed -->
      <section class="tabpanel" id="panel-console"></section>
      <!-- JAZZ 3.0 (in the You tab, with Beauty) -->
      <section class="tabpanel" id="panel-jazz3"></section>
      <!-- SKIN / HAIR (Beauty, in the You tab) -->
      <section class="tabpanel" id="panel-skin"></section>
      <!-- BUDGET (in the Wallet tab, with Shopping) -->
      <section class="tabpanel" id="panel-budget"></section>
      <!-- WANTS -->
      <section class="tabpanel" id="panel-wants">
        <div class="skeleton">
          <div class="skel-line"></div>
          <div class="skel-line"></div>
          <div class="skel-line"></div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" aria-live="polite"></div>

    <button class="fab" id="fab" data-action="open-composer" aria-label="Add a to-do">
      <svg
        viewBox="0 0 24 24"
        width="26"
        height="26"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>

    <div class="composer-backdrop" id="composer" aria-hidden="true" inert data-action="composer-backdrop">
      <div class="composer-sheet" id="composer-sheet" role="dialog" aria-modal="true" aria-labelledby="composer-title">
        <div class="composer-grab" aria-hidden="true"></div>
        <div class="modal-head">
          <h3 id="composer-title">
            <span id="composer-heading">New to-do</span> <span class="insight" id="composer-count"></span>
          </h3>
          <button class="modal-x" data-action="close-composer" aria-label="Close">&times;</button>
        </div>
        <textarea
          id="composer-text"
          rows="2"
          maxlength="200"
          enterkeyhint="send"
          autocomplete="off"
          data-input-action="composer-text"
        ></textarea>
        <div class="composer-chips" id="composer-chips"></div>
        <div class="composer-chips" id="composer-chips2" hidden></div>
        <div class="composer-row" id="composer-buy" hidden>
          <input id="cx-price" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Price" />
          <input id="cx-link" type="url" inputmode="url" placeholder="Link" />
        </div>
        <div id="composer-extra" hidden></div>
        <input
          type="date"
          id="composer-date"
          class="composer-date-input"
          tabindex="-1"
          aria-hidden="true"
          data-change-action="composer-date"
        />
        <button class="modal-btn primary composer-add" id="composer-add-btn" data-action="composer-add">
          Add to-do
        </button>
      </div>
    </div>

    <!-- Weekly Review (js/review.js): a sheet on phones, a dialog on desktop; filled when opened -->
    <div class="modal-backdrop rv-backdrop" id="review-sheet" aria-hidden="true" inert data-action="review-backdrop">
      <div
        class="modal-sheet rv-sheet"
        id="review-body"
        role="dialog"
        aria-modal="true"
        aria-labelledby="rv-title"
      ></div>
    </div>

    <!-- Ask Jarvis History (js/ask.js): the last 50 questions and answers; filled when opened -->
    <div class="modal-backdrop rv-backdrop" id="ask-sheet" aria-hidden="true" inert data-action="ask-history-backdrop">
      <div
        class="modal-sheet rv-sheet ak-sheet"
        id="ask-body"
        role="dialog"
        aria-modal="true"
        aria-labelledby="ask-title"
      ></div>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" inert data-action="modal-backdrop">
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
        <div class="modal-head">
          <h3 id="modal-heading">Edit</h3>
          <button class="modal-x" data-action="close-modal" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-actions">
          <button class="modal-btn danger" id="modal-delete-btn" data-action="modal-delete">Delete</button>
          <button class="modal-btn primary" data-action="modal-save">Save</button>
        </div>
      </div>
    </div>

    <nav class="tabbar" aria-label="Sections">
      <button data-tab="home" class="active" aria-current="page">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 11.5 12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9" />
        </svg>
        Home
      </button>
      <button data-tab="todo">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
        To-Do
      </button>
      <button data-tab="console" class="orb-tab">
        <span class="orb-core"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <circle cx="12" cy="12" r="8" stroke-dasharray="3 3" /></svg
        ></span>
        <span class="orb-label">Console</span>
      </button>
      <!-- Wallet: Budget | Shopping -->
      <button data-tab="wallet">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="6" width="18" height="13" rx="2.5" />
          <path d="M3 10h18" />
          <circle cx="16.5" cy="14.5" r="1.3" />
        </svg>
        Wallet
      </button>
      <!-- You: Beauty | Jazz 3.0 -->
      <button data-tab="you">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6" />
        </svg>
        You
      </button>
    </nav>

    <script src="js/constants.js"></script>
    <script src="js/core.js"></script>
    <script src="js/defaults.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/todo-dates.js"></script>
    <script src="js/holidays.js"></script>
    <script src="js/home.js"></script>
    <script src="js/jarvis.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/push.js"></script>
    <script src="js/composer.js"></script>
    <script src="js/todo.js"></script>
    <script src="js/skin.js"></script>
    <script src="js/shopping.js"></script>
    <script src="js/budget-bills.js"></script>
    <script src="js/budget-income.js"></script>
    <script src="js/budget-goals.js"></script>
    <script src="js/budget-import.js"></script>
    <script src="js/budget-view.js"></script>
    <script src="js/fitness.js"></script>
    <script src="js/jazz3.js"></script>
    <script src="js/console.js"></script>
    <script src="js/review.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/ask.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/drag-reorder.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/data-load.js"></script>
    <script src="js/import-link.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/boot.js"></script>
  </body>
</html>
